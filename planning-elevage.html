  //              comptent ainsi les mêmes jours, sans double décompte (les dates de congé sont connues des deux côtés).
  //              Un congé un DIMANCHE ou un JOUR FÉRIÉ prend sa place dans ce maximum mais n'est PAS DÉCOMPTÉ
  //              (leaveCounts) : il reste affiché, sans rien retirer au solde ni aux heures à faire.
  //   leaveDates : jours de congé décomptés de la semaine, dans le mois m (fiche d'heures).
  //   otherMonth, otherPlanned : le mois voisin, et s'il a un planning enregistré. Sans planning, la génération
  //              se fait au prorata et l'écran signale ces semaines (avertissement).
  //   otherHours : heures déjà prévues l'autre mois cette semaine (0 sans planning voisin).
  // Le gérant n'a ni objectif d'heures ni repos imposé (counted = faux).
  function weekRules(data,m){
    const R=data.settings, otherCache={}, monthLen=monthDays(m).length;
    // otherMonth : planning enregistré du mois voisin (créneaux et affectations), lu une seule fois.
    function otherMonth(om){
      if(!(om in otherCache)) otherCache[om]=hasPlanning(data,om)?{slots:monthSlots(data,om),asg:data.schedules[om].assignments}:null;
      return otherCache[om];
    }
    return weeksOfMonth(m).map(function(w){
      const outside=[], all=[]; for(let i=0;i<7;i++){ const d=addDays(w.monday,i); all.push(d); if(d.slice(0,7)!==m) outside.push(d); }
      const om=outside.length?outside[0].slice(0,7):null, other=om?otherMonth(om):null, per={};
      data.employees.forEach(function(s){
        if(s.manager){ per[s.id]={target:0,rest:0,leave:0,leaveCount:0,leaveDates:[],otherHours:0,counted:false}; return; }
        let rest, otherHours=0;
        if(!outside.length) rest=s.restDaysPerWeek;
        else if(other){
          const worked={};
          other.slots.forEach(function(sl){ if(outside.indexOf(sl.date)>=0&&(other.asg[sl.key]||[]).indexOf(s.id)>=0){ worked[sl.date]=1; otherHours+=sl.hours; } });
          rest=Math.max(0,Math.min(w.days.length,s.restDaysPerWeek-(outside.length-Object.keys(worked).length)));
        }else rest=Math.round(s.restDaysPerWeek*w.days.length/7);
        // Congés de la semaine entière, au plus 7 − repos ; seuls ceux du mois m sont déduits ici.
        const cap=Math.max(0,7-s.restDaysPerWeek), leaveDates=[]; let seen=0;
        all.forEach(function(d){ if(onLeave(s,d)&&seen<cap){ seen++; if(d.slice(0,7)===m&&leaveCounts(data,d)) leaveDates.push(d); } });
        const leaveCount=leaveDates.length;
        const leave=leaveCount*leaveDayHours(s);
        const target=other?s.monthlyHours*12/52-otherHours-leave:s.monthlyHours*w.days.length/monthLen-leave;
        per[s.id]={target:round2(Math.max(0,target)), rest:rest, leave:leave, leaveCount:leaveCount, leaveDates:leaveDates, otherHours:round2(otherHours), counted:true};
      });
      return {monday:w.monday, sunday:w.sunday, days:w.days, full:!outside.length, otherMonth:om, otherPlanned:!!other, per:per};
    });
  }
  // neighborSundays(data, m) : DIMANCHES VOISINS pour la règle « dimanches de repos espacés » : le dernier dimanche
  // du mois précédent et le premier du mois suivant, s'ils ont un planning enregistré.
  // { prev : {date, off {id : vrai si la personne n'y travaille pas}} | null, next : idem }.
  function neighborSundays(data,m){
    function at(om,date){
      if(!hasPlanning(data,om)) return null;
      const asg=data.schedules[om].assignments, off={};
      data.employees.forEach(function(s){ off[s.id]=true; });
      monthSlots(data,om).forEach(function(sl){ if(sl.date===date) (asg[sl.key]||[]).forEach(function(id){ if(id in off) off[id]=false; }); });
      return {date:date, off:off};
    }
    const pm=addMonths(m,-1), nm=addMonths(m,1), ps=sundaysOf(pm), ns=sundaysOf(nm);
    return {prev:at(pm,ps[ps.length-1]), next:at(nm,ns[0])};
  }
  // sundaysOf(m) : les dimanches du mois (pour compter les dimanches de repos de chaque personne).
  function sundaysOf(m){ return monthDays(m).filter(function(d){return weekday(d)===7;}); }

  // ----- Compteur d'heures supplémentaires : mois validés -----
  // Un mois validé (cadenas) est arrêté : son planning et ses congés ne changent plus, et l'ÉCART de chaque
  // salarié est noté dans schedules[m].validated.balance : heures prévues − heures à faire (base).
  // Ces écarts s'additionnent de mois en mois dans le COMPTEUR D'HEURES SUPPLÉMENTAIRES du salarié (carte du
  // planning). PURGE DU COMPTEUR : les heures à faire des mois suivants en tiennent compte pour le ramener à 0 :
  // 88 h prévues pour 90 h → compteur −2 h ; le mois suivant demande 92 h (90 h + 2 h dues) ; 92 h prévues →
  // écart du mois +2 h, compteur ramené à 0 h. Inversement, un compteur positif (heures à rendre) baisse les heures
  // à faire du mois suivant. L'historique garde l'écart de chaque mois (prévues − contrat moins congés).
  // isValidated(data, m) : le mois m est-il validé ?
  function isValidated(data,m){ return !!(data.schedules[m]&&data.schedules[m].validated); }
  // carryBefore(data, m, id) : compteur d'heures supplémentaires avant le mois m = somme des écarts des mois validés
  // antérieurs à m. Négatif : heures dues par le salarié ; positif : heures à lui rendre.
  function carryBefore(data,m,id){
    let c=0;
    Object.keys(data.schedules).forEach(function(k){ const v=data.schedules[k].validated; if(k<m&&v&&typeof v.balance[id]==='number') c+=v.balance[id]; });
    return round2(c);
  }
  // planBlocker(data, m) : MOIS EN COURS pour l'historique des heures sup. Rend le premier mois non validé avant m
  // (m est alors un mois planifié « plus loin », ignoré par l'historique), ou null si m est le mois en cours :
  //   - après le dernier mois validé, le mois suivant ;
  //   - sans aucun mois validé, le premier mois planifié.
  // Il n'empêche rien : tout mois peut être généré, modifié ou validé.
  function planBlocker(data,m){
    const ks=Object.keys(data.schedules).filter(isValidMonth).sort();
    const val=ks.filter(function(k){ return isValidated(data,k); }), planned=ks.filter(function(k){ return hasPlanning(data,k); });
    const start=val.length?addMonths(val[val.length-1],1):(planned.length?planned[0]:null);
    return start&&start<m?start:null;
  }
  // overtimeHistory(data, id) : HISTORIQUE DES HEURES SUP. d'un salarié, mois par mois, du plus ancien au plus récent :
  //   [{month, delta (écart du mois : heures prévues − heures à faire), total (cumul après ce mois), validated, at}]
  //   Mois validé (cadenas) : son écart noté à la validation, ajouté au cumul. Seul le mois EN COURS (ouvert, voir
  //   planBlocker) apparaît s'il n'est pas validé ; les mois planifiés plus loin sont ignorés. Mois en cours : écart
  //   PROVISOIRE (recalculé d'après le planning enregistré), hors cumul (total = cumul des mois validés jusque-là).
  function overtimeHistory(data,id){
    const s=findEmployee(data,id); if(!s||s.manager) return [];
    let total=0; const res=[];
    Object.keys(data.schedules).filter(isValidMonth).sort().forEach(function(m){
      const pl=data.schedules[m], v=pl.validated;
      if(v&&typeof v.balance[id]==='number'){ total=round2(total+v.balance[id]); res.push({month:m, delta:v.balance[id], total:total, validated:true, at:v.at||null}); return; }
      if(v||!hasPlanning(data,m)||planBlocker(data,m)) return;
      const st=analyze(data,m,pl.assignments).stats.filter(function(x){ return x.id===id; })[0];
      if(st) res.push({month:m, delta:round2(st.planned-st.base), total:total, validated:false, at:null});
    });
    return res;
  }
  // targetOf(s, rules, carry) : HEURES À FAIRE du mois, les mêmes pour la génération (propose) et l'analyse (analyze) :
  //   leave  = heures de congé du mois (somme des semaines de weekRules)
  //   base   = heures du contrat − leave, au moins 0 : sert à l'écart du mois (heures sup. du mois, historique)
  //   target = base − carry, au moins 0 : carry = compteur d'heures sup. des mois validés avant ce mois (carryBefore).
  //            Compteur −3 h (heures dues) → 3 h de plus à faire ; +3 h (à rendre) → 3 h de moins. Atteindre target
  //            ramène le compteur à 0 (PURGE).
  function targetOf(s,rules,carry){
    if(s.manager) return {leave:0,base:0,target:0};
    let lv=0; rules.forEach(function(w){ lv+=w.per[s.id].leave; });
    const base=round2(Math.max(0,s.monthlyHours-lv));
    return {leave:round2(lv), base:base, target:round2(Math.max(0,base-(carry||0)))};
  }

  // ----- Compteur de congés : année de congés du 1er juin au 31 mai -----
  // leavePeriod(m) : année de congés qui contient le mois m. key = année du mois de juin qui l'ouvre.
  function leavePeriod(m){
    const y=Number(m.slice(0,4)), start=Number(m.slice(5,7))>=6?y:y-1;
    return {key:String(start), from:start+'-06', to:(start+1)+'-05', label:'juin '+start+' → mai '+(start+1)};
  }
  // leaveBalance(data, s, m) : solde de congés de s pour l'année de congés du mois m.
  //   initial ..... solde au 1er juin, saisi à la main (onglet Équipe) ; null s'il n'est pas saisi
  //   taken ....... jours de congé DÉDUITS dans l'année : le même compte que pour les heures à faire (weekRules),
  //                 c'est-à-dire au plus les jours travaillables de chaque semaine (7 − jours de repos)
  //   remaining ... initial − taken ; null sans solde initial
  function leaveBalance(data,s,m){
    const p=leavePeriod(m); let taken=0;
    if(!s.manager) for(let mm=p.from; mm<=p.to; mm=addMonths(mm,1)){
      if(!s.leaveDays.some(function(d){return d.slice(0,7)===mm;})) continue;
      weekRules(data,mm).forEach(function(w){ taken+=w.per[s.id].leaveCount; });
    }
    const initial=s.leaveStart&&(p.key in s.leaveStart)?s.leaveStart[p.key]:null;
    return {period:p, initial:initial, taken:taken, remaining:initial==null?null:round2(initial-taken)};
  }

  // ----- Journal (planning-elevage.log) -----
  // Une ligne par modification : « date heure | rôle | détail [#identifiant] ». L'identifiant est celui de
  // l'opération : il permet de relier une ligne à une modification précise.
  const LOG_FILE='planning-elevage.log';
  // twoDigits : 7 → « 07 ».
  function twoDigits(n){ return (n<10?'0':'')+n; }
  // clean() retire retours à la ligne, tabulations, barres et crochets : un nom ne peut ni créer une fausse
  // ligne ni imiter un identifiant.
  // logLine(e) : entrée de journal {at, author, detail, id} → une ligne de texte du fichier .log.
  function logLine(e){
    let d=new Date(e.at); if(isNaN(d)) d=new Date();
    const q=d.getFullYear()+'-'+twoDigits(d.getMonth()+1)+'-'+twoDigits(d.getDate())+' '+twoDigits(d.getHours())+':'+twoDigits(d.getMinutes())+':'+twoDigits(d.getSeconds());
    // clean : neutralise un champ du journal (retours à la ligne, tabulations, barres, crochets).
    function clean(x){ return String(x||'').replace(/[\r\n\t|\[\]]+/g,' ').replace(/\s+/g,' ').trim(); }
    return q+' | '+(clean(e.author)||'-')+' | '+clean(e.detail)+' [#'+clean(e.id)+']';
  }
  // ----- Opérations -----
  // LOG_MAX borne le tampon de journal en mémoire (sécurité : une boucle ne peut pas remplir la mémoire).
  const LOG_MAX=5000;
  // SETTING_NAMES : réglages modifiables par l'opération « settings », avec leur libellé pour le journal.
  // Une clé absente de cette liste est ignorée : le fichier ne peut recevoir aucun réglage inconnu.
  const SETTING_NAMES={title:'titre',seasonMode:'passage été / hiver',summerStart:'début de l’été',winterStart:'début de l’hiver',rules:'règles de répartition',holidays:'jours fériés'};
  // settingText : valeur d'un réglage écrite en clair pour le journal.
  function settingText(k,v){
    if(k==='holidays') return v.map(function(h){ return frDate(h.date)+(h.name?' '+h.name:''); }).join(', ')||'aucun';
    if(k==='rules'){
      const on=v.filter(function(r){return r.on;}), off=v.filter(function(r){return !r.on;});
      return (on.map(function(r,i){ return (i+1)+'. '+ruleLabel(r.id); }).join(', ')||'aucune')+(off.length?' (non appliquées : '+off.map(function(r){return ruleLabel(r.id);}).join(', ')+')':'');
    }
    return k==='seasonMode'?(v==='dates'?'dates fixes':'changement d’heure'):(k==='summerStart'||k==='winterStart')?String(v).split('-').reverse().join('/'):String(v);
  }
  // personText : « 151 h par mois », ou « gérant » ; pour le journal.
  function personText(s){ return s.manager?'gérant':hoursText(s.monthlyHours)+' par mois'; }
  // summarizeSchedule : résumé d'un planning pour le journal (heures par salarié, jours de présence du gérant).
  function summarizeSchedule(d,m,asg){
    const h={}, days={};
    monthSlots(d,m).forEach(function(sl){ (asg[sl.key]||[]).forEach(function(id){ if(!id) return; h[id]=(h[id]||0)+sl.hours; (days[id]=days[id]||{})[sl.date]=1; }); });
    return d.employees.map(function(s){ return s.name+' '+(s.manager?'présent '+Object.keys(days[s.id]||{}).length+' j':hoursText(h[s.id]||0)); }).join(', ');
  }
  // record(d, op, detail) : ajoute l'entrée de journal d'une opération RÉELLEMENT effectuée (une opération
  // sans effet n'appelle pas record et ne laisse donc aucune trace). Une même opération n'est notée qu'une fois.
  function record(d,op,detail){
    if(op.id && d.log.some(function(e){return e.id===op.id;})) return;
    d.log.push({id:op.id||'',at:op.at||new Date().toISOString(),author:op.author||'',type:op.type,detail:detail});
    if(d.log.length>LOG_MAX) d.log.splice(0,d.log.length-LOG_MAX);
  }
  // applyOp(d, op) : SEUL point de modification des données. Modifie d en place et le retourne.
  //   op = { type, id, at, author, ... } ; « author » est un rôle (« Administration »), jamais un nom.
  //   Chaque opération décrit un ÉTAT VOULU (« Salarié A : 84 h par mois »), pas un geste (« +1 h ») : l'appliquer
  //   deux fois donne le même résultat. Une opération sans effet ne laisse aucune trace au journal.
  //   Toute valeur reçue est revalidée ici (bornes, identifiants connus) : c'est un second contrôle après
  //   celui de l'interface. Un type inconnu lève une erreur.
  function applyOp(d,op){
    let s,txt,before;
    switch(op.type){
      // creation : écrit la ligne de journal de création (l'équipe initiale est dans le fichier créé).
      case 'creation':
        record(d,op,'Création du fichier de données'+(d.employees.length?' avec '+d.employees.map(function(x){return x.name;}).join(', '):''));
        break;
      // addEmployees {employees:[{id, name}]} : ajoute les personnes absentes (ni identifiant connu, ni
      // identifiant supprimé, ni nom déjà porté). Par défaut : 151 h par mois, 2 jours de repos par semaine,
      // 2 dimanches de repos, aucun créneau (à cocher ensuite sur sa fiche).
      case 'addEmployees':
        txt=[];
        (op.employees||[]).forEach(function(n){
          if(findEmployee(d,n.id)||d.removedIds.indexOf(n.id)>=0) return;
          if(d.employees.some(function(x){return nameKey(x.name)===nameKey(n.name);})) return;
          d.employees.push({id:n.id,name:n.name,email:'',monthlyHours:151,manager:false,restDaysPerWeek:2,sundaysOffPerMonth:2,shifts:[],shiftDays:{},leaveDays:[],blockedSlots:[],leaveStart:{}}); txt.push(n.name);
        });
        if(txt.length) record(d,op,(txt.length>1?'Ajout de : ':'Ajout de ')+txt.join(', '));
        break;
      // updateEmployee {employee, name, email, hours (heures mensuelles), boss, rest, sundays, shifts, days, leaveYear, leaveInitial} :
      // fixe la fiche d'une personne ; days = { créneau : [jours] } pour les créneaux tenus certains jours seulement ;
      // leaveInitial = solde de congés au 1er juin de leaveYear (null : non saisi). Pour le gérant, shifts et days sont
      // ses jours de présence fixes. email absent : inchangé ; invalide : effacé.
      case 'updateEmployee':
        s=findEmployee(d,op.employee); if(!s) break;
        before=clone(s);
        if('email' in op) s.email=normalizeEmail(op.email);
        if(/^\d{4}$/.test(String(op.leaveYear||''))){
          const y=String(op.leaveYear), ls=clone(s.leaveStart||{});
          if(op.leaveInitial==null||op.leaveInitial==='') delete ls[y]; else ls[y]=op.leaveInitial;
          s.leaveStart=normalizeLeaveStart(ls);
        }
        s.name=String(op.name||s.name);
        s.manager=!!op.boss;
        s.monthlyHours=s.manager?0:Math.round(clampNum(op.hours,0,300,s.monthlyHours));
        s.sundaysOffPerMonth=s.manager?0:Math.round(clampNum(op.sundays,0,5,s.sundaysOffPerMonth));
        s.restDaysPerWeek=s.manager?0:Math.round(clampNum(op.rest,0,6,s.restDaysPerWeek));
        s.shifts=(op.shifts||[]).map(String).filter(function(x,i,a){return findShift(d,x)&&a.indexOf(x)===i;});
        s.shiftDays=normalizeDays(op.days,s.shifts);
        if(JSON.stringify(before)!==JSON.stringify(s)){
          txt=[];
          if(before.name!==s.name) txt.push('nom '+before.name+' → '+s.name);
          // L'adresse elle-même n'est pas écrite au journal.
          if((before.email||'')!==s.email) txt.push(s.email?(before.email?'adresse e-mail modifiée':'adresse e-mail ajoutée'):'adresse e-mail retirée');
          if(before.manager!==s.manager||before.monthlyHours!==s.monthlyHours) txt.push(personText(before)+' → '+personText(s));
          if(before.sundaysOffPerMonth!==s.sundaysOffPerMonth) txt.push('dimanches de repos '+before.sundaysOffPerMonth+' → '+s.sundaysOffPerMonth);
          if(before.restDaysPerWeek!==s.restDaysPerWeek) txt.push('jours de repos par semaine '+before.restDaysPerWeek+' → '+s.restDaysPerWeek);
          if(JSON.stringify(before.leaveStart||{})!==JSON.stringify(s.leaveStart)){ const y=String(op.leaveYear); txt.push('congés au 1er juin '+y+' : '+(y in s.leaveStart?frNumber(s.leaveStart[y])+' j':'non saisi')); }
          if(before.shifts.join()!==s.shifts.join()||JSON.stringify(before.shiftDays||{})!==JSON.stringify(s.shiftDays)) txt.push((s.manager?'présence fixe : ':'créneaux : ')+(s.shifts.map(function(x){ const j=s.shiftDays[x]; return shiftLabel(findShift(d,x))+(j?' ('+j.map(function(k){return WEEK_NAMES[k-1];}).join(', ')+')':''); }).join(', ')||'aucune'));
          record(d,op,s.name+' : '+txt.join(' ; '));
        }
        break;
      // leave {employee, date, val} : pose (val vrai) ou retire (val faux) un congé ce jour-là. État voulu :
      // la rejouer ne change rien. Le planning déjà enregistré n'est pas modifié : une alerte signale la
      // personne placée un jour de congé, et une nouvelle génération en tient compte.
      // Un mois validé (cadenas) est arrêté : ses congés ne changent plus.
      // Un congé couvre la journée : il remplace les créneaux indisponibles de ce jour-là, et la personne est RETIRÉE
      // aussitôt des créneaux de ce jour dans le planning enregistré du mois (le reste du planning ne bouge pas : pas
      // besoin de re-générer). Ses heures à faire baissent du congé (weekRules) ; une place indispensable laissée vide
      // est signalée comme d'habitude.
      case 'leave':
        s=findEmployee(d,op.employee); if(!s||!isValidIso(op.date)||isValidated(d,op.date.slice(0,7))) break;
        if(!s.leaveDays) s.leaveDays=[]; if(!s.blockedSlots) s.blockedSlots=[];
        if(op.val&&s.leaveDays.indexOf(op.date)<0){
          const was=blockedOn(s,op.date).length; s.blockedSlots=s.blockedSlots.filter(function(k){ return k.slice(0,10)!==op.date; });
          s.leaveDays.push(op.date); s.leaveDays.sort();
          const pl=d.schedules[op.date.slice(0,7)], freed=[];
          if(pl) Object.keys(pl.assignments).forEach(function(k){
            if(k.slice(0,10)!==op.date||pl.assignments[k].indexOf(s.id)<0) return;
            pl.assignments[k]=pl.assignments[k].filter(function(x){ return x!==s.id; });
            const sh=findShift(d,k.slice(11)); freed.push(sh?shiftLabel(sh).trim():k.slice(11));
          });
          record(d,op,s.name+' : congé le '+dayLabel(op.date)+' '+op.date.slice(0,4)+(was?' (à la place des créneaux indisponibles)':'')+(freed.length?' ; retiré(e) du planning : '+freed.join(', '):''));
        }
        else if(!op.val&&s.leaveDays.indexOf(op.date)>=0){ s.leaveDays=s.leaveDays.filter(function(x){return x!==op.date;}); record(d,op,s.name+' : congé retiré le '+dayLabel(op.date)+' '+op.date.slice(0,4)); }
        break;
      // block {employee, date, shift, val} : marque (val vrai) ou retire (val faux) un CRÉNEAU INDISPONIBLE hors congés
      // (rendez-vous médical…). Sans effet un jour de congé (le congé couvre déjà la journée) ou sur un mois validé.
      // Marqué indisponible : la personne est RETIRÉE aussitôt de ce créneau dans le planning enregistré (le reste ne
      // bouge pas) ; le gérant choisit lui-même qui la remplace (« Modifier »), sans re-générer.
      case 'block':{
        s=findEmployee(d,op.employee); const sh=findShift(d,op.shift);
        if(!s||!sh||!isValidIso(op.date)||isValidated(d,op.date.slice(0,7))||onLeave(s,op.date)) break;
        if(!s.blockedSlots) s.blockedSlots=[];
        const key=op.date+'|'+sh.id, at=dayLabel(op.date)+' '+op.date.slice(0,4)+' ('+shiftLabel(sh).trim()+')';
        if(op.val&&s.blockedSlots.indexOf(key)<0){
          s.blockedSlots.push(key); s.blockedSlots.sort();
          const pl=d.schedules[op.date.slice(0,7)], was=!!(pl&&pl.assignments[key]&&pl.assignments[key].indexOf(s.id)>=0);
          if(was) pl.assignments[key]=pl.assignments[key].filter(function(x){ return x!==s.id; });
          record(d,op,s.name+' : indisponible le '+at+(was?' ; retiré(e) du planning':''));
        }
        else if(!op.val&&s.blockedSlots.indexOf(key)>=0){ s.blockedSlots=s.blockedSlots.filter(function(k){return k!==key;}); record(d,op,s.name+' : indisponibilité retirée le '+at); }
        break;
      }
      // remove {employee} : supprime la personne et la retire de tous les plannings.
      case 'remove':
        s=findEmployee(d,op.employee);
        if(d.removedIds.indexOf(op.employee)<0) d.removedIds.push(op.employee);
        if(!s) break;
        d.employees=d.employees.filter(function(x){return x.id!==op.employee;});
        let freed=0;
        Object.keys(d.schedules).forEach(function(m){ const a=d.schedules[m].assignments; Object.keys(a).forEach(function(k){ const n=a[k].length; a[k]=a[k].filter(function(x){return x!==op.employee;}); freed+=n-a[k].length; }); });
        record(d,op,'Suppression de '+s.name+' ('+freed+' créneau'+(freed>1?'x':'')+' libéré'+(freed>1?'s':'')+')');
        break;
      // settings {values} : ne modifie que les réglages connus dont la valeur change.
      case 'settings':
        txt=[];
        Object.keys(op.values||{}).forEach(function(k){
          if(!(k in SETTING_NAMES)) return;
          const val=k==='rules'?normalizeRules(op.values[k]):k==='holidays'?normalizeHolidays(op.values[k]):op.values[k];
          if(JSON.stringify(d.settings[k])!==JSON.stringify(val)){

            d.settings[k]=val;
          }
        });
        if(txt.length) record(d,op,'Réglages modifiés – '+txt.join(' ; '));
        break;

      // autorisés de chaque personne ; ses affectations restent dans le fichier mais ne comptent plus.
      case 'shifts':

        if(before===JSON.stringify(list)) break;
        d.shifts=list;
        d.employees.forEach(function(x){ x.shifts=x.shifts.filter(function(id){return !!findShift(d,id);}); x.shiftDays=normalizeDays(x.shiftDays,x.shifts); });
        record(d,op,'Créneaux modifiés : '+(list.map(function(p){
          const x=[];
          if(!p.winter) x.push('pas d’horaires d’hiver');
          if(!p.summer) x.push('pas d’horaires d’été'); else if(p.winter&&rangeLabel(p.summer)!==rangeLabel(p.winter)) x.push('été '+rangeLabel(p.summer));
          const ne=['summer','winter'].filter(function(k){ return p.neverEmpty[k]; }).map(function(k){ return k==='summer'?'été':'hiver'; });
          if(ne.length) x.push('jamais vide '+ne.join(' et '));
          x.push(p.showEmpty?'affiché même vide':'masqué si vide');
          return shiftLabel(p).trim()+' ('+x.join(', ')+')';

      // reason (facultatif) : motif ajouté au journal.

      case 'schedule':

        if(before&&JSON.stringify(before)===JSON.stringify(plan)) break;

      case 'validateMonth':

  // ----- Enregistrement dans le fichier : Store -----
  // Un seul utilisateur et un fichier sur le disque de l'ordinateur : aucune saisie simultanée à gérer.
  // Les données en mémoire font foi. Chaque modification y est appliquée, puis le fichier entier est
  // réécrit ; les écritures passent l'une après l'autre. Si une écriture échoue (disque débranché…), les
  // données restent en mémoire et « dirty » le signale : l'écriture suivante, ou flush(), enregistre tout.
  // Les lignes de journal attendent, elles aussi, une écriture réussie avant d'être transmises (onLog).
  function Store(io,o){

  }

  Store.prototype.view=function(){ return clone(this.data); };

  Store.prototype.loadData=async function(){

  Store.prototype.execute=function(op){

  // ----- Répartition automatique : propose -----
  // propose(data, o) : calcule le planning d'un mois. NE MODIFIE PAS data et n'écrit rien : le résultat
  // est un brouillon que le gérant vérifie, corrige au besoin, puis enregistre ou abandonne.
  // Options o :
  //   month ......... mois 'AAAA-MM' (obligatoire)
  //   base .......... planning d'où sont repris les jours figés
  //   locks ......... jours GARDÉS (changés à la main) : leurs personnes ne changent pas
  //   fillLocked .... vrai : les places restées VIDES d'un jour gardé peuvent être complétées (re-génération après un
  //                   changement d'équipe, par exemple une nouvelle disponibilité) ; faux : le jour gardé ne change pas

  //                   créneau (congé ou indisponibilité) en est retirée : sa place se recalcule.
  //   today ......... les jours ANTÉRIEURS à cette date sont figés

  //
  // MODÈLE : chaque créneau d'un jour offre « max » places. Les « min » premières doivent être tenues ;
  // les autres servent à compléter les heures mensuelles. Une place est vide (-1) ou tenue par une personne.
  // MÉTHODE : heuristique. Plusieurs constructions gloutonnes, chacune améliorée par recherche locale
  // (remplacement d'une personne, échange de deux places, échange complété par un ajout : « coup en deux
  // temps ») ; un essai sur deux repart du meilleur planning en vidant quelques jours. On garde le meilleur.
  // Le résultat dépend du hasard (Math.random, sans rôle de sécurité) ; deux lancements peuvent différer.
  // NOTATIONS : N places (seats), E personnes, D jours, WK semaines. Un planning A est un tableau de N

  function propose(data,o){

    slots.forEach(function(sl){ res.assignments[sl.key]=[]; });
    const emps=data.employees, E=emps.length, ids=emps.map(function(s){return s.id;}), idx={};
    ids.forEach(function(id,i){idx[id]=i;});
    const dayIdx={}; days.forEach(function(d,i){dayIdx[d]=i;});
    const weekOf=new Array(D), weekDays=rules.map(function(w,wi){ return w.days.map(function(d){ weekOf[dayIdx[d]]=wi; return dayIdx[d]; }); });
    const rng=o.rng||Math.random, budget=o.durationMs==null?1500:o.durationMs, maxAttempts=o.maxAttempts||60, minAttempts=o.minAttempts||4;
    const todayIso=o.today||'', locks={}; (o.locks||[]).forEach(function(d){locks[d]=1;});

        else if((openEmpty&&fixed[p]==null)||gone(p)) seats.push({slot:si,pos:p,d:d,w:weekOf[d],h:sl.hours,frozen:false,fixed:-1});
        else seats.push({slot:si,pos:p,d:d,w:weekOf[d],h:sl.hours,frozen:frozen,fixed:fixed?(fixed[p]==null?-1:fixed[p]):-1});

    const isBoss=emps.map(function(s){return s.manager;}), counted=emps.map(function(s){return !s.manager;});

    // ne le place jamais ailleurs. Il ne peut donc pas tenir les autres places.

    const seatsOfSlot=slots.map(function(){return [];}); seats.forEach(function(st,n){ seatsOfSlot[st.slot].push(n); });
    // Objectif mensuel (T), repère et repos par personne et par semaine (cap, restReq), dimanches de repos.

    // analyze). Le compteur d'heures supplémentaires n'y entre pas.
    const T=emps.map(function(s){ return targetOf(s,rules,s.manager?0:carryBefore(data,m,s.id)).target; });
    const cap=new Float64Array(E*WK), restReq=new Int32Array(E*WK), daysIn=rules.map(function(w){return w.days.length;});

    //   overlap ... une personne sur deux créneaux qui se chevauchent               x 10 000 000 000 000
    //   alone ..... gérant seul sur un créneau où il ne peut pas l'être              x 1 000 000 000 000
    //   restMiss .. jours de repos hebdomadaire manquants                            x 1 000 000 000 000
    //   dayOver ... heures au-delà de 10 h dans une journée (MAX_DAY_HOURS)          x 1 000 000 000 000
    //   empty ..... créneau « Ne jamais laisser vide » sans personne                 x 500 000 000 000
    //               (au-dessus des autres créneaux indispensables : il est rempli en priorité)
    //   unfilled .. heures de créneau sous le minimum de personnes                   x 100 000 000 000
    //   Puis les RÈGLES DE RÉPARTITION, dans l'ordre choisi (Réglages) : x 10^10, x 10^9… (W, voir RULES) ;
    //   une règle décochée vaut 0 :
    //   sunMiss ... dimanches de repos manquants dans le mois
    //   restPair .. salariés sans 2 jours de repos d'affilée dans le mois
    //   sunPair ... paires de dimanches de repos consécutifs
    //   gap ....... écart aux heures à faire du mois (heures) : en MOINS x 20 000, en plus x 10 000
    //               (objectif : finir le mois à 0 h d'écart ; une heure manquante compte double, pour ne pas creuser
    //               les heures dues par le salarié : entre manquer 2 h et dépasser de 3 h, il dépasse)
    //   change .... affectations absentes du planning de référence (ajustement)       x changeWeight
    // Les coefficients forment une hiérarchie : règles absolues, puis créneaux tenus, puis règles de
    // répartition dans leur ordre, puis heures à faire, puis limiter les changements.
    function cost(A){

      for(n=0;n<N;n++){ e=A[n]; if(e<0) continue; const st=seats[n]; hd[e*D+st.d]+=st.h; wh[e*WK+st.w]+=st.h;

        if(c<sl.min) unfilled+=(sl.min-c)*sl.hours;

      for(e=0;e<E;e++){

        if(!counted[e]) continue;

        // Dimanches de repos espacés : deux dimanches de repos consécutifs font une paire.
        if(W.sundaySpread){ let prev=sunPrev[e]; for(i=0;i<sundays.length;i++){ const off=hd[e*D+sundays[i]]===0; if(off&&prev) sunPair++; prev=off; } if(prev&&sunNext[e]&&sundays.length) sunPair++; }

    // build(initial, dropRate) : planning de départ. Places figées recopiées ; les autres reprises de
    // « initial » (dropRate = part des jours volontairement vidés pour varier les essais), puis complétées :
    //   1. les places indispensables (minimum), créneaux les moins pourvus en candidats d'abord ;
    //   2. les places facultatives, seulement pour une personne à qui il manque des heures.
    // Un candidat doit être autorisé sur le créneau, libre à cette heure, et garder ses jours de repos et ses
    // dimanches de repos. Il doit aussi rester sous le maximum par jour (10 h, jamais levé) et sous ses heures
    // mensuelles ; pour une place indispensable, cette dernière limite est levée s'il n'y a personne d'autre.
    function build(initial,dropRate){
      const A=new Array(N).fill(-1), dropDay={};
      if(initial&&dropRate) days.forEach(function(d,i){ if(rng()<dropRate) dropDay[i]=1; });
      for(let n=0;n<N;n++){ const st=seats[n];
        if(st.frozen) A[n]=st.fixed;
        else if(initial&&!dropDay[st.d]){ const e=initial[n]; if(e>=0&&elig[n][e]&&!conflicts[n].some(function(j){return A[j]===e;})) A[n]=e; } }
      const h=new Float64Array(E*D), w=new Float64Array(E*WK), mon=new Float64Array(E), wdays=new Int32Array(E*WK), sunWork=new Int32Array(E);
      // add : place n donnée à la personne e ; met à jour heures du jour, de la semaine, du mois,
      // jours travaillés de la semaine et dimanches travaillés.
      function add(n,e){ const st=seats[n]; if(h[e*D+st.d]===0){ wdays[e*WK+st.w]++; if(sundays.indexOf(st.d)>=0) sunWork[e]++; } h[e*D+st.d]+=st.h; w[e*WK+st.w]+=st.h; mon[e]+=st.h; }

          if(W.sundaysOff&&sundays.indexOf(st.d)>=0&&sunWork[e]+1>sundays.length-sundayReq[e]) return false;

      }
      // Places indispensables encore vides : d'abord les créneaux « Ne jamais laisser vide » restés sans personne
      // (par exemple le gérant en congé), puis les créneaux les moins pourvus en candidats.
      const need=[];
      slots.forEach(function(sl,si){
        const ss=seatsOfSlot[si]; if(ss.every(function(n){return seats[n].frozen;})) return;
        let c=0, all=0; ss.forEach(function(n){ const e=A[n]; if(e>=0){ all++; if(!(sl.noBossAlone&&isBoss[e])) c++; } });
        const cand=emps.filter(function(s,e){ return elig[ss[ss.length-1]][e]&&!(sl.noBossAlone&&isBoss[e]); }).length;
        const prio=sl.neverEmpty&&!all?0:1;
        for(let k=c;k<sl.min;k++) need.push({si:si,c:cand,r:rng(),p:k===c?prio:1});
        if(prio===0&&c>=sl.min) need.push({si:si,c:cand,r:rng(),p:0});
      });
      need.sort(function(x,y){return (x.p-y.p)||(x.c-y.c)||(x.r-y.r);});
      need.forEach(function(q){
        const sl=slots[q.si], n=seatsOfSlot[q.si].filter(function(x){return A[x]<0&&!seats[x].frozen;})[0]; if(n==null) return;
        let best=-1, bs=Infinity;
        for(let pass=0;pass<2&&best<0;pass++) for(let e=0;e<E;e++){
          if(sl.noBossAlone&&isBoss[e]) continue;
          if(!canTake(n,e,pass)) continue;
          const st=seats[n];
          let s=counted[e]?(w[e*WK+st.w]+st.h)/Math.max(cap[e*WK+st.w],0.01):0.5;
          if(h[e*D+st.d]>0) s-=0.15;
          s+=rng()*0.3;
          if(s<bs){bs=s;best=e;}
        }
        if(best>=0){ A[n]=best; add(n,best); }
      });
      // Places facultatives : pour compléter les heures des personnes qui en manquent.
      const extra=[]; for(let n=0;n<N;n++) if(!seats[n].frozen&&A[n]<0) extra.push({n:n,r:rng()});
      extra.sort(function(x,y){return x.r-y.r;});
      extra.forEach(function(q){
        const n=q.n, st=seats[n]; let best=-1, bs=0;
        for(let e=0;e<E;e++){
          if(!counted[e]||!canTake(n,e,0)) continue;
          if(T[e]-mon[e]<st.h-1e-9) continue;
          // Préférence : la personne la plus en retard sur le repère de cette semaine.
          const s=cap[e*WK+st.w]-w[e*WK+st.w]+rng()*0.5+(h[e*D+st.d]>0?0.5:0)+100;
          if(s>bs){bs=s;best=e;}
        }
        if(best>=0){ A[n]=best; add(n,best); }
      });
      return A;
    }
    // Places de chaque jour (pour le coup en deux temps).
    const seatsOfDay=days.map(function(){return [];}); seats.forEach(function(st,n){ if(!st.frozen) seatsOfDay[st.d].push(n); });
    // followUp : après l'échange des places n et q, cherche la meilleure place vide des deux jours concernés
    // à donner à x ou à y. Garde l'ajout et rend vrai s'il amène la note sous c ; sinon ne change rien.
    function followUp(A,n,q,x,y,c){
      let best=c, bestSeat=-1, bestE=-1;
      const cand=seatsOfDay[seats[n].d].concat(seats[q].d!==seats[n].d?seatsOfDay[seats[q].d]:[]);
      for(let k=0;k<cand.length;k++){
        const r=cand[k]; if(A[r]>=0) continue;
        for(let t=0;t<2;t++){
          const e=t?y:x; if(e<0||!elig[r][e]) continue;
          A[r]=e; const v=cost(A); A[r]=-1;
          if(v<best-1e-9){ best=v; bestSeat=r; bestE=e; }
        }
      }
      if(bestSeat<0) return false;
      A[bestSeat]=bestE; return true;
    }
    // improve(A) : recherche locale. Modifie A en place, retourne sa note finale.
    //   remplacement : une place change de titulaire (ou se vide) ;
    //   échange : deux places échangent leurs titulaires (l'une peut être vide).
    //   Gardé seulement si la note baisse. Jamais de place figée, jamais de personne non autorisée.
    function improve(A){
      let c=cost(A), ok=true, passes=0;
      const free=[]; for(let n=0;n<N;n++) if(!seats[n].frozen) free.push(n);
      while(ok&&passes<30){
        ok=false; passes++;
        for(let a=0;a<free.length;a++){ if(tooLong()) return c;
          const n=free[a];
          for(let e=-1;e<E;e++){
            const keep=A[n]; if(e===keep||(e>=0&&!elig[n][e])) continue;
            A[n]=e; const x=cost(A);
            if(x<c-1e-9){c=x;ok=true;} else A[n]=keep;
          }
        }
        for(let a=0;a<free.length;a++){ if(tooLong()) return c;
          for(let b=a+1;b<free.length;b++){
            const n=free[a], q=free[b], x=A[n], y=A[q];
            if(x===y||(y>=0&&!elig[n][y])||(x>=0&&!elig[q][x])) continue;
            if(seats[n].slot===seats[q].slot) continue;
            A[n]=y; A[q]=x; const z=cost(A);
            if(z<c-1e-9){c=z;ok=true;}
            // Coup en deux temps : un échange qui coûte peu (moins d'une heure d'écart) est complété par
            // l'ajout de l'une des deux personnes sur une place vide de l'un des deux jours concernés.
            // L'ensemble n'est gardé que s'il fait baisser la note. Exemple : le salarié A cède son
            // dimanche matin au salarié B, reprend le matin de B en semaine et y ajoute le magasin.
            else if(z<c+1e4&&followUp(A,n,q,x,y,c)){c=cost(A);ok=true;}
            else {A[n]=x;A[q]=y;}
          }
        }
      }
      return c;
    }
    const ref=refAsg?seats.map(function(st){ const r=refSlot[st.slot]; return r[st.pos]==null?-1:r[st.pos]; }):null;
    let best=null, bestCost=Infinity, attempts=0;
    while(attempts<minAttempts || (attempts<maxAttempts && Date.now()-t0<budget)){
      // Mode « ajuster » : 1er essai depuis le planning actuel, puis essais partiellement perturbés ou repartis de zéro.
      // Génération complète : un essai sur deux repart du meilleur planning trouvé, dont quelques jours sont
      // vidés puis reconstruits (perturbation) ; cela permet des changements qu'un seul geste ne trouve pas.
      const A=ref?(attempts===0?build(ref):attempts%3===0?build():build(ref,0.25)):(best&&attempts%2===1?build(best,0.2):build());
      const c=improve(A); attempts++;
      if(c<bestCost){bestCost=c;best=A.slice();}
      if(tooLong()) break;
    }
    result(best);
    res.attempts=attempts; res.cost=bestCost;
    // changes : nombre de jours dont le contenu diffère du planning de référence.
    if(refAsg){
      const dayKey={}, refKey={};
      slots.forEach(function(sl){
        dayKey[sl.date]=(dayKey[sl.date]||'')+sl.key+':'+res.assignments[sl.key].slice().sort().join()+';';
        refKey[sl.date]=(refKey[sl.date]||'')+sl.key+':'+((refAsg[sl.key]||[]).filter(function(id){return id in idx;}).slice().sort().join())+';';
      });
      Object.keys(dayKey).forEach(function(d){ if(dayKey[d]!==refKey[d]) res.changes++; });
    }
    return res;
  }

  // ----- Analyse d'un planning : analyze -----
  // analyze(data, m, asg, o) : heures, compteurs et alertes du planning du mois m. Lecture seule.
  //   Par personne : name, boss, monthly (heures du contrat), leaveHours (heures de congé déduites),
  //                  leaveCounted (jours de congé comptés), leaveDays [dates de congé du mois],
  //                  target (HEURES À FAIRE = monthly − leaveHours, au moins 0), planned (heures travaillées
  //                  prévues ; worked en est un synonyme), remaining (target − planned),
  //                  hoursBy {activité (forme de comparaison) : heures}, daysWorked, sundaysOff, sundayReq,
  //                  weeks [{target (repère), planned, rest, restDays}],
  //                  days {date : {hours, items}}
  //                  carry (compteur d'heures sup. des mois validés avant m), base (= target, contrat − congés),
  //   Global : activities (activitiesOf), needTotal (heures indispensables), uncovered, contractTotal, plannedTotal,
  //            remainingContract (heures de contrat restant à placer), overtime (heures au-delà des contrats).
  //   Alertes triées par gravité. Les jours passés ne produisent pas d'alerte de créneau non tenu.
  //   neverEmptyMissing {clé de créneau : {txt, short}} : créneaux « Ne jamais laisser vide » restés sans personne (jours à venir).
  //   Activités : seulement celles qui ont au moins un créneau dans le mois (actif, avec des horaires de la saison).
  function analyze(data,m,asg,o){
    o=o||{}; asg=asg||{};
    const slots=monthSlots(data,m), acts=activitiesOf(data).filter(function(a){ return slots.some(function(sl){ return sl.activityKey===a.key; }); });
    function hoursBy0(){ const x={}; acts.forEach(function(a){ x[a.key]=0; }); return x; }
    const todayIso=o.today||'', R=data.settings, rules=weekRules(data,m), sundays=sundaysOf(m), alerts=[], stats={}, rows=[], neverEmptyMissing={};
    const nb=neighborSundays(data,m);
    const W=ruleWeights(R), allDays=monthDays(m);
    data.employees.forEach(function(s){
      const st={id:s.id,name:s.name,boss:s.manager,monthly:s.monthlyHours,shifts:s.shifts,person:s,target:s.manager?0:s.monthlyHours,planned:0,remaining:0,hoursBy:hoursBy0(),
                carry:s.manager?0:carryBefore(data,m,s.id),base:0,
                daysWorked:0,sundaysOff:0,sundayReq:Math.min(s.sundaysOffPerMonth,sundays.length),weeks:[],days:{},
                worked:0,leaveHours:0,leaveCounted:0,leaveDays:monthDays(m).filter(function(d){return onLeave(s,d);})};
      stats[s.id]=st; rows.push(st);
    });
    let needTotal=0, uncovered=0;
    const filled={};
    slots.forEach(function(sl){
      const past=!!todayIso&&sl.date<todayIso, a=asg[sl.key]||[], seen={};
      let c=0, boss=0, n=0;
      needTotal+=sl.min*sl.hours;
      a.forEach(function(id){
        const st=stats[id]; if(!id||!st) return;
        if(seen[id]){ alerts.push({type:'duplicate',date:sl.date,msg:dayLabel(sl.date)+' : '+st.name+' est inscrit(e) deux fois sur le créneau '+sl.label}); return; }
        seen[id]=1; n++;
        if(sl.noBossAlone&&st.boss) boss++; else c++;
        st.planned+=sl.hours; st.hoursBy[sl.activityKey]=(st.hoursBy[sl.activityKey]||0)+sl.hours;
        const day=st.days[sl.date]||(st.days[sl.date]={hours:0,items:[]}); day.hours+=sl.hours; day.items.push(sl);
        if(isAway(st.person,sl.date,sl.shift)) alerts.push({type:'leave',date:sl.date,msg:dayLabel(sl.date)+' : '+st.name+' est placé(e) au créneau '+sl.label+' alors qu’il ou elle est '+(onLeave(st.person,sl.date)?'en congé':'indisponible')});
        // Le gérant peut se placer à la main en dehors de ses jours fixes : ce n'est pas une anomalie.
        else if(st.boss||relayOpen(data,sl)){}
        else if(!canWork(st.person,sl.shift,sl.date,data)&&st.shifts.indexOf(sl.shift)<0) alerts.push({type:'ineligible',date:sl.date,msg:dayLabel(sl.date)+' : '+st.name+' est sur le créneau '+sl.label+' sans y être prévu(e)'});
        else if(!canWork(st.person,sl.shift,sl.date,data)) alerts.push({type:'ineligible',date:sl.date,msg:dayLabel(sl.date)+' : '+st.name+' ne fait pas le créneau '+sl.label+' le '+WEEK_NAMES[weekday(sl.date)-1]});
      });
      filled[sl.key]=n;
      const missing=Math.max(0,sl.min-c);
      if(!past){
        uncovered+=missing*sl.hours;
        if(sl.neverEmpty&&!n){
          const why=emptyReason(data,sl);
          neverEmptyMissing[sl.key]={txt:why, short:emptyReason(data,sl,true)};
          alerts.push({type:'empty',date:sl.date,msg:dayLabel(sl.date)+' : le créneau '+sl.label+' ne doit jamais rester vide, mais personne n’a pu y être placé — '+why});
        }
        else if(boss&&!c) alerts.push({type:'alone',date:sl.date,msg:dayLabel(sl.date)+' : le gérant est seul au créneau '+sl.label});
        else if(missing) alerts.push({type:'uncovered',date:sl.date,msg:dayLabel(sl.date)+' : créneau '+sl.label+(missing>1?' — il manque '+missing+' personnes':' sans personne')});
      }
      if(n>sl.max) alerts.push({type:'toomany',date:sl.date,msg:dayLabel(sl.date)+' : '+n+' personnes au créneau '+sl.label+' (maximum '+sl.max+')'});
    });
    rows.forEach(function(st){
      Object.keys(st.days).sort().forEach(function(d){
        const x=st.days[d]; st.daysWorked++;
        if(!st.boss&&x.hours>MAX_DAY_HOURS+1e-9) alerts.push({type:'daymax',date:d,msg:dayLabel(d)+' : dépassement d’horaires — '+st.name+' fait '+hoursText(x.hours)+' pour '+hoursText(MAX_DAY_HOURS)+' maximum par jour'});
        const it=x.items.slice().sort(function(a,b){return a.start-b.start;});
        let last=null;
        it.forEach(function(sl){
          if(last&&sl.key!==last.key&&sl.start<last.end) alerts.push({type:'overlap',date:d,msg:dayLabel(d)+' : '+st.name+' est sur deux créneaux en même temps ('+last.label+' et '+sl.label+')'});
          if(!last||sl.end>last.end) last=sl;
        });
      });
      st.sundaysOff=sundays.filter(function(d){return !st.days[d];}).length;
      if(W.sundaysOff&&st.sundaysOff<st.sundayReq) alerts.push({type:'sunday',date:m+'-01',msg:st.name+' : '+plural(st.sundaysOff,'dimanche')+' de repos en '+monthLabel(m)+' ('+st.sundayReq+' demandés)'});
      rules.forEach(function(w){
        const r=w.per[st.id]; let planned=0, worked=0;
        w.days.forEach(function(d){ if(st.days[d]){ planned+=st.days[d].hours; worked++; } });
        st.weeks.push({target:r.target, planned:round2(planned), leave:r.leave, rest:r.rest, restDays:w.days.length-worked, counted:r.counted});
        st.leaveCounted+=r.leaveCount||0;
        if(!r.counted) return;
        if(w.days.length-worked<r.rest) alerts.push({type:'rest',date:w.days[0],msg:weekLabel(w)+' : '+st.name+' n’a que '+plural(w.days.length-worked,'jour')+' de repos ('+r.rest+' au minimum)'});
      });
      // Les heures de congé sont DÉDUITES des heures à faire : heures à faire = contrat − congés (au moins 0).
      // Le compteur d'heures sup. des mois validés s'y ajoute (heures dues) ou s'en retire (à rendre), pour le
      // ramener à 0 (targetOf). Les congés ne s'ajoutent pas aux heures travaillées :
      // planned ne contient que des heures de créneaux. C'est le même objectif que celui de propose() (targetOf).
      const t=targetOf(st.person,rules,st.carry);
      st.leaveHours=t.leave; st.base=t.base; st.target=t.target; st.planned=round2(st.planned); st.worked=st.planned;
      // goal : heures à faire (contrat − congés − compteur). remaining = heures à faire − heures prévues ;
      // overtime = heures prévues − heures à faire : les heures sup. du mois (négatif : heures en moins).
      st.goal=st.target;
      st.remaining=st.boss?0:round2(st.goal-st.planned);
      st.overtime=st.boss?0:round2(st.planned-st.base);
      // Règles de répartition cochées dans Réglages : signalées quand elles ne sont pas tenues. Les dimanches des
      // mois voisins déjà planifiés comptent (dernier dimanche du mois précédent, premier du mois suivant).
      if(!st.boss&&W.sundaySpread&&sundays.length){
        const pairs=[];
        if(nb.prev&&nb.prev.off[st.id]&&!st.days[sundays[0]]) pairs.push(nb.prev.date);
        for(let i=0;i+1<sundays.length;i++) if(!st.days[sundays[i]]&&!st.days[sundays[i+1]]) pairs.push(sundays[i]);
        if(nb.next&&nb.next.off[st.id]&&!st.days[sundays[sundays.length-1]]) pairs.push(sundays[sundays.length-1]);
        if(pairs.length) alerts.push({type:'sunpair',date:pairs[0]<m?sundays[0]:pairs[0],msg:st.name+' : dimanches de repos de suite ('+pairs.map(function(d){ return 'le '+dayLabel(d)+(d.slice(0,7)!==m?' '+d.slice(0,4):'')+' et le suivant'; }).join(' ; ')+')'});
      }
      if(!st.boss&&W.restPair){
        let ok=false; for(let i=0;i+1<allDays.length&&!ok;i++) if(!st.days[allDays[i]]&&!st.days[allDays[i+1]]) ok=true;
        if(!ok) alerts.push({type:'restpair',date:m+'-01',msg:st.name+' : jamais 2 jours de repos d’affilée en '+monthLabel(m)});
      }
      if(st.remaining<-0.01) alerts.push({type:'monthmax',date:m+'-01',msg:st.name+' : '+hoursText(-st.remaining)+' en surplus en '+monthLabel(m)+' ('+hoursText(st.planned)+' planifiées pour '+hoursText(st.goal)+' à faire)'});
    });
    const order={overlap:0,empty:1,alone:2,leave:3,ineligible:4,duplicate:5,toomany:6,rest:7,sunday:8,uncovered:9,daymax:10,monthmax:11,restpair:12,sunpair:13};
    alerts.sort(function(a,b){return (order[a.type]-order[b.type])||(a.date<b.date?-1:a.date>b.date?1:0);});
    let contractTotal=0, plannedTotal=0, remainingContract=0, overtime=0;
    rows.forEach(function(st){ if(st.boss) return; contractTotal+=st.target; plannedTotal+=st.planned; if(st.remaining>0) remainingContract+=st.remaining; else overtime-=st.remaining; });
    return {month:m, activities:acts, slots:slots, weeks:rules, stats:rows, alerts:alerts, filled:filled, needTotal:round2(needTotal), uncovered:round2(uncovered),
            neverEmptyMissing:neverEmptyMissing,
            contractTotal:round2(contractTotal), plannedTotal:round2(plannedTotal), remainingContract:round2(remainingContract), overtime:round2(overtime)};
  }
  // emptyReason(data, sl, short) : pourquoi un créneau « Ne jamais laisser vide » n'a personne, en clair (alerte du
  // planning) ; short : version courte, affichée dans la case du calendrier.
  function emptyReason(data,sl,short){
    const mgrOff=data.employees.some(function(s){ return s.manager&&isAway(s,sl.date,sl.shift); });
    const cand=data.employees.filter(function(s){ return !s.manager&&s.shifts.indexOf(sl.shift)>=0&&(!s.shiftDays[sl.shift]||s.shiftDays[sl.shift].indexOf(weekday(sl.date))>=0); });
    const away=cand.filter(function(s){ return isAway(s,sl.date,sl.shift); }), free=cand.filter(function(s){ return !isAway(s,sl.date,sl.shift); });
    const p=[];
    if(short){
      if(relayOpen(data,sl)) return 'gérant absent : placez un salarié en relais (Modifier)';
      p.push(!cand.length?'aucun salarié prévu sur ce créneau':!free.length?'salariés possibles absents':'salariés possibles au repos ou déjà occupés');
      return p.join(', ');
    }
    if(mgrOff) p.push('le gérant est en congé ou indisponible');
    const relay=relayOpen(data,sl);
    if(!cand.length) p.push('aucun '+(mgrOff?'autre ':'')+'salarié n’a ce créneau coché le '+WEEK_NAMES[weekday(sl.date)-1]+' dans l’onglet Équipe'+(relay?'':' (à cocher pour que la génération puisse l’y placer)'));
    else if(!free.length) p.push('les salariés qui ont ce créneau sont en congé ou indisponibles ('+away.map(function(s){return s.name;}).join(', ')+')');
    else p.push(free.map(function(s){return s.name;}).join(', ')+' '+(free.length>1?'ont déjà leurs':'a déjà ses')+' jours de repos de la semaine à respecter ou un autre créneau à la même heure'+(away.length?' ; '+away.map(function(s){return s.name;}).join(', ')+' absent'+(away.length>1?'s':'')+' (congé ou indisponibilité)':''));
    return p.join(' ; ')+'.'+(relay?' Relais du gérant : dans « Modifier », tous les salariés de l’équipe sont proposés sur ce créneau.':'');
  }
  // plural : « 1 jour », « 2 jours » (pluralForm pour un pluriel irrégulier).
  function plural(n,singular,pluralForm){ return n+' '+(n>1?(pluralForm||singular+'s'):singular); }

  // ----- Congé ou indisponibilité posé après la génération : personnes placées malgré l'absence -----
  // leaveConflicts(data, m, asg, today) : { date : [identifiants] } des jours à venir où une personne en congé
  // ou indisponible est placée dans le planning asg. Les jours passés ne sont pas signalés : ils ne se modifient plus.
  function leaveConflicts(data,m,asg,todayIso){
    const res={};
    monthSlots(data,m).forEach(function(sl){
      if(todayIso&&sl.date<todayIso) return;
      (asg[sl.key]||[]).forEach(function(id){
        const s=findEmployee(data,id); if(!s||!isAway(s,sl.date,sl.shift)) return;
        const l=res[sl.date]||(res[sl.date]=[]); if(l.indexOf(id)<0) l.push(id);
      });
    });
    return res;
  }

  // Interface publique de Core : tout ce qui n'est pas listé ici est inaccessible depuis l'extérieur.
  return {MONTHS:MONTHS, WEEK_NAMES:WEEK_NAMES, WEEK_LETTERS:WEEK_LETTERS, today:today, parseISO:parseISO, toISO:toISO, addDays:addDays,
    isValidIso:isValidIso, isValidMonth:isValidMonth, isValidMonthDay:isValidMonthDay, clone:clone, round2:round2, longDate:longDate, frDate:frDate,
    weekday:weekday, dayLabel:dayLabel, monthLabel:monthLabel, addMonths:addMonths, monthDays:monthDays, frNumber:frNumber,
    parseTime:parseTime, isValidTime:isValidTime, timeLabel:timeLabel, rangeLabel:rangeLabel, spanHours:spanHours, hoursText:hoursText, signedHours:signedHours, shiftLabel:shiftLabel,
    RULES:RULES, normalizeRules:normalizeRules, ruleWeights:ruleWeights,
    isValidated:isValidated, carryBefore:carryBefore, overtimeHistory:overtimeHistory, planBlocker:planBlocker, targetOf:targetOf, neighborSundays:neighborSundays, normalizeEmail:normalizeEmail, leavePeriod:leavePeriod, leaveBalance:leaveBalance,
    leaveConflicts:leaveConflicts, holidayOf:holidayOf, leaveCounts:leaveCounts, relayOpen:relayOpen, normalizeHolidays:normalizeHolidays,

/*CORE-FIN*/
</script>

<script>
// SCRIPT 2 / 2 : Interface.
// =====================================================================================
// Fonction auto-exécutée : aucune variable globale. Seul lien avec le script précédent : l'objet Core.
// ARCHITECTURE
//   État unique S . render() reconstruit l'écran depuis S . un écouteur « click » et un écouteur
//   « change » sur le document appellent les tables actions et changes.
//   Toute modification de données passe par execute(op), qui la confie au Store (application en mémoire,
//   puis écriture du fichier). Les écrans ne modifient jamais S.data directement.
// ONGLETS : Planning (calendrier du mois, brouillon, cartes d'heures) . Équipe . Réglages.
// RÈGLE DE SÉCURITÉ DE L'AFFICHAGE
//   L'écran est produit par concaténation de chaînes puis innerHTML. Toute valeur qui vient du fichier
//   ou d'une saisie (nom, titre, nom de créneau, nom de dossier, message) DOIT passer par esc().
//   Sont insérés sans esc() uniquement : des constantes du code, des nombres, des dates calculées.
(function(){
'use strict';
// C : raccourci vers le module Core. app : conteneur reconstruit par render().
const C=Core;
const app=document.getElementById('app');
// FS_OK : le navigateur sait-il ouvrir un dossier en écriture (Google Chrome, Microsoft Edge) ?
const FS_OK=typeof window.showDirectoryPicker==='function';
// DATA_FILE : nom imposé du fichier de données. Aucun nom de fichier ne vient de l'utilisateur.
const DATA_FILE='planning-elevage-donnees.json';
// H : mise en forme d'une durée (« 7 h 30 »).
const H=C.hoursText;

// esc : ÉCHAPPEMENT HTML. Neutralise & < > " ' : la valeur est sûre dans le texte d'une balise et dans
// un attribut entre guillemets.
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
// Aucune préférence n'est gardée dans le navigateur (localStorage). Une version précédente mémorisait un thème d'affichage ; il n'existe plus, la préférence est effacée.
try{ localStorage.removeItem('planning-elevage.theme'); }catch(e){}
// uid : identifiant (horloge + hasard). Sert à distinguer, pas à protéger.
function uid(prefix){ return (prefix||'s')+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
// timeStr : heure locale « 14:05:12 », pour la ligne d'état.
function timeStr(d){ d=d||new Date(); return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
// dateTimeStr : date ISO → « 27/11/2026 à 14:05 » ; vide si la date est invalide.
function dateTimeStr(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
// plural : « 1 jour », « 2 jours ».
function plural(n,singular,pluralForm){ return n+' '+(n>1?(pluralForm||singular+'s'):singular); }
// cap1 : première lettre en majuscule (« décembre 2026 » → « Décembre 2026 »).
function cap1(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
// remainingText : écart avec les heures du mois, en mots simples (voir hoursStatus).
function remainingText(r){ return hoursStatus(r).txt; }

/* --- IndexedDB : mémorise le lien vers le dossier --- */
// Base « planning-elevage », magasin « kv », clé « folder » : l'objet remis par le navigateur qui désigne
// le dossier choisi. Ce n'est pas un chemin et il ne donne aucun droit par lui-même.
// idb : ouvre la base IndexedDB (la crée au premier usage).
function idb(){ return new Promise(function(res,rej){ const r=indexedDB.open('planning-elevage',1); r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); }; r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
// idbOp(mode, fn) : exécute fn sur le magasin « kv » dans une transaction. Délai de garde de 3 s : si
// IndexedDB ne répond pas, la page continue sans mémoriser le dossier.
function idbOp(mode,fn){
  const guard=new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('IndexedDB ne répond pas')); },3000); });
  return Promise.race([guard, idb().then(function(db){ return new Promise(function(res,rej){ const t=db.transaction('kv',mode), q=fn(t.objectStore('kv')); t.oncomplete=function(){res(q&&q.result);}; t.onerror=function(){rej(t.error);}; }); })]);
}
// idbGet / idbSet / idbDel : lire, écrire, effacer une clé du magasin « kv ».
function idbGet(k){ return idbOp('readonly',function(s){return s.get(k);}); }
function idbSet(k,v){ return idbOp('readwrite',function(s){return s.put(v,k);}); }
function idbDel(k){ return idbOp('readwrite',function(s){return s.delete(k);}); }

// fileIo : SEUL accès en lecture et en écriture aux fichiers, pour un nom fixé par le code, dans le dossier
// autorisé. Un fichier absent se lit comme un texte vide. L'écriture remplace le fichier entier.
function fileIo(dirHandle,fullName){
  return {
    read:async function(){
      try{ const h=await dirHandle.getFileHandle(fullName); return await (await h.getFile()).text(); }
      catch(e){ if(e&&e.name==='NotFoundError') return ''; throw e; }
    },
    write:async function(txt){
      const h=await dirHandle.getFileHandle(fullName,{create:true}), w=await h.createWritable();
      try{ await w.write(txt); await w.close(); }catch(e){ try{ await w.abort(); }catch(_){} throw e; }
    }
  };
}
// pageName : nom du fichier de la page, lu dans son adresse. Sert seulement à vérifier que le dossier
// choisi est bien celui de la page.
function pageName(){ try{ return decodeURIComponent(location.pathname.split('/').pop()||''); }catch(e){ return ''; } }

/* --- État --- */
// S : état unique de l'écran. Rien n'en est partagé ni conservé, sauf S.data, image du fichier de données.
const S={
  mode:'booting',  // booting | incompatible | home | reconnect | fs
  data:null, store:null, dirHandle:null, folderName:'',
  admin:false,      // chaque ouverture commence avec « Administration » décochée (sauf la création du fichier)
  tab:'schedule',     // onglet affiché : schedule | employees | settings
  month:C.today().slice(0,7), // mois affiché
  preview:null,     // {month, assignments:{}, locks:{date:true}, mode:'complete'|'manual'}
  draft:null,       // copie des créneaux en cours de modification dans Réglages
  rulesDraft:null,  // copie des règles de répartition en cours de modification dans Réglages
  holDraft:null,    // copie des jours fériés en cours de modification dans Réglages
  otHistory:{},     // historique des heures sup. ouvert sur la fiche (onglet Équipe) : {id : vrai}
  leaveMode:null,   // mode « Congés » : {employee, changed} ; bloque les autres fonctions pendant la saisie
  filter:null,      // planning individuel : {employee ('' = toute l'équipe), activity ('*' = toutes)}
  mail:null,        // envoi par Gmail en cours : {month, title, file, url}
  status:{txt:'',type:''},   // message de la ligne d'état et son type (ok, info, error)
  computing:false, proposalInfo:''   // calcul en cours ; phrase affichée dans le bandeau du brouillon
};
// TABS : adminOnly = visible seulement quand l'interrupteur « Administration » est activé.
const TABS=[
  {id:'schedule',name:'Planning',ico:'cal'},
  {id:'employees',name:'Équipe',ico:'users',adminOnly:true},
  {id:'settings',name:'Réglages',ico:'gear',adminOnly:true}
];
// status : message de la ligne d'état. Écrit par textContent, donc sans interprétation HTML.
function status(txt,type){ S.status={txt:txt,type:type||''}; const el=document.getElementById('status'); if(el){ el.textContent=txt; el.title=txt; el.className='status status-'+(type||''); } }

/* --- Démarrage et connexion au dossier --- */
// showError : signale un échec dans la ligne d'état ; hors de l'écran principal (où cette ligne
// n'existe pas), le message est aussi présenté dans une boîte de dialogue.
function showError(msg,e){
  const txt=msg+' ('+((e&&e.message)||e)+').';
  console.warn(msg,e);
  status(txt,'error');
  if(S.mode!=='fs') alert(txt);
}
// boot : si un dossier est mémorisé et que l'accord du navigateur est toujours valide, connexion directe ;
// s'il faut redonner l'accord, écran « reconnexion » ; sinon écran d'accueil.
async function boot(){
  if(!FS_OK){ S.mode='incompatible'; render(); return; }
  try{
    const d=await idbGet('folder');
    if(d){
      S.dirHandle=d; S.folderName=d.name;
      if(await d.queryPermission({mode:'readwrite'})==='granted'){ await connect(d); return; }
      S.mode='reconnect'; render(); return;
    }
  }catch(e){ console.warn(e); }
  S.mode='home'; render();
}
// connect : prépare le Store du fichier de données, lit et contrôle le fichier, mémorise le dossier.
async function connect(dirHandle){
  S.dirHandle=dirHandle; S.folderName=dirHandle.name; logText=null;
  S.store=new C.Store(fileIo(dirHandle,DATA_FILE),{onLog:appendToLog});
  status('Lecture du fichier…','info');
  S.data=await S.store.loadData();
  S.mode='fs';
  idbSet('folder',dirHandle).catch(function(e){ console.warn('Impossible de mémoriser le dossier',e); });
  status('Données chargées à '+timeStr(),'ok');
  render();
}
// openFolder : sélecteur de dossier du navigateur. Garde-fous : avertissement si la page n'est pas dans
// ce dossier ; refus d'ouvrir un fichier de données illisible, sans rien écrire ; création d'un fichier
// neuf seulement s'il n'en existe aucun et après confirmation. Un fichier existant n'est jamais écrasé.
async function openFolder(){
  try{
    const dirHandle=await window.showDirectoryPicker({mode:'readwrite',id:'planning-elevage'});
    const page=pageName();
    if(page){
      let pageHere=true; try{ await dirHandle.getFileHandle(page); }catch(e){ pageHere=false; }
      if(!pageHere && !confirm('Ce dossier ne contient pas la page « '+page+' ».\nLes données et le journal doivent être dans le même dossier que la page.\n\nUtiliser quand même ce dossier ?')) return;
    }
    let txt=null;
    try{ txt=await (await (await dirHandle.getFileHandle(DATA_FILE)).getFile()).text(); }
    catch(e){ if(!e||e.name!=='NotFoundError') throw e; }
    if(txt!==null){
      let valid=false; try{ C.normalize(JSON.parse(txt)); valid=true; }catch(e){}
      if(!valid){ alert('Le fichier '+DATA_FILE+' de ce dossier est vide ou illisible.\nRien n’a été modifié. Vérifiez-le (ou restaurez une sauvegarde) avant de recommencer.'); return; }
      await connect(dirHandle); return;
    }
    if(!confirm('Aucun fichier de données dans ce dossier.\n\nS’agit-il de la toute première mise en place ? Le fichier '+DATA_FILE+' va être créé ici, vierge : vous saisirez vos créneaux de travail dans « Réglages », puis votre équipe dans « Équipe ».')) return;
    // Fichier neuf VIERGE (ni créneau, ni personne) : le gérant saisit lui-même ses créneaux puis son équipe.
    const init=C.newData();
    C.applyOp(init,{type:'creation',id:uid(),at:new Date().toISOString(),author:'Administration'});
    const entries=init.log; init.log=[];
    await fileIo(dirHandle,DATA_FILE).write(C.serialize(init));
    // Toute première mise en place : « Administration » est cochée pour saisir les créneaux, puis l'équipe.
    S.admin=true; S.tab='settings';
    await connect(dirHandle);
    appendToLog(entries);
    status('Fichier créé. Saisissez vos créneaux de travail, puis votre équipe, puis générez le planning du mois.','ok');
  }catch(e){ if(e&&e.name==='AbortError') return; showError('Impossible d’ouvrir le dossier',e); }
}
// reconnect : redemande au navigateur l'accord d'écriture sur le dossier mémorisé.
async function reconnect(){
  try{
    const p=await S.dirHandle.requestPermission({mode:'readwrite'});
    if(p==='granted') await connect(S.dirHandle);
    else status('Accès refusé par le navigateur.','error');
  }catch(e){ showError('Le dossier mémorisé est introuvable (déplacé, renommé ou indisponible). Ouvrez-le à nouveau',e); S.mode='home'; render(); }
}
// changeFolder : oublie le dossier mémorisé et revient à l'accueil. Ne supprime aucun fichier.
async function changeFolder(){
  if((S.preview||draftDirty()||rulesDirty()||holDirty())&&!confirm('Des modifications ne sont pas enregistrées. Changer de dossier quand même ?')) return;
  try{ await idbDel('folder'); }catch(e){}
  S.dirHandle=null; S.store=null; S.data=null; S.preview=null; S.draft=null; S.rulesDraft=null; S.holDraft=null; S.filter=null; S.mail=null; logText=null; S.mode='home'; status('','');
  render();
}

/* --- Journal : fichier planning-elevage.log dans le même dossier --- */
// appendToLog : ajoute les lignes à la fin du journal. Le fichier est lu une seule fois, puis son texte est
// gardé en mémoire ; les ajouts passent l'un après l'autre. Un échec est signalé sans bloquer la saisie.
let logText=null, logChain=Promise.resolve();
function appendToLog(entries){
  if(!S.dirHandle||!entries||!entries.length) return;
  const io=fileIo(S.dirHandle,C.LOG_FILE), lines=entries.map(C.logLine);
  logChain=logChain.then(async function(){
    if(logText===null) logText=await io.read();
    const next=(logText&&!/\n$/.test(logText)?logText+'\r\n':logText||'')+lines.join('\r\n')+'\r\n';
    await io.write(next); logText=next;
  }).catch(function(e){ status('Le journal '+C.LOG_FILE+' n’a pas pu être complété ('+(e.message||e)+').','error'); });
}

/* --- Exécution d'une modification --- */
// execute(op) : PASSAGE OBLIGÉ DE TOUTE MODIFICATION DE DONNÉES. Horodate l'opération, lui donne un
// identifiant et le rôle « Administration », l'applique (affichage immédiat) puis l'écrit dans le fichier.
// Rend vrai une fois l'écriture réussie, faux en cas d'échec (pour l'encart de confirmation, voir notify).
async function execute(op){
  op.at=op.at||new Date().toISOString();
  op.id=op.id||uid();
  op.author='Administration';
  const writing=S.store.execute(op);
  S.data=S.store.view();
  status('Enregistrement…','info'); render();
  try{ await writing; saved(); return true; }
  catch(e){ saveFailed(e); return false; }
}
// notify(msg) : ENCART DE CONFIRMATION « ✓ … enregistré » affiché environ 3 secondes en bas de l'écran, après un
// clic sur un bouton « Enregistrer » dont l'écriture dans le fichier a réussi. Il est hors de la zone redessinée
// par render() : il ne disparaît pas au rafraîchissement de la page.
let notifyTimer=0;
function notify(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast no-print'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite'); document.body.appendChild(el); }
  el.innerHTML=ico('check')+'<span>'+esc(msg)+'</span>';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(notifyTimer); notifyTimer=setTimeout(function(){ el.classList.remove('show'); },3000);
}
// afterSave(promises, msg) : affiche l'encart quand toutes les écritures ont réussi.
function afterSave(list,msg){ Promise.all(list).then(function(r){ if(r.every(Boolean)) notify(msg); }); }
// saved / saveFailed : résultat d'une écriture. En cas d'échec, les modifications restent en mémoire et le
// lien « Réessayer d'enregistrer » apparaît dans la ligne d'état ; la page avertit aussi avant d'être fermée.
function saved(){
  status('Enregistré à '+timeStr(),'ok');
  if(document.querySelector('[data-action="retry-save"]')&&!S.store.busy()) render();
}
function saveFailed(e){
  if(e&&e.name==='NotAllowedError'){ S.mode='reconnect'; render(); return; }
  status('Enregistrement impossible ('+((e&&e.message)||e)+'). Vos modifications sont gardées : cliquez sur « Réessayer d’enregistrer ».','error');
  render();
}
// downloadFile : sauvegarde fabriquée en mémoire et remise au navigateur. Aucun envoi réseau.
function downloadFile(fullName,content,type){
  const b=new Blob([content],{type:type}), u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=fullName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},2000);
}

/* --- Helpers d'affichage --- */

const ICO={

};
// ico : icône SVG prise dans ICO (dessins écrits en dur, aucune image externe).
function ico(n,cls){ return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICO[n]||'')+'</svg>'; }
// COULEUR PAR PERSONNE : une teinte bien distincte selon le rang dans l'équipe (vert, rose, bleu, violet,
// brun, turquoise…). Le rouge et l'orange sont réservés aux alertes. Les nuances claires et sombres suivent le thème.
const HUES=[140,325,210,265,28,178,100,290];
// hueOf : teinte de la personne, selon son rang dans l'équipe (0 si inconnue).
function hueOf(id){ const i=S.data?S.data.employees.findIndex(function(s){return s.id===id;}):-1; return i<0?0:HUES[i%HUES.length]; }
// tint : teinte d'après un nom (personne de l'équipe, sinon teinte calculée à partir des lettres).
function tint(n){
  const i=S.data?S.data.employees.findIndex(function(s){return s.name===n;}):-1;
  if(i>=0) return HUES[i%HUES.length];
  let h=0; n=String(n); for(let k=0;k<n.length;k++) h=(h*31+n.charCodeAt(k))%360; return h;
}
// who : nom d'une personne sur sa couleur.
function who(s){ return '<span class="who" style="--h:'+hueOf(s.id)+'">'+esc(s.name)+'</span>'; }
// firstName : prénom seul (premier mot du nom), pour le calendrier. Si deux personnes ont le même prénom,
// le nom complet est gardé pour les distinguer.
function firstName(s){
  const f=String(s.name).trim().split(/\s+/)[0]||s.name;
  const twin=S.data.employees.some(function(x){ return x.id!==s.id&&(String(x.name).trim().split(/\s+/)[0]||'').toLowerCase()===f.toLowerCase(); });
  return twin?s.name:f;

function targetDetail(st){

// overtimeOf(st, m) : HEURES SUPPLÉMENTAIRES, c'est-à-dire le surplus (positif) ou le manque (négatif) d'heures :
//   month ... ce mois : heures prévues − heures à faire (contrat moins congés)
//   total ... cumul : heures sup. des mois validés (cadenas) avant m + ce mois. Pour un mois validé, c'est le cumul
//             enregistré à la validation. Positif : heures à rendre ; négatif : heures dues.
// Le compteur entre dans les heures à faire du mois suivant pour être ramené à 0 (Core.targetOf) : atteindre les heures

function overtimeOf(st,m){

    tip:'Heures supplémentaires de '+C.monthLabel(m)+' : '+C.signedHours(month)+' = heures prévues ('+H(st.planned)+') − contrat moins congés ('+H(st.base)+'). '+
      'Recalculées à chaque changement du planning, même fait à la main. Cumul avec les mois validés (cadenas) : '+C.signedHours(total)+(total>0.01?' (à rendre)':total<-0.01?' (dues)':'')+'.'};
}
// shortSigned : écart d'heures en version courte pour le badge : 3 → « +3h », −1,5 → « −1h30 », 0 → « 0h ».
function shortSigned(v){
  const m=Math.round(Math.abs(v)*60), hh=Math.floor(m/60), mm=m%60;

// nowDate : date et heure actuelles en clair, pour les documents imprimés.

// printWithTitle : le titre du document sert de nom de fichier proposé par « Enregistrer au format PDF ».
function printWithTitle(titleText,before,after){

  function end(){ if(done) return; done=true; window.removeEventListener('afterprint',end); document.title=previous; if(after) after(); }

// gmailUrl : SEULE ADRESSE EXTERNE de la page. Rédaction d'un message Gmail (dans le navigateur), prérempli :
// destinataires, objet, texte. Ouverte seulement au clic du gérant, dans un nouvel onglet. Elle ne contient que des
// textes fixes, le nom du mois et les adresses e-mail saisies dans l'onglet Équipe : ni nom, ni heure, ni planning.
// GMAIL NE PERMET PAS DE JOINDRE UN FICHIER DEPUIS UNE ADRESSE : le PDF est téléchargé, puis glissé dans le message.
function gmailUrl(to,subject,body){ return 'https://mail.google.com/mail/?view=cm&fs=1'+(to.length?'&to='+encodeURIComponent(to.join(',')):'')+'&su='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body); }

function mailRecipients(individual){
  const list=individual?[C.findEmployee(S.data,S.filter.employee)].filter(Boolean):S.data.employees.filter(function(s){return !s.manager;});
  return {to:list.filter(function(s){return s.email;}).map(function(s){return s.email;}), missing:list.filter(function(s){return !s.email;}).map(function(s){return s.name;})};

// fileName : nom de fichier sans caractère interdit par Windows ou macOS.
function fileName(t){ return String(t).replace(/[\\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim(); }
// startMail : ENVOI PAR GMAIL, en un clic, sans serveur. Comme le fichier ne peut pas être joint automatiquement :
//   1. le PDF du planning affiché est fabriqué dans la page (planningPdf) et TÉLÉCHARGÉ aussitôt, sans fenêtre :
//      Chrome le range dans son dossier de téléchargements (Téléchargements par défaut) ;
//   2. Gmail s'ouvre dans un nouvel onglet, sur un message prérempli (destinataires, objet, texte) ;
//   3. un bandeau dit « Le fichier a été téléchargé, glissez-le dans le mail ».
function startMail(individual){
  const title=printTitle(), month=C.monthLabel(S.month), r=mailRecipients(individual), file=fileName(title)+'.pdf';
  const subject=(individual?'Votre planning de ':'Planning de ')+month;
  const body='Bonjour,\n\nVous trouverez ci-joint '+(individual?'votre planning':'le planning')+' de '+month+'.\n\nBonne journée.';
  let pdf;
  try{ pdf=planningPdf(title); }catch(e){ showError('Le PDF n’a pas pu être fabriqué',e); return; }
  downloadFile(file,pdf,'application/pdf');
  const url=gmailUrl(r.to,subject,body);
  window.open(url,'_blank','noopener');
  S.mail={month:S.month,title:title,file:file,to:r.to,missing:r.missing,url:url};
  render();
}

// Le PDF est écrit ici même, sans bibliothèque ni réseau : PDF 1.4, une page A4 paysage, polices standard des lecteurs
// PDF (Helvetica, aucune police embarquée), encodage WinAnsi (accents du français ; un caractère hors de cet
// encodage devient « ? »). Contenu : le calendrier du mois tel qu'il est affiché (planning global, ou planning
// individuel filtré), les heures de chaque semaine et les heures du mois. Seules des valeurs calculées et des noms y
// sont écrits, échappés par pdfStr.
// Largeurs des caractères 32 à 126 (millièmes de la taille), Helvetica et Helvetica-Bold : pour couper un texte
// trop long et placer les étiquettes. Une lettre accentuée prend la largeur de sa lettre de base.
const PDF_WR=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const PDF_WB=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const PDF_WIN={'€':128,'‚':130,'„':132,'…':133,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159};
const PDF_WX={'’':222,'‘':222,'–':556,'—':1000,'…':1000,'«':556,'»':556,'°':400,'€':556,'œ':944,'Œ':1000,'•':350};
function pdfCharW(ch,bold){
  const t=bold?PDF_WB:PDF_WR; let c=ch.charCodeAt(0);
  if(c>=32&&c<=126) return t[c-32];
  if(ch==='\u00a0'||ch==='\u202f') return t[0];
  if(ch==='\u2212') return t[13];
  if(PDF_WX[ch]) return PDF_WX[ch];
  c=ch.normalize('NFD').charCodeAt(0); return c>=32&&c<=126?t[c-32]:556;
}
function pdfTextW(s,size,bold){ let w=0; for(const ch of String(s)) w+=pdfCharW(ch,bold); return w*size/1000; }
// pdfFit : texte coupé (avec « … ») pour tenir dans la largeur w.
function pdfFit(s,w,size,bold){
  s=String(s); if(pdfTextW(s,size,bold)<=w) return s;
  while(s.length>1&&pdfTextW(s+'…',size,bold)>w) s=s.slice(0,-1);
  return s+'…';
}
// pdfStr : chaîne PDF en WinAnsi ; parenthèses et barres obliques échappées, octets hors ASCII en octal.
function pdfStr(s){
  let o='(';
  for(const ch of String(s)){
    let c=ch.charCodeAt(0);
    if(ch==='\u00a0'||ch==='\u202f') c=32; else if(ch==='\u2212') c=45; else if(c>255) c=PDF_WIN[ch]||63; else if(c>=128&&c<160) c=63;
    if(c===40||c===41||c===92) o+='\\'+String.fromCharCode(c);
    else if(c<32||c>126) o+='\\'+c.toString(8).padStart(3,'0');
    else o+=String.fromCharCode(c);
  }
  return o+')';
}
// pdfRgb : couleur '#rrggbb' ou [teinte, saturation %, luminosité %] → « r g b » (0 à 1).
function pdfRgb(c){
  let r,g,b;
  if(typeof c==='string'){ r=parseInt(c.slice(1,3),16)/255; g=parseInt(c.slice(3,5),16)/255; b=parseInt(c.slice(5,7),16)/255; }
  else{ const h=c[0], s=c[1]/100, l=c[2]/100, a=s*Math.min(l,1-l);
    const f=function(n){ const k=(n+h/30)%12; return l-a*Math.max(-1,Math.min(k-3,9-k,1)); }; r=f(0); g=f(8); b=f(4); }
  return [r,g,b].map(function(x){ return (Math.round(x*1000)/1000).toString(); }).join(' ');
}
// pdfDoc : surface de dessin d'une page (origine en haut à gauche, en points) et assemblage du fichier.
function pdfDoc(PW,PH){

        n(X+r-k)+' '+n(Y+h)+' '+n(X)+' '+n(Y+h-r+k)+' '+n(X)+' '+n(Y+h-r)+' c '+n(X)+' '+n(Y+r)+' l '+n(X)+' '+n(Y+r-k)+' '+n(X+r-k)+' '+n(Y)+' '+n(X+r)+' '+n(Y)+' c h');

// planningPdf(title) : PDF du planning ENREGISTRÉ du mois affiché, comme le calendrier à l'écran : planning global, ou
// planning individuel si un filtre est ouvert. Une page A4 paysage ; la taille du texte s'ajuste pour que tout tienne.
function planningPdf(title){
  const m=S.month, asg=savedAsg(), todayIso=C.today(), summary=C.analyze(S.data,m,asg,{today:todayIso}), filter=S.filter||null;
  const emp=filter&&filter.employee||'', es=emp?C.findEmployee(S.data,emp):null;
