<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- POLITIQUE DE SÉCURITÉ DU CONTENU (CSP), appliquée par le navigateur lui-même. -->
<!--   default-src 'none' ........... tout ce qui n'est pas autorisé ci-après est interdit. -->
<!--   script-src 'unsafe-inline' ... seuls les scripts écrits dans ce fichier s'exécutent ; eval() reste interdit. -->
<!--   style-src 'unsafe-inline' .... seuls les styles écrits dans ce fichier. -->
<!--   img-src data: ................ aucune image distante. -->
<!--   connect-src 'none' ........... aucune connexion réseau possible depuis le script. -->
<!--   form-action 'none' ........... aucun envoi de formulaire. -->
<!--   base-uri 'none' .............. l'adresse de base de la page ne peut pas être détournée. -->
<!-- 'unsafe-inline' est imposé par l'absence de serveur : la protection contre l'injection repose sur -->
<!-- l'échappement systématique par esc() (voir le script Interface). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<!-- ===================================================================================== -->
<!-- PLANNING DE L'ÉLEVAGE : guide de lecture pour un audit technique -->
<!-- ===================================================================================== -->
<!-- NATURE -->
<!--   Page HTML autonome, dérivée de « Permanences du week-end » (même architecture). Aucun serveur, -->
<!--   aucune dépendance externe, aucune requête réseau. Elle lit et écrit deux fichiers dans UN dossier -->
<!--   choisi et autorisé par l'utilisateur, grâce à l'API File System Access de Google Chrome. -->
<!--   Usage prévu : un seul utilisateur (le gérant), fichiers sur le disque de l'ordinateur. -->
<!--  -->
<!-- STRUCTURE DU FICHIER -->
<!--   1. head : politique de sécurité (CSP), feuille de style (bloc « @media print » pour l'impression). -->
<!--   2. body : deux conteneurs vides (#app et #print-area), remplis par le script. -->
<!--   3. Script « Core », entre les repères CORE-DEBUT et CORE-FIN : logique métier pure (dates, saisons, -->
<!--      créneaux, données, journal, enregistrement, répartition automatique, analyse et alertes). -->
<!--      Il n'accède ni à l'écran ni aux fichiers : il s'extrait et se teste hors navigateur. -->
<!--   4. Script « Interface » : état, rendu, événements, accès au dossier, impression. -->
<!--  -->
<!-- FLUX DE DONNÉES -->
<!--   Entrées : planning-elevage-donnees.json et planning-elevage.log (dossier choisi) ; saisies du gérant. -->
<!--   Sorties : ces deux mêmes fichiers ; impression ou PDF ; téléchargement local d'une sauvegarde JSON ; -->
<!--   téléchargement local du PDF du planning (planningPdf, fabriqué dans la page) ; un lien de rédaction d'un -->
<!--   message Gmail (gmailUrl), ouvert seulement au clic du gérant, dans un nouvel onglet : il ne porte que des -->
<!--   textes fixes, le nom du mois et les adresses e-mail saisies dans Équipe (le PDF est joint à la main). -->
<!--   Aucune autre sortie : ni fetch, ni XMLHttpRequest, ni WebSocket, ni formulaire, aucun autre lien externe, -->
<!--   ni balise chargeant une ressource (img, iframe, link, script src). -->
<!--  -->
<!-- STOCKAGE SUR LE POSTE -->
<!--   IndexedDB : uniquement le lien vers le dossier (objet opaque remis par le navigateur). -->
<!--   Aucune donnée de planning, aucun nom, aucune préférence n'est conservé dans le navigateur. -->
<!--  -->
<!-- SÉCURITÉ : POINTS DE CONTRÔLE -->
<!--   Réseau interdit ................. balise meta Content-Security-Policy ci-dessus (connect-src 'none'). -->
<!--   Aucun code extérieur ............ même balise (default-src 'none', pas de script src). -->
<!--   Injection dans l'écran .......... esc() : toute valeur lue ou saisie y passe avant innerHTML. -->
<!--   Injection dans le journal ....... Core.logLine() : clean() retire retours à la ligne et séparateurs. -->
<!--   Fichier modifié à la main ....... Core.normalize() : champs inconnus ignorés, valeurs typées et bornées. -->
<!--   Valeurs reçues des écrans ....... contrôles des actions save-team / save-all-settings, puis revalidation -->
<!--                                     dans Core.applyOp() (double contrôle). -->
<!--   Fichiers lus et écrits .......... fileIo() : deux noms fixés par le code, dans le seul dossier autorisé. -->
<!--   Fichier existant jamais écrasé .. openFolder() : création seulement si aucun fichier n'existe. -->
<!--   Modification non écrite ......... Core.Store (dirty, busy) et l'écouteur beforeunload en fin de fichier. -->
<!--  -->
<!-- LIMITES ASSUMÉES -->
<!--   Pas d'authentification : l'interrupteur « Administration » est un filtre d'affichage, sans mot de passe. -->
<!--   Pas de chiffrement : les deux fichiers sont en clair. Le contrôle d'accès est celui du dossier et de -->
<!--   la session de l'ordinateur. -->
<!--   'unsafe-inline' dans la CSP : imposé par l'absence de serveur ; la barrière contre l'injection est esc(). -->
<!--  -->
<!-- VOCABULAIRE -->
<!--   Code, classes CSS et clés du fichier de données sont en anglais : « shift » = créneau, « manager » = -->
<!--   gérant, « employees » = l'équipe, « schedules » = plannings. Textes affichés et journal en français. -->
<!-- ===================================================================================== -->
<title>Planning</title>
<!-- FEUILLE DE STYLE. Entièrement locale : ni url(), ni @import, ni police distante. -->
<!-- Organisation : variables de couleur (:root), puis un bloc par zone de l'écran (barre du haut, onglets, -->
<!-- boutons, calendrier, cartes, Équipe, Réglages, fiche imprimée), puis l'impression (@media print). -->
<style>
:root{
  color-scheme:light;
  /* Couleurs de l'exploitation : fond #eee8d0, couleur d'accent #61a7ab (boutons, liens, repères) */
  --bg:#eee8d0; --surface:#ffffff; --surface-2:#faf7ec; --surface-3:#f2edda;
  --text:#1f2523; --muted:#646152; --faint:#958f7b; --border:#e4ddc4; --border-strong:#cfc6a7;
  --accent:#61a7ab; --accent-hover:#4f9397; --on-accent:#ffffff; --accent-soft:#e2f0f0; --accent-text:#61a7ab;
  --danger:#c42b1c; --danger-soft:#fdeceb; --ok:#61a7ab; --ok-soft:#e2f0f0; --warn:#8f5600; --warn-soft:#fff3d1;
  --shop:#b35400; --shop-soft:#fdf0e3; --boss:#4b5bb5; --boss-soft:#eceefb;
  --shadow-sm:0 1px 2px rgba(17,24,39,.05),0 1px 3px rgba(17,24,39,.06);
  --shadow-md:0 6px 18px rgba(17,24,39,.08),0 1px 3px rgba(17,24,39,.06);
  --r-sm:6px; --r:10px; --r-lg:14px;
  --av-s:55%; --av-bg:91%; --av-fg:30%;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{letter-spacing:-.01em}
h1{font-size:1.2rem;margin:0;font-weight:650;line-height:1.25}
h2{font-size:1.25rem;margin:0;font-weight:650}
h3{font-size:.8rem;margin:1.6rem 0 .6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
p{margin:.35rem 0}
code{background:var(--surface-3);padding:.08rem .35rem;border-radius:4px;font-size:.88em}
.ico{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Même largeur pour tous les onglets (assez large pour le tableau des créneaux de Réglages) */
.container{max-width:1500px;margin:0 auto;padding:0 16px 48px}
.help{color:var(--muted);font-size:.9rem}
.print-only{display:none}

/* Barre du haut */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border)}
.bar-inner{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#1f4f52));color:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}
.logo .ico{width:21px;height:21px}
.sub-title{color:var(--muted);font-size:.82rem}
.bar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.88rem;font-weight:550;user-select:none;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:38px;height:22px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
/* Navigation par mois */
.nav-month{display:inline-flex;align-items:center;gap:4px}
.nav-month .btn{padding:.38rem .45rem}
.nav-month input{padding:.34rem .5rem;font-weight:650;font-variant-numeric:tabular-nums}


/* Ligne d'état */
.state{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem 1rem;font-size:.84rem;color:var(--muted);padding:12px 0 4px}
.state-file{display:inline-flex;gap:.35rem;align-items:center;flex-wrap:wrap;min-width:0}
.state-file .ico{width:15px;height:15px}
.state-file b{color:var(--text);font-weight:600;overflow-wrap:anywhere}
.state-file>span{color:var(--faint)}
.status{display:inline-flex;align-items:center;gap:.4rem}
.status::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status:empty::before{display:none}
.state>.status{display:block;flex:1 1 12rem;min-width:0;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state>.status::before{display:inline-block;margin-right:.4rem;vertical-align:1px}
.state>.status:empty::before{display:none}
.status-ok{color:var(--ok)} .status-ok::before{background:var(--ok)}
.status-info{color:var(--accent-text)} .status-info::before{background:var(--accent)}
.status-error{color:var(--danger);font-weight:600} .status-error::before{background:var(--danger)}
.state-links{display:inline-flex;gap:.9rem;margin-left:auto}
.link{display:inline-flex;align-items:center;gap:.3rem;background:none;border:0;padding:0;color:var(--accent-text);cursor:pointer;font-size:inherit;font-weight:550}
.link:hover{text-decoration:underline}
.link .ico{width:14px;height:14px}

/* Onglets */
nav.tabs{margin:10px 0 20px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tabs-inner{display:inline-flex;gap:2px;padding:4px;background:var(--surface-3);border-radius:12px;min-width:max-content}
.tabs button{display:inline-flex;align-items:center;gap:.45rem;border:0;background:none;padding:.5rem .9rem;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:550;font-size:.92rem;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.tabs button[aria-current="page"] .ico{color:var(--accent)}
.tabs .sep{width:1px;background:var(--border-strong);margin:6px 4px}

/* Cartes, sections */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.card>h2{font-size:1.02rem;margin-bottom:.8rem}
.head-section{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin:4px 0 16px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.month-head .tools{justify-content:flex-end}
.state-empty{text-align:center;padding:40px 20px}
.state-empty .ico{width:40px;height:40px;color:var(--faint);margin-bottom:8px}
.state-empty b{display:block;font-size:1.05rem;margin-bottom:.2rem}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid transparent;padding:.55rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem;line-height:1.2;transition:background .12s,border-color .12s,box-shadow .12s}
.btn .ico{width:17px;height:17px}
a.btn{text-decoration:none}
.btn-pri{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm)}
.btn-pri:hover{background:var(--accent-hover)}
.btn-sec{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-sec:hover{background:var(--surface-2)}
.btn-danger{background:var(--surface);border-color:color-mix(in srgb,var(--danger) 45%,var(--border));color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-subtle{background:none;color:var(--muted);padding:.45rem .7rem}
.btn-subtle:hover{background:var(--surface-3);color:var(--text)}
/* Suppression discrète : grise au repos, rouge au survol */
.btn-subtle-danger{background:none;color:var(--muted);padding:.45rem .7rem}
.btn-subtle-danger:hover{background:var(--danger-soft);color:var(--danger)}
.btn-small{padding:.32rem .65rem;font-size:.84rem;font-weight:550}
.btn-small .ico{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}

/* Bandeaux */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;margin:0 0 16px;border:1px solid;font-size:.92rem}
.banner>.ico{margin-top:2px}
.setup-steps{margin:.4rem 0 .5rem;padding-left:1.3rem}
.setup-steps li{margin:.2rem 0}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text)}
.banner.info>.ico{color:var(--accent)}
.banner.caution{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.caution>.ico{color:var(--warn)}
.banner.error{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.banner.error>.ico{color:var(--danger)}

/* Étiquettes */
.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;line-height:1.3;padding:.12rem .5rem;border-radius:999px;font-weight:650;white-space:nowrap}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-danger{background:var(--danger-soft);color:var(--danger)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-accent{background:var(--accent-soft);color:var(--accent-text)}
.tag-grey{background:var(--surface-3);color:var(--muted)}
.tag-shop{background:var(--shop-soft);color:var(--shop)}
.tag-boss{background:var(--boss-soft);color:var(--boss)}

/* Formulaires */
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{border:1px solid var(--border-strong);border-radius:8px;padding:.5rem .65rem;background:var(--surface);max-width:100%;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;min-height:6rem;resize:vertical}
.grid-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 1.2rem;align-items:end}
.field{display:flex;flex-direction:column;align-items:stretch;gap:.35rem;margin-bottom:.9rem;min-width:0}
.field>span{font-weight:600;font-size:.88rem}
.check{display:inline-flex;align-items:center;gap:.4rem;font-size:.9rem;cursor:pointer;white-space:nowrap}
.check input{width:1.05rem;height:1.05rem;accent-color:var(--accent);cursor:pointer}

/* Indicateurs et compteur */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border-strong)}
.kpi.ok::before{background:var(--ok)} .kpi.warn::before{background:var(--warn)} .kpi.danger::before{background:var(--danger)} .kpi.accent::before{background:var(--accent)}
.kpi-l{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi-v{font-size:1.65rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi-s{font-size:.8rem;color:var(--muted)}
/* Compteur fixé en bas de l'écran pendant la consultation et la modification du planning */
.counter-bar{position:sticky;bottom:12px;z-index:15;display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;align-items:center;margin:16px 0 0;padding:10px 16px;border-radius:12px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border-strong);box-shadow:var(--shadow-md);font-size:.9rem}
.counter-bar b{font-variant-numeric:tabular-nums}
.counter-bar .c-main{font-weight:650}
.counter-bar .c-todo b{color:var(--warn)} .counter-bar .c-ok b{color:var(--ok)} .counter-bar .c-bad b{color:var(--danger)}
.counter-bar .c-people{display:flex;flex-wrap:wrap;gap:.3rem 1rem;color:var(--muted)}
.counter-bar .c-person{display:inline-flex;align-items:center;gap:.35rem}

/* En-tête du mois et actions */
.month-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px;margin:4px 0 14px}
.month-title{font-size:1.7rem;line-height:1.15}
.actions-sep{flex:1}
/* Cartes « heures du mois » */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:0 0 16px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:7px}
.pcard-top{display:flex;align-items:center;justify-content:space-between;gap:.4rem .5rem;flex-wrap:wrap}
.ot-history{margin-top:10px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2)}
.ot-history h3{margin:0 0 .4rem;font-size:.95rem}
.ot-now{margin:0 0 .5rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.ot-table{width:100%;border-collapse:collapse;font-size:.88rem}
.ot-table th,.ot-table td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:left}
.ot-table .num{text-align:right;font-variant-numeric:tabular-nums}
.ot-table td .ico{width:.85rem;height:.85rem;vertical-align:-2px;margin-right:3px}
.ot-up{color:var(--ok);font-weight:700}
.ot-down{color:var(--warn);font-weight:700}
.ot-table tr.ot-prov td{color:var(--muted)}
.pcard-tags{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:flex-end}
.ot-badge.lv-badge{background:var(--accent-soft);color:var(--accent-hover);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.ot-badge.lv-badge.ot-neg{background:var(--warn-soft);color:var(--warn)}
.pcard-name{display:inline-flex;align-items:center;gap:.5rem;font-weight:650;font-size:1.02rem;min-width:0}
.pcard-hours{font-size:1.55rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.pcard-hours span{font-size:.95rem;font-weight:500;color:var(--muted)}
.pcard-meta{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.2rem .35rem;align-items:center}
.pcard .link{font-size:.84rem}
.pcard-foot{margin-top:auto;padding-top:2px}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:.15rem .6rem;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.todo,.pill.over{background:var(--warn-soft);color:var(--warn)}
.pill.boss{background:var(--boss-soft);color:var(--boss)}
.print-hours{font-size:9pt;margin:0 0 6pt}
/* Jour gardé (cadenas) : cliquer pour le libérer */
.lock-tag{display:inline-flex;align-items:center;gap:2px;border:0;background:var(--accent-soft);color:var(--accent-text);border-radius:999px;font-size:.68rem;font-weight:700;padding:.05rem .45rem;cursor:pointer}
.lock-tag .ico{width:11px;height:11px}
.lock-tag:hover{background:var(--surface-3)}
/* Fiches de l'équipe */
.person-head{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1rem;margin-bottom:.9rem}
.person-head .name{flex:1 1 14rem;font-weight:650;font-size:1.05rem}
.can-row{display:flex;align-items:center;gap:.8rem;padding:.2rem 0}
.can-row>.check{min-width:7.5rem}
.day-cb input:disabled+span{opacity:.35;border-style:dashed;cursor:not-allowed;background:transparent;color:var(--faint)}
/* Bouton « Enregistrer » unique, fixé en bas de l'écran */
.save-bar{position:sticky;bottom:12px;z-index:15;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:flex-end;margin:16px 0 0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border-strong);box-shadow:var(--shadow-md)}

/* Temps par activité (bas de page) */
.activity{display:flex;flex-direction:column;gap:10px}
.act-row{display:grid;grid-template-columns:minmax(7rem,11rem) repeat(var(--acts,2),7rem) minmax(8rem,1fr) 8rem;gap:8px 16px;align-items:center}
.act-val{display:flex;flex-direction:column;line-height:1.2}
.act-val b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.act-l{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:650}
.act-bar{display:flex;height:14px;border-radius:999px;background:var(--surface-3);overflow:hidden}
/* Couleurs des activités, dans l'ordre des créneaux (c0 à c3, puis on recommence). */
.sw.c0,.act-bar>.c0{background:var(--accent)} .sw.c1,.act-bar>.c1{background:#c9a55c}
.sw.c2,.act-bar>.c2{background:#9b7fc4} .sw.c3,.act-bar>.c3{background:#d9785b}
.act-pct{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.act-legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;align-items:center;font-size:.86rem;font-weight:600;margin:-.2rem 0 .9rem}
.act-legend>span{display:inline-flex;align-items:center;gap:.4rem}
.act-legend .help{font-weight:400}
.act-l{display:inline-flex;align-items:center;gap:.3rem}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
@media screen and (max-width:640px){ .act-row{grid-template-columns:1fr 1fr 1fr} .act-bar,.act-pct{grid-column:1/-1} }

/* Calendrier du mois */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal.with-tot{grid-template-columns:repeat(7,minmax(0,1fr)) repeat(var(--wcols),minmax(4.4rem,5.2rem))}
.tot-head{text-align:center;padding:0 0 2px}
.week-tot{border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;background:hsl(var(--h) 55% 95%);border:1px solid hsl(var(--h) 40% 85%);color:hsl(var(--h) 55% 28%)}
.week-tot b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.week-tot .wt-l{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;opacity:.75}
.week-tot .wt-name{display:none;font-weight:650;font-size:.8rem}
.week-tot .wt-leave{font-size:.68rem;font-weight:650}
/* Congés : ligne rayée à la couleur de la personne ; en mode « Congés », la case du jour est cliquable */
.holiday-line{font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent-hover);border:1px dashed var(--accent)}
.leave-line{font-size:.74rem;font-weight:650;padding:1px 6px;border-radius:5px;color:hsl(var(--h) 55% 26%);background:repeating-linear-gradient(135deg,hsl(var(--h) 55% 93%) 0 6px,hsl(var(--h) 50% 86%) 6px 12px)}
.day.leave-pick{cursor:pointer}
.day.leave-pick:hover,.day.leave-pick:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.block-line{font-size:.74rem;font-weight:650;padding:0 6px;border-radius:5px;color:hsl(var(--h) 45% 28%);background:var(--surface);border:1.5px dashed hsl(var(--h) 45% 55%)}
.block-pick{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:2px;padding-top:4px;border-top:1px dashed var(--border)}
.block-who{font-size:.72rem;font-weight:700;color:hsl(var(--h) 45% 30%)}
.block-chip{display:inline-flex;align-items:center;gap:3px;font:inherit;font-size:.72rem;font-weight:650;padding:2px 7px;border-radius:999px;cursor:pointer;background:var(--surface);color:hsl(var(--h) 45% 28%);border:1.5px solid hsl(var(--h) 40% 70%)}
.block-chip:hover,.block-chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.block-chip.on{background:hsl(var(--h) 45% 88%);border-style:dashed;border-color:hsl(var(--h) 45% 45%);text-decoration:line-through}
.block-chip .ico{width:.85rem;height:.85rem}
/* Encart de confirmation après « Enregistrer » (notify) */
.toast{position:fixed;left:50%;bottom:84px;z-index:60;display:flex;align-items:center;gap:.5rem;padding:.6rem 1.1rem;border-radius:999px;background:color-mix(in srgb,var(--accent) 68%,#000);color:#fff;font-weight:650;box-shadow:0 6px 20px rgba(0,0,0,.18);transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ico{width:1.1rem;height:1.1rem}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.day.on-leave{background:repeating-linear-gradient(135deg,hsl(var(--h) 55% 96%) 0 8px,hsl(var(--h) 50% 90%) 8px 16px);border-color:hsl(var(--h) 40% 70%)}
.leave-controls{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;margin-top:.5rem}
.leave-controls select{min-width:14rem;font-weight:650}
.leave-controls select.who-sel{background:hsl(var(--h) var(--av-s) var(--av-bg));color:hsl(var(--h) 55% var(--av-fg))}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
.cal-head{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:0 6px 2px}
.day{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:6px 7px 7px;min-height:118px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow-sm)}
.day.out{background:transparent;border:1px dashed var(--border);box-shadow:none;cursor:default}
/* Jour du mois voisin : visible pour information, grisé et sans interaction */
.day.out .day-num,.day.out .out-body{opacity:.5;filter:grayscale(.6)}
.day.out .out-body{display:flex;flex-direction:column;gap:4px;pointer-events:none;user-select:none}
.day.past{opacity:.72}
.day.today{border-color:var(--accent-hover);box-shadow:0 0 0 2px var(--accent)}
.day.modified{box-shadow:inset 0 3px 0 var(--accent),var(--shadow-sm)}
.day.problem{border-color:color-mix(in srgb,var(--danger) 55%,var(--accent))}
.day-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.day-num{font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums}
.day-num small{font-weight:550;color:var(--muted);font-size:.72rem;margin-left:.25rem}
.day-tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px;align-items:center}
/* Tous les créneaux sur le même fond beige, quelle que soit leur activité */
.slot{display:flex;flex-direction:column;gap:2px;font-size:.78rem;line-height:1.25;border-left:3px solid var(--border-strong);padding:2px 0 2px 6px;background:var(--surface-3);border-radius:0 6px 6px 0}
.slot.missing{border-left-color:var(--danger)}
/* Créneau « Ne jamais laisser vide » resté sans personne : en rouge, avec l'explication */
.slot.never-empty{background:var(--danger-soft);border-left-width:4px}
.slot .empty-why{color:var(--danger);font-size:.7rem;font-weight:600;line-height:1.25}
/* Case hors du mois d'une semaine à cheval dont le mois voisin n'est pas planifié */
.day.out .out-note{font-size:.68rem;color:var(--warn);font-weight:650;line-height:1.25}
.slot-h{color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:4px}
.slot-h .slot-info{font-weight:700;color:var(--shop);text-transform:uppercase;font-size:.66rem;letter-spacing:.04em}
.slot-p{display:flex;flex-wrap:wrap;gap:2px 6px;font-weight:600}
.slot-p .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* Nom d'une personne sur sa couleur (--h = teinte de la personne) */
.who{display:inline-block;padding:0 .4rem;border-radius:5px;font-weight:650;background:hsl(var(--h) var(--av-s) var(--av-bg));color:hsl(var(--h) 55% var(--av-fg))}
.legend .who{font-size:.8rem}
.slot select.who-sel{background:hsl(var(--h) var(--av-s) var(--av-bg));color:hsl(var(--h) 55% var(--av-fg));font-weight:650;border-color:hsl(var(--h) 40% 70%)}
.slot-p .none{color:var(--danger);font-weight:700}
.slot select{width:100%;padding:.15rem .25rem;font-size:.76rem;border-radius:6px;margin:1px 0}
.slot select.empty{border-style:dashed;color:var(--muted);background:transparent}
.day .lock{display:inline-flex;align-items:center;gap:2px;color:var(--faint);cursor:pointer}
.day .lock input{width:.9rem;height:.9rem;accent-color:var(--accent);cursor:pointer;margin:0}
.day .lock .ico{width:13px;height:13px}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;font-size:.84rem;color:var(--muted);margin:.2rem 0 .9rem;align-items:center}
.legend>span{display:inline-flex;align-items:center;gap:.4rem}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px;border-left:3px solid var(--accent);background:var(--surface-3)}
.lg.missing{border-left-color:var(--danger)}

/* Tableaux */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--border);padding:.55rem .7rem;text-align:left;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
thead th{background:var(--surface-2);font-weight:650;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0;z-index:1}
tr.week-row th{background:var(--surface);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-text);font-weight:700;padding-top:1rem}
tr.total-row td{background:var(--surface-2);font-weight:650}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{white-space:nowrap}
th.center,td.center{text-align:center}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.hb{display:inline-block;min-width:2.4rem;text-align:center;padding:.08rem .4rem;border-radius:6px;font-weight:650;font-size:.82rem;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent-text);margin:1px}
.hb.boss{background:var(--boss-soft);color:var(--boss)}
.miss{color:var(--danger);font-weight:700}
.over-day{color:var(--danger);font-weight:700;font-size:.74rem;line-height:1.25}
.c-bad b,.c-over{color:var(--danger)}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.9rem}
.alerts li:last-child{border-bottom:0}
.alerts li .ico{width:16px;height:16px;margin-top:2px;color:var(--danger)}
.alerts li.monthmax .ico,.alerts li.uncovered .ico{color:var(--warn)}
.ok-row{display:flex;gap:.5rem;align-items:center;color:var(--ok);font-weight:600}
.col-bar{width:32%;min-width:140px}
.bar-load{position:relative;height:10px;border-radius:999px;background:var(--surface-3)}
.bar-load .filled{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.bar-load .filled.over{background:var(--warn)}
.bar-load .goal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.45;border-radius:1px}

/* Personnes */
.list-agents{list-style:none;margin:0;padding:0}
.list-agents li{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--border)}
.list-agents li:last-child{border-bottom:0}
.list-agents .name{flex:1 1 11rem;font-weight:550}
.inline-field{display:inline-flex;align-items:center;gap:.35rem;font-size:.88rem;color:var(--muted)}
.inline-field input[type=number]{width:5.2rem}
/* Éditeur de créneaux */
.shifts td{vertical-align:top}
.shifts input[type=text]{width:8.5rem}
.shifts input.shift-time{width:4.4rem;padding:.35rem .4rem;text-align:center}
.shifts input[type=time]{width:7.2rem;padding:.35rem .4rem}
.shifts input[type=number]{width:4.2rem;padding:.35rem .4rem}
.shifts select{padding:.35rem .4rem}
.shifts th{white-space:normal;line-height:1.2;vertical-align:bottom}
.ne-cb{display:flex;flex-direction:column;gap:2px;font-size:.8rem}
/* Explication des colonnes du tableau des créneaux : une ligne par colonne */
.holidays{display:flex;flex-direction:column;gap:6px;margin-top:.6rem}
.holiday-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.holiday-row input[type=text]{flex:0 1 20rem}
.col-help{margin:.8rem 0 .4rem;padding-left:1.2rem;display:flex;flex-direction:column;gap:.25rem}
.person-head input[type=email]{flex:1 1 16rem;min-width:12rem}
/* Bouton « Supprimer » d'un créneau : l'icône seule (le texte reste dans la bulle d'aide), pour que le tableau tienne */
.shifts td:last-child .btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.shifts input[type=checkbox]{width:1.05rem;height:1.05rem;accent-color:var(--accent);cursor:pointer}
.days-cb{display:flex;gap:2px}
.shift-pick{display:inline-flex;align-items:center;gap:.4rem}
.shift-pick .day-cb span{width:20px;height:22px;font-size:.68rem}
/* Créneau non coché : ses jours sont estompés */
.shift-pick:has(>label input:not(:checked)) .days-cb{opacity:.3}
.day-cb{position:relative;cursor:pointer}
.day-cb input{position:absolute;opacity:0;width:1px;height:1px}
.day-cb span{display:inline-grid;place-items:center;width:24px;height:26px;border-radius:6px;border:1px solid var(--border-strong);font-size:.76rem;font-weight:700;color:var(--muted)}
.day-cb input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day-cb input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.season-l{display:block;font-size:.72rem;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}

/* Liens sous le nom du salarié (Fiche d'heures, Planning individuel) */
.boss-note{display:none;margin:0 0 .9rem}
/* Fiche de l'équipe : « Gérant » coché → les champs d'heures disparaissent aussitôt, la mention « Présence seulement » apparaît */
.person-card:has(.boss-cb:checked) .hours-fields{display:none}
.person-card:has(.boss-cb:checked) .boss-note{display:block}
/* Heures sup. de la carte : surplus en vert-bleu, manque en orangé */
/* Badge en haut à droite de la carte : +Xh (heures sup.) sur fond vert-bleu, −Xh (heures en moins) sur fond orangé */
.ot-badge{flex:none;font-size:.82rem;font-weight:750;padding:.15rem .6rem;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:help;background:var(--surface-3);color:var(--muted)}
.ot-badge.ot-pos{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 35%,transparent)}
.ot-badge.ot-neg{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 35%,transparent)}
.pcard-links{display:flex;flex-wrap:wrap;gap:.15rem .9rem;margin-top:-3px}
/* Boutons au-dessus du calendrier (impression du planning global, Gmail) */
.cal-tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin:0 0 8px}
/* Planning individuel : ligne qui dit ce qui est affiché (aussi imprimée) */
.filter-scope{font-weight:650;margin:0 0 8px}
.leave-balance{margin:.45rem 0 0;font-weight:600}
/* Règles de répartition (Réglages) : liste réordonnable par glisser-déposer */
.rules{list-style:none;margin:.6rem 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rule{display:grid;grid-template-columns:auto 1.6rem minmax(0,1fr) auto;gap:.2rem .6rem;align-items:center;padding:.5rem .6rem;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);cursor:grab}
.rule:active{cursor:grabbing}
.rule.off{opacity:.6}
.rule.dragging{opacity:.4}
.rule.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.rule.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.rule-grip{color:var(--faint);display:inline-flex}
.rule-rank{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.8rem}
.rule.off .rule-rank{background:var(--border-strong)}
.rule-text{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.rule-label{white-space:normal;font-weight:600}
.rule-text .help{font-size:.82rem}
.rule-move{display:inline-flex;gap:2px}
.tag .ico{width:11px;height:11px}

/* Accueil */
.home{max-width:880px;margin:0 auto;padding:56px 16px}
.home-head{text-align:center;margin-bottom:28px}
.home-head .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px}
.home-head .logo .ico{width:30px;height:30px}
.home-head h1{font-size:1.7rem}
.home-head p{color:var(--muted);max-width:620px;margin:.5rem auto 0}
.choice{display:grid;grid-template-columns:minmax(0,480px);justify-content:center}
.choice .card{display:flex;flex-direction:column;gap:.6rem;margin:0;padding:24px}
.choice .card .btn{margin-top:auto;align-self:flex-start}
.choice-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.choice-ico .ico{width:22px;height:22px}
.tip{display:flex;gap:.5rem;align-items:flex-start;font-size:.86rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:.6rem .75rem}
.tip .ico{width:16px;height:16px;color:var(--accent);margin-top:2px}

@media screen and (max-width:820px){
  .card{padding:16px}
  .cal{grid-template-columns:1fr}
  .cal.with-tot{grid-template-columns:1fr}
  .cal-head,.day.out{display:none}
  .week-tot{flex-direction:row;gap:.5rem;padding:6px 10px}
  .week-tot .wt-name{display:inline}
  .day{min-height:0}
  .state-links{margin-left:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:10px 12px}
  .kpi-v{font-size:1.3rem}
}
/* Fiche individuelle (visible uniquement à l'impression) */
#print-area{display:none}
.sheet{font-size:9.5pt;color:#1b1f2a;break-after:page}
.sheet:last-child{break-after:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12pt;border-bottom:2pt solid #61a7ab;padding-bottom:6pt;margin-bottom:8pt}
.sheet-kicker{font-size:8.5pt;color:#5f6878;text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.sheet-head h1{font-size:19pt;margin:2pt 0 1pt;line-height:1.15}
.sheet-scope{font-size:10pt;color:#3a4150}
.sheet-date{text-align:right;font-size:8.5pt;color:#5f6878;white-space:nowrap}
.sheet-date b{display:block;font-size:10.5pt;color:#1b1f2a}
.sheet-stats{display:flex;flex-wrap:wrap;gap:6pt;margin:0 0 8pt}
.sheet-stats span{border:1px solid #d5d9e0;border-radius:6pt;padding:3pt 8pt;font-size:9pt}
.sheet-stats b{font-size:12pt;margin-right:3pt}
.sheet table{font-size:9pt;border:1px solid #c9ced8}
.sheet th,.sheet td{padding:2.5pt 6pt;border-bottom:1px solid #e2e5ea}
.sheet tr.week-row th{color:#61a7ab;background:#e2f0f0}
.sheet tr.rest td{color:#8a92a3}
.sheet tr.leave td{color:#3a4150;font-style:italic;background:#f6f3e8}
.sheet-note{font-weight:400;color:#5f6878}
.sheet-rule{font-size:8.5pt;color:#3a4150;margin:0 0 8pt}
/* Étiquette d'activité sur la fiche imprimée : une couleur par activité (mêmes rangs que .sw.c0 à .c3). */
.sheet .act{display:inline-block;font-size:7pt;font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.5;padding:0 4pt;border-radius:3pt;border:1px solid;margin-right:4pt;vertical-align:1px}
.sheet .act.c0{color:#2f6f73;background:#e2f0f0;border-color:#9cc9cb}
.sheet .act.c1{color:#5c5847;background:#f2edda;border-color:#cfc6a7}
.sheet .act.c2{color:#5a3f86;background:#efe9f7;border-color:#c7b6e0}
.sheet .act.c3{color:#8a3a1f;background:#fbebe4;border-color:#e6b29f}
.shift-time{width:5.2em;font-variant-numeric:tabular-nums}
.shift-act{min-width:8em}
.sheet tr.week-total td{font-weight:700;background:#faf7ec;border-top:1px solid #c9ced8}
.sheet-sign{display:grid;grid-template-columns:1fr 1fr;gap:10pt;margin-top:12pt;break-inside:avoid}
.sign-box{border:1px solid #a9b0bc;border-radius:6pt;padding:6pt 8pt;display:flex;flex-direction:column;gap:4pt;font-size:9pt}
.sign-box b{font-size:9.5pt}
.sign-space{display:block;height:46pt}
.sign-date{font-size:8.5pt;color:#3a4150}
.sheet-foot{margin-top:8pt;padding-top:4pt;border-top:1px solid #d5d9e0;font-size:8pt;color:#5f6878;display:flex;justify-content:space-between}

@media print{

  /* Le planning s'imprime en paysage ; la fiche individuelle passe en portrait (voir pageStyle). */

  @page{size:A4 landscape;margin:0}
  body:not(.print-zone) #app{padding:7mm;-webkit-box-decoration-break:clone;box-decoration-break:clone}

  .kpis{grid-template-columns:repeat(4,1fr);gap:5pt;margin-bottom:6pt}

  /* Calendrier tenant sur une page : une ligne par créneau, en petits caractères */
  .kpis,.legend,.head-section .help,.day .tag,.day .lock{display:none!important}
  .cal{gap:2pt;grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal.with-tot{grid-template-columns:repeat(7,minmax(0,1fr)) repeat(var(--wcols),3.4rem)}
  .week-tot{padding:2pt;border-radius:3pt}

  body.print-zone #app{display:none!important}

}

<body>
<!-- #app : conteneur de l'application. Son contenu est entièrement reconstruit par render() à chaque changement d'état. -->
<div id="app"><div class="home"><p>Chargement…</p></div></div>
<!-- #print-area : invisible à l'écran. Reçoit les fiches individuelles le temps d'une impression, puis est vidée. -->
<div id="print-area" aria-hidden="true"></div>
<noscript><p style="padding:16px">Cette page nécessite JavaScript.</p></noscript>

<script>
// SCRIPT 1 / 2 : Core, la logique métier.
/*CORE-DEBUT*/
/* Logique métier indépendante de l'interface : dates, saisons, créneaux, données, répartition, enregistrement. */
// =====================================================================================
// MODULE Core
// =====================================================================================
// Fonction auto-exécutée : tout ce qu'elle déclare est privé, sauf l'objet retourné en fin de module.
// Core n'accède ni au document, ni aux fichiers, ni au stockage du navigateur. Il n'utilise que
// Date, JSON, Math, Promise et setTimeout. Les accès aux fichiers lui sont fournis par l'interface
// sous la forme d'un objet io = { read(), write(texte) } : voir Store.
// Conséquence : toute règle métier se lit et se teste ici, hors navigateur.
//
// Sommaire : dates . heures . saisons . données . créneaux du mois . semaines et repos . journal .
//            opérations . enregistrement (Store) . répartition (propose) . analyse (analyze).
const Core = (function(){
  'use strict';
  const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const SHORT_MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  const SHORT_DAYS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  // Jours de la semaine dans l'ordre du calendrier : 1 = lundi … 7 = dimanche.
  const WEEK_NAMES = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
  const WEEK_LETTERS = ['L','M','M','J','V','S','D'];
  const FORMAT = 'planning-elevage';
  // Activités : texte libre saisi pour chaque créneau (par exemple « Élevage », « Magasin »). Deux créneaux
  // de même activité (sans tenir compte des majuscules) sont additionnés ensemble : voir activitiesOf().

  // ----- Dates -----
  // Convention : une date est une chaîne 'AAAA-MM-JJ', un mois une chaîne 'AAAA-MM'. Calculs en UTC
  // pour qu'un changement d'heure ne décale jamais un jour. Deux dates se comparent comme des chaînes.
  // parseISO : 'AAAA-MM-JJ' → Date à minuit UTC.
  function parseISO(s){ const p=String(s).split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])); }
  // toISO : Date (minuit UTC) → 'AAAA-MM-JJ'.
  function toISO(d){ return d.toISOString().slice(0,10); }
  // addDays : date décalée de n jours (n négatif : vers le passé).
  function addDays(s,n){ const d=parseISO(s); d.setUTCDate(d.getUTCDate()+n); return toISO(d); }
  // isValidIso : bon format ET jour réel (refuse 2027-02-30).
  function isValidIso(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s)) && !isNaN(parseISO(s)) && toISO(parseISO(s))===s; }
  // isValidMonth : vrai pour un mois 'AAAA-MM' valide (01 à 12).
  function isValidMonth(m){ return /^\d{4}-(0[1-9]|1[0-2])$/.test(String(m)); }
  // clone : copie profonde par JSON (les données ne contiennent que des objets simples).
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  // round2 : arrondi à 2 décimales, pour comparer des heures sans erreur d'arrondi flottant.
  function round2(n){ return Math.round(n*100)/100; }
  // dayNum : numéro du jour à la française (1 → « 1er »).
  function dayNum(d){ return d===1 ? '1er' : String(d); }
  // longDate : '2027-01-04' → « 4 janvier 2027 ».
  function longDate(s){ const d=parseISO(s); return dayNum(d.getUTCDate())+' '+MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear(); }
  // frDate : '2027-01-04' → « 04/01/2027 ».
  function frDate(s){ const p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  // weekday : 1 = lundi … 7 = dimanche.
  function weekday(s){ const g=parseISO(s).getUTCDay(); return g===0?7:g; }
  // dayLabel : '2027-01-04' → « lun. 4 janv. ».
  function dayLabel(s){ const d=parseISO(s); return SHORT_DAYS[d.getUTCDay()]+' '+dayNum(d.getUTCDate())+' '+SHORT_MONTHS[d.getUTCMonth()]; }
  // monthLabel : '2027-01' → « janvier 2027 ».
  function monthLabel(m){ return MONTHS[Number(m.slice(5,7))-1]+' '+m.slice(0,4); }
  // addMonths : mois décalé de n mois ('2027-01', 1 → '2027-02').
  function addMonths(m,n){ const d=new Date(Date.UTC(Number(m.slice(0,4)),Number(m.slice(5,7))-1+n,1)); return toISO(d).slice(0,7); }
  // monthDays : toutes les dates du mois, dans l'ordre.
  function monthDays(m){ const r=[]; let d=m+'-01'; while(d.slice(0,7)===m){ r.push(d); d=addDays(d,1); } return r; }
  // today : date du jour selon l'horloge LOCALE du poste. Les jours antérieurs sont « passés » :
  // une génération ne les modifie jamais.
  function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  // frNumber : nombre arrondi à 2 décimales, virgule décimale (1.5 → « 1,5 »).
  function frNumber(n){ return (Math.round(n*100)/100).toString().replace('.',','); }

  // ----- Heures -----
  // Une heure de créneau est une chaîne 'HH:MM' (00:00 à 23:59). Un créneau ne passe pas minuit.
  // parseTime : 'HH:MM' → minutes depuis minuit ; NaN si l'heure est invalide.
  function parseTime(t){ const m=/^([01]\d|2[0-3]):([0-5]\d)$/.exec(String(t)); return m?Number(m[1])*60+Number(m[2]):NaN; }
  // isValidTime : vrai pour une heure 'HH:MM' valide.
  function isValidTime(t){ return !isNaN(parseTime(t)); }
  // timeLabel : '09:00' → « 9h », '14:30' → « 14h30 ».
  function timeLabel(t){ const n=parseTime(t); if(isNaN(n)) return '?'; const h=Math.floor(n/60), mi=n%60; return h+'h'+(mi?String(mi).padStart(2,'0'):''); }
  // rangeLabel : horaire {debut, fin} → « 9h–13h ».
  function rangeLabel(t){ return timeLabel(t.from)+'–'+timeLabel(t.to); }
  // shiftLabel : désignation d'un créneau (il n'a pas de nom) : activité et horaires d'hiver, « Élevage 9h–13h » ;
  // sans horaires d'hiver, ceux d'été (« Élevage 18h–20h (été) ») ; sans aucun horaire, l'activité seule.
  function shiftLabel(p){
    function ok(t){ return t&&isValidTime(t.from)&&isValidTime(t.to); }
    return (p.activity||'Créneau')+' '+(ok(p.winter)?rangeLabel(p.winter):ok(p.summer)?rangeLabel(p.summer)+' (été)':'');
  }
  // spanHours : durée d'un horaire {debut, fin} en heures ; 0 s'il est invalide ou inversé.
  function spanHours(t){ const a=parseTime(t&&t.from), b=parseTime(t&&t.to); return isNaN(a)||isNaN(b)||b<=a?0:(b-a)/60; }
  // hoursText : 7.5 → « 7 h 30 », 35 → « 35 h », -2.25 → « −2 h 15 ».
  function hoursText(h){
    const m=Math.round(Math.abs(h)*60), hh=Math.floor(m/60), mm=m%60;
    return (h<0&&m?'−':'')+hh+' h'+(mm?' '+String(mm).padStart(2,'0'):'');
  }
  // signedHours : écart avec son signe : 2 → « +2 h », −2 → « −2 h », 0 → « 0 h ».
  function signedHours(h){ return (Math.round(h*60)>0?'+':'')+hoursText(h); }

  // ----- Saisons -----
  // Deux jeux d'horaires par créneau : hiver et été. Le passage de l'un à l'autre se fait :
  //   mode 'heure' .. au changement d'heure : été du dernier dimanche de mars (inclus) au dernier
  //                   dimanche d'octobre (exclu) ;
  //   mode 'dates' .. à deux dates fixes de l'année (debutEte et debutHiver, au format 'MM-JJ').
  // lastSunday(y, month) : dernier dimanche du mois (month de 1 à 12) de l'année y.
  function lastSunday(y,month){ let d=toISO(new Date(Date.UTC(y,month,0))); while(weekday(d)!==7) d=addDays(d,-1); return d; }
  // isSummer(R, date) : la date relève-t-elle des horaires d'été, selon les réglages R ?
  // En mode 'dates', la période d'été peut chevaucher le 1er janvier (début de l'été après celui de l'hiver).
  function isSummer(R,date){
    const y=Number(date.slice(0,4));
    if(R.seasonMode==='dates'){
      const md=date.slice(5), a=R.summerStart, b=R.winterStart;
      return a<=b ? (md>=a&&md<b) : (md>=a||md<b);
    }
    return date>=lastSunday(y,3) && date<lastSunday(y,10);
  }
  // seasonOf : 'summer' ou 'winter' ; nom de la clé d'horaires à utiliser dans un créneau.
  function seasonOf(R,date){ return isSummer(R,date)?'summer':'winter'; }

  // ----- Données -----
  // Vocabulaire : dans le code, « shift » = « créneau » à l'écran, et « manager » = « gérant » à l'écran.
  // Les clés du fichier de données sont en anglais, comme le code (version 2 du format). Un fichier de la
  // version 1, aux clés en français, est converti à la lecture par fromLegacy().
  // defaultSettings : réglages d'un fichier neuf, et valeurs de repli quand un réglage lu est invalide.
  //   title ........ titre de la page
  //   seasonMode ... 'clock' ou 'dates'    summerStart, winterStart .. 'MM-JJ', utilisés en mode 'dates'
  //   rules ........ règles de répartition [{id, on}], dans l'ordre de priorité choisi (voir RULES)
  //   holidays ..... JOURS FÉRIÉS saisis à la main [{date 'AAAA-MM-JJ', name}] : affichés au planning ; un congé posé
  //                  ce jour-là n'est pas décompté (voir weekRules). Ils ne changent rien d'autre au calcul.
  // MAX_DAY_HOURS : DURÉE MAXIMALE D'UNE JOURNÉE de travail d'un salarié (somme de ses créneaux du jour), 10 h.
  // C'est une constante, pas un réglage : la génération ne la dépasse jamais ; un dépassement fait à la main est
  // signalé en rouge et demande confirmation à l'enregistrement. Le gérant n'est pas concerné.
  // (Une version précédente l'avait dans Réglages, clé maxDayHours : elle n'est plus lue.)
  const MAX_DAY_HOURS=10;
  function defaultSettings(){
    return {title:'Planning', seasonMode:'clock', summerStart:'04-01', winterStart:'10-01', rules:defaultRules(), holidays:[]};
  }
  // ----- Règles de répartition -----
  // RULES : règles de la répartition automatique que le gérant coche et classe (Réglages > Règles de répartition).
  // Elles passent APRÈS les règles absolues (créneaux autorisés, chevauchements, congés, gérant jamais seul, jours
  // de repos par semaine) et les créneaux indispensables, et AVANT les heures à faire du mois.
  // L'ordre choisi fixe la priorité : la 1re règle pèse 10 000 000 000 par manquement, la 2e 1 000 000 000, et ainsi
  // de suite (ruleWeights) ; une règle décochée ne pèse rien. Unité d'un manquement :
  //   sundaysOff .... dimanche de repos manquant (nombre réglé pour chaque salarié dans Équipe)
  //   restPair ...... salarié sans 2 jours de repos d'affilée dans le mois
  //   sundaySpread .. paire de dimanches de repos consécutifs (dans le mois)
  // Pour ajouter une règle : une entrée ici, son calcul dans cost() (propose), son alerte dans analyze().
  const RULES=[
    {id:'sundaysOff', label:'Dimanches de repos par mois', help:'Le nombre réglé pour chaque salarié dans l’onglet « Équipe » (2 par défaut).'},
    {id:'restPair', label:'2 jours de repos d’affilée, au moins une fois par mois', help:'Si possible : deux jours de suite sans aucun créneau (un jour de congé compte comme un repos).'},
    {id:'sundaySpread', label:'Dimanches de repos espacés', help:'Éviter deux dimanches de repos de suite dans le mois.'}
  ];
  // defaultRules : toutes les règles, cochées, dans l'ordre de RULES.
  function defaultRules(){ return RULES.map(function(r){ return {id:r.id,on:true}; }); }
  // normalizeRules(v) : liste reçue (fichier ou écran) → règles connues, sans doublon, dans l'ordre reçu ;
  // une règle absente (nouvelle version de l'outil) est ajoutée à la fin, cochée.
  function normalizeRules(v){
    const known={}, res=[];
    RULES.forEach(function(r){ known[r.id]=1; });
    (Array.isArray(v)?v:[]).forEach(function(x){ if(x&&known[x.id]&&!res.some(function(y){return y.id===x.id;})) res.push({id:x.id,on:x.on!==false}); });
    RULES.forEach(function(r){ if(!res.some(function(y){return y.id===r.id;})) res.push({id:r.id,on:true}); });
    return res;
  }
  // ruleWeights(R) : poids de chaque règle dans la note (cost) : 10^(10 − rang) si elle est cochée, 0 sinon.
  // Le dernier rang possible (10^5 pour une 6e règle) reste au-dessus d'une heure d'écart aux heures à faire (10^4).
  function ruleWeights(R){ const w={}; normalizeRules(R&&R.rules).forEach(function(r,i){ w[r.id]=r.on?Math.pow(10,10-i):0; }); return w; }
  // ruleLabel : libellé d'une règle (journal, écran).
  function ruleLabel(id){ for(let i=0;i<RULES.length;i++) if(RULES[i].id===id) return RULES[i].label; return id; }
  // newData : structure vide du fichier planning-elevage-donnees.json. FICHIER NEUF VIERGE : ni créneau, ni
  // personne. Le gérant saisit ses créneaux (Réglages) puis son équipe (Équipe) ; aucun nom n'est écrit dans le code.
  //   shifts ...... créneaux, sans nom [{id, activity, days, winter {from, to}|null, summer {from, to}|null, min, max,
  //                 managerNeverAlone, showEmpty, neverEmpty {summer, winter}}]
  //                 activity : texte libre ;
  //                 days : jours 1..7 où le créneau existe ;
  //                 winter, summer : horaires FACULTATIFS de chaque saison ; null = pas de créneau cette saison-là ;
  //                 min : personnes indispensables (sinon : besoin non couvert) ;
  //                 max : personnes au plus ; au-delà du minimum, une place sert à compléter les heures ;
  //                 managerNeverAlone : le gérant ne compte pas dans le minimum : il ne peut pas y être seul ;
  //                 showEmpty : afficher le créneau dans le planning même un jour où personne n'y est ;
  //                 neverEmpty : { saison : vrai } le créneau ne reste jamais vide cette saison-là (gérant en congé :
  //                              un autre salarié le tient en priorité ; sinon alerte)
  //   employees ... personnes [{id, name, email, monthlyHours, manager, restDaysPerWeek, sundaysOffPerMonth, shifts, shiftDays, leaveDays, blockedSlots}]
  //                 email : adresse e-mail (facultative), destinataire proposé pour l'envoi du planning ;
  //                 monthlyHours : heures mensuelles du contrat ; manager : gérant, sans objectif d'heures ni repos imposé ;
  //                 restDaysPerWeek : jours sans aucun créneau par semaine, au minimum (sans objet pour le gérant) ;
  //                 sundaysOffPerMonth : dimanches de repos par mois ; shifts : identifiants des créneaux autorisés ;
  //                 shiftDays : { créneau : [jours 1..7] } jours où la personne peut tenir ce créneau ;
  //                             créneau absent = tous les jours du créneau ;
  //                 GÉRANT : shifts et shiftDays sont ses JOURS DE PRÉSENCE FIXES (seule source de vérité) : il y est
  //                 placé d'office (sauf congé), et la génération ne le place jamais ailleurs ;
  //                 leaveDays : dates de congé ['AAAA-MM-JJ'] : la personne n'est jamais placée ces jours-là ;
  //                 blockedSlots : CRÉNEAUX INDISPONIBLES hors congés ['AAAA-MM-JJ|créneau'] (rendez-vous médical…) :
  //                             la personne n'est jamais placée sur ces créneaux-là, mais rien n'est décompté (ni congés,
  //                             ni heures à faire). Les autres créneaux du jour restent possibles ;
  //                 leaveStart : { 'AAAA' : jours } solde de congés au 1er juin de l'année AAAA, saisi à la main
  //   removedIds .. identifiants des personnes retirées de l'équipe : un identifiant retiré n'est jamais réutilisé
  //   schedules ... { 'AAAA-MM' : {assignments {'date|créneau' : [id, ...]}, locks [dates], savedAt, validated} }
  //                 validated : null, ou {at, balance {id : écart en heures}} quand le mois est validé (cadenas)
  //   log ......... toujours vide dans le fichier ; tampon en mémoire avant écriture du .log
  function newData(){
    return {format:FORMAT, version:2, settings:defaultSettings(), shifts:[], employees:[], removedIds:[],
            schedules:{}, log:[], updatedAt:null};
  }
  // fromLegacy(d) : fichier de la version 1 (clés en français) → mêmes données sous les clés de la version 2.
  // Ne fait que renommer : normalize() contrôle ensuite chaque valeur. Un fichier de la version 2 est rendu tel quel.
  // Reprend aussi deux formes plus anciennes : « patron » (gérant), « heures » (heures par semaine).
  function fromLegacy(d){
    if(!('reglages' in d||'plages' in d||'salaries' in d||'plannings' in d)) return d;
    const r=d.reglages||{}, ACT={elevage:'Élevage', boutique:'Magasin'};
    function obj(x){ return x&&typeof x==='object'&&!Array.isArray(x); }
    function time(t){ return obj(t)?{from:t.debut,to:t.fin}:t; }
    const plannings=obj(d.plannings)?d.plannings:{}, schedules={};
    Object.keys(plannings).forEach(function(m){ const x=plannings[m]; schedules[m]=obj(x)?{assignments:x.affectations,locks:x.verrous,savedAt:x.enregistreLe}:x; });
    return {format:d.format, version:2,
      settings:{title:r.titre, seasonMode:r.saison==='dates'?'dates':'clock', summerStart:r.debutEte, winterStart:r.debutHiver},

  // normalizeLeaveStart(v) : soldes de congés au 1er juin { 'AAAA' : jours }, de 0 à 100 jours par demi-journée.

  // hasPlanning : vrai si un planning est enregistré pour le mois m et contient au moins une affectation.
  function hasPlanning(data,m){ const p=data.schedules[m]; return !!p && Object.keys(p.assignments).some(function(k){return p.assignments[k].some(Boolean);}); }

  // ----- Semaines du mois : repère d’heures et repos -----

  function weeksOfMonth(m){

  // weekLabel : semaine → « Semaine du lun. 4 janv. au dim. 10 janv. ».

  // weekRules(data, m) : pour chaque semaine du mois et chaque personne :

  //              du mois. Il sert à étaler les heures sur le mois ; l'objectif à atteindre est mensuel.
  //   leave .... heures de congé comptées dans la semaine : jours de congé × leaveDayHours, au plus autant de
  //              jours que la personne peut travailler dans la semaine (jours du mois − repos). Le repère est
  //              diminué d'autant : les heures de congé sont DÉDUITES des heures à faire du mois.

  //   rest ..... repos minimum − jours de repos déjà prévus l'autre mois cette semaine (sinon : prorata des jours) ;
  //   target ... repère d'heures de la semaine entière (heures mensuelles × 12 ÷ 52) − heures déjà prévues l'autre
  //              mois cette semaine − congés (sinon : prorata des jours du mois) ;
