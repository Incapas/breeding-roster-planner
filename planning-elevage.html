// moveRule : déplace la règle n°from au rang to (copie de travail ; enregistrée avec « Enregistrer les réglages »).
function moveRule(from,to){
  const d=getRulesDraft(); if(from<0||from>=d.length) return;
  const it=d.splice(from,1)[0]; d.splice(Math.max(0,Math.min(d.length,to)),0,it); render();
}

// toTime : horaire saisi au clavier → 'HH:MM' (« 9 », « 9h », « 9h30 », « 9:30 », « 09.30 » acceptés).
// Une saisie non reconnue est gardée telle quelle : l'enregistrement la refusera avec un message.
function toTime(v){
  const t=String(v).trim(), m=/^(\d{1,2})\s*(?:[h:.]\s*(\d{2})?)?$/i.exec(t);
  if(!m) return t;
  const h=Number(m[1]), mi=m[2]?Number(m[2]):0;
  return h<=23&&mi<=59?String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0'):t;
}

/* --- Génération --- */
// runProposal : lance Core.propose (génération complète) pour le mois affiché et place le résultat dans
// S.preview. RIEN N'EST ÉCRIT dans le fichier à ce stade. Calcul différé de 30 ms pour afficher « Calcul en cours… ».
// Durée : 150 essais ou 2 secondes au plus (environ 1,5 s pour un mois).
// Jours GARDÉS (cadenas, changés à la main) : leurs personnes restent, mais leurs places vides peuvent être complétées
// (fillLocked) : une disponibilité ajoutée dans Équipe sert donc aussi ces jours-là. unlockAll : « Tout recalculer » :
// les jours gardés sont libérés et recalculés comme les autres (les jours passés, eux, ne changent jamais).
function runProposal(mode,unlockAll){
  if(S.computing||C.isValidated(S.data,S.month)) return;
  const m=S.month, saved=savedAsg(), todayIso=C.today();
  const base=previewHere()?S.preview.assignments:saved;
  let locks={};
  if(previewHere()) locks=S.preview.locks; else planningOf(m).locks.forEach(function(d){locks[d]=true;});
  if(unlockAll) locks={};
  S.computing=mode; render();
  setTimeout(function(){
    try{
      const kept=Object.keys(locks).filter(function(d){return locks[d]&&d.slice(0,7)===m&&d>=todayIso;}), past=C.monthDays(m).filter(function(d){return d<todayIso;}).length;
      const o={month:m,base:base,locks:Object.keys(locks).filter(function(d){return locks[d];}),fillLocked:true,durationMs:2000,maxAttempts:150,today:todayIso};
      const r=C.propose(S.data,o);
      S.preview={month:m,assignments:r.assignments,locks:locks,mode:mode};
      S.proposalInfo='Planning calculé.'+(kept.length?' '+plural(kept.length,'jour gardé')+' à la main (cadenas) : '+(kept.length>1?'leurs personnes n’ont pas changé, leurs places vides ont pu être complétées.':'ses personnes n’ont pas changé, ses places vides ont pu être complétées.'):'')+
        (past?' '+plural(past,'jour passé')+' non modifié'+(past>1?'s':'')+'.':'');
      S.tab='schedule';
    }catch(e){ showError('Le calcul a échoué',e); }
    S.computing=false; render();
  },30);
}

/* --- Actions --- */
// actions : table des clics (clé = data-action). Seules ces actions modifient le fichier, toujours par
// execute() : add, save-team, remove, save-all-settings, save-schedule, clear-schedule, leave-day, block-slot,
// validate-month, unlock-month.
const actions={
  // tab : change d'onglet.
  'tab':function(b){ S.tab=b.dataset.id; render(); window.scrollTo(0,0); },
  // open, reconnect, change-file : choix et accès au dossier (voir plus haut).
  'open':openFolder,
  'reconnect':reconnect,
  'change-file':changeFolder,
  // retry-save : nouvel essai d'écriture après un échec ; les données en mémoire sont écrites en entier.
  'retry-save':function(){ status('Enregistrement…','info'); S.store.flush().then(saved,saveFailed); },
  // goto-preview : revient au mois du brouillon ouvert.
  'goto-preview':function(){ S.month=S.preview.month; render(); },
  // add : ajoute les personnes saisies dans « Ajouter des personnes » (noms déjà présents ignorés).
  'add':function(){
    const ta=document.getElementById('add-names'), names=C.splitNames(ta.value);
    if(!names.length){ ta.focus(); return; }
    const existing={}; S.data.employees.forEach(function(s){existing[C.nameKey(s.name)]=1;});
    const added=names.filter(function(n){return !existing[C.nameKey(n)];}), duplicates=names.length-added.length;
    ta.value=''; ta.defaultValue='';
    if(duplicates) alert(plural(duplicates,'nom')+' déjà présent'+(duplicates>1?'s':'')+' : ignoré'+(duplicates>1?'s':'')+'.');
    if(added.length) execute({type:'addEmployees',employees:added.map(function(n){return {id:uid(),name:n};})});
  },
  // save-team : bouton unique de l'onglet Équipe. CONTRÔLE DES SAISIES de toutes les fiches ; si une
  // seule est invalide, rien n'est enregistré. Puis une opération par fiche réellement modifiée.
  'save-team':function(){
    const ops=[], errors=[], seen={};
    S.data.employees.forEach(function(s){
      const id=s.id, label=s.name;
      const name=document.getElementById('name-'+id).value.trim().replace(/\s+/g,' ');
      if(!name){ errors.push(label+' : le nom ne peut pas être vide'); return; }
      if(seen[C.nameKey(name)]){ errors.push(name+' : ce nom est utilisé deux fois'); return; }
      seen[C.nameKey(name)]=1;
      const boss=document.getElementById('boss-'+id).checked;
      // Champs absents pour le gérant : quand on décoche « Gérant », 151 h, 2 jours de repos et 2 dimanches sont proposés.
      const elHours=document.getElementById('hours-'+id), elRest=document.getElementById('rest-'+id), elSun=document.getElementById('sun-'+id);
      const hours=elHours?Number(String(elHours.value).trim()):151;
      const rest=elRest?Number(elRest.value):2;
      const sundays=elSun?Number(elSun.value):(boss?0:2);
      if(!boss&&!(Number.isInteger(hours)&&hours>=0&&hours<=300)){ errors.push(name+' : les heures par mois doivent être un nombre entier entre 0 et 300'); return; }
      if(!boss&&!(Number.isInteger(rest)&&rest>=0&&rest<=6)){ errors.push(name+' : les jours de repos par semaine doivent être un nombre entier entre 0 et 6'); return; }
      if(!boss&&!(Number.isInteger(sundays)&&sundays>=0&&sundays<=5)){ errors.push(name+' : les dimanches de repos doivent être un nombre entier entre 0 et 5'); return; }
      const shifts=S.data.shifts.filter(function(p){ const el=document.getElementById('shift-'+id+'-'+p.id); return el&&el.checked; }).map(function(p){return p.id;});
      // Jours par créneau : enregistrés seulement s'ils ne couvrent pas tous les jours du créneau.
      const days={}, noDay=[];
      shifts.forEach(function(pid){
        const p=C.findShift(S.data,pid), on=p.days.filter(function(j){ const el=document.getElementById('shiftday-'+id+'-'+pid+'-'+j); return el&&el.checked; });
        if(!on.length) noDay.push(C.shiftLabel(p)); else if(on.length<p.days.length) days[pid]=on;
      });
      if(noDay.length){ errors.push(name+' : aucun jour coché pour '+noDay.join(', ')+' (cochez un jour ou décochez le créneau)'); return; }
      // Gérant placé d'office sur un créneau où il ne peut pas être seul : il faut une place pour la personne qui l'accompagne.
      if(boss){ const bad=shifts.map(function(pid){return C.findShift(S.data,pid);}).filter(function(p){ return p.managerNeverAlone&&p.max<2; });
        if(bad.length){ errors.push(name+' : présent d’office sur '+bad.map(function(p){return C.shiftLabel(p).trim();}).join(', ')+', où le gérant ne peut pas être seul : passez « Au plus » à 2 au moins dans Réglages'); return; } }
      // Adresse e-mail : vide, ou une adresse valide.
      const emailEl=document.getElementById('email-'+id), email=emailEl?emailEl.value.trim():(s.email||'');
      if(email&&!C.normalizeEmail(email)){ errors.push(name+' : l’adresse e-mail « '+email+' » n’est pas valide'); return; }
      const op={type:'updateEmployee',employee:id,name:name,email:email,hours:boss?0:hours,boss:boss,rest:boss?0:rest,sundays:boss?0:sundays,shifts:shifts,days:days};
      // Solde de congés au 1er juin (vide : non saisi), de 0 à 100 jours, par demi-journée.
      const elLeave=document.getElementById('leave0-'+id);
      if(elLeave&&!boss){
        const raw=String(elLeave.value).trim().replace(',','.'), v=raw===''?null:Number(raw);
        if(v!=null&&!(isFinite(v)&&v>=0&&v<=100&&Math.round(v*2)===v*2)){ errors.push(name+' : le solde de congés doit être un nombre de jours entre 0 et 100 (demi-journées acceptées)'); return; }
        op.leaveYear=C.leavePeriod(S.month).key; op.leaveInitial=v;
      }
      // Fiche inchangée : pas d'opération.
      const test=C.clone(S.data); C.applyOp(test,op);
      if(JSON.stringify(C.findEmployee(test,id))!==JSON.stringify(s)) ops.push(op);
    });
    if(errors.length){ alert('Rien n’a été enregistré :\n- '+errors.join('\n- ')); return; }
    if(!ops.length){ status('Aucune modification à enregistrer.','info'); notify('Rien à enregistrer : tout est déjà à jour'); return; }
    document.querySelectorAll('[data-keep]').forEach(function(el){ el.defaultValue=el.value; el.defaultChecked=el.checked; });
    afterSave(ops.map(function(op){ return execute(op); }),ops.length>1?'Modifications enregistrées ('+ops.length+' fiches)':'Modifications enregistrées');
  },
  // ot-history : ouvre ou ferme l'historique des heures sup. sur la fiche (affichage seulement, rien n'est enregistré).
  'ot-history':function(b){ const id=b.dataset.id; if(S.otHistory[id]) delete S.otHistory[id]; else S.otHistory[id]=true; render(); },
  // remove : retire une personne de l'équipe et de tous les plannings, après confirmation.
  'remove':function(b){
    const id=b.dataset.id;
    if(!confirm('Retirer '+nameOf(id)+' de l’équipe ?\nCette personne disparaîtra aussi de tous les plannings enregistrés.')) return;
    if(S.preview) Object.keys(S.preview.assignments).forEach(function(k){ S.preview.assignments[k]=S.preview.assignments[k].filter(function(x){return x!==id;}); });
    execute({type:'remove',employee:id});
  },
  // save-all-settings : bouton unique de l'onglet Réglages. CONTRÔLE de la partie Général et des créneaux ;
  // si une erreur est trouvée, rien n'est enregistré. Puis une opération par partie modifiée.
  'save-all-settings':function(){
    // toMd : « JJ/MM » saisi → 'MM-JJ' ; vide si la date n'existe pas.
    function toMd(v){ const m=/^\s*(\d{1,2})\s*[\/.-]\s*(\d{1,2})\s*$/.exec(v); if(!m) return ''; const r=m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); return C.isValidMonthDay(r)?r:''; }
    const errors=[];
    const v={
      title:document.getElementById('setting-title').value.trim()||'Planning',
      seasonMode:document.getElementById('setting-season').value==='dates'?'dates':'clock',
      summerStart:toMd(document.getElementById('setting-summer').value),
      winterStart:toMd(document.getElementById('setting-winter').value)
    };
    if(!v.summerStart||!v.winterStart) errors.push('les dates de début de l’été et de l’hiver doivent être au format JJ/MM (par exemple 01/04)');
    else if(v.summerStart===v.winterStart) errors.push('le début de l’été et le début de l’hiver doivent être différents');
    const dirty=draftDirty(), d=getDraft();
    if(dirty) d.forEach(function(p){
      // Horaires FACULTATIFS : début et fin vides = pas de créneau cette saison-là (null). Remplis : ils doivent être valides.
      ['winter','summer'].forEach(function(sn){ const t=p[sn]; if(t&&!String(t.from||'').trim()&&!String(t.to||'').trim()) p[sn]=null; });
      const n=C.shiftLabel(p).trim();
      if(!String(p.activity).trim()) errors.push('un créneau n’a pas d’activité (par exemple Élevage, Magasin)');
      if(!p.days.length) errors.push(n+' : aucun jour coché');
      ['winter','summer'].forEach(function(sn){ if(p[sn]&&!C.spanHours(p[sn])) errors.push(n+' : horaires '+(sn==='summer'?'d’été':'d’hiver')+' invalides (début et fin au format HH:MM, la fin après le début, le même jour ; ou les deux vides)'); });
      if(!(p.min>=0&&p.min<=5&&p.max>=1&&p.max<=5&&p.max>=p.min)) errors.push(n+' : « au plus » doit être entre 1 et 5 et au moins égal à « au moins »');
      else if(p.managerNeverAlone&&p.max<2&&S.data.employees.some(function(s){ return s.manager&&s.shifts.indexOf(p.id)>=0; })) errors.push(n+' : le gérant y est présent d’office (onglet Équipe) mais ne peut pas y être seul : « au plus » doit valoir au moins 2, pour la personne qui l’accompagne');
    });
    // Sans nom, deux créneaux de même activité et mêmes horaires d'hiver ne se distingueraient plus.
    // Jours fériés : une ligne sans date ni nom est ignorée ; sinon la date doit être valide, et une seule fois.
    const hol=getHolDraft().filter(function(x){ return String(x.date||'').trim()||String(x.name||'').trim(); }), holSeen={};
    hol.forEach(function(x,i){
      if(!C.isValidIso(x.date)) errors.push('jour férié'+(x.name?' « '+x.name+' »':' n°'+(i+1))+' : date manquante ou invalide');
      else if(holSeen[x.date]) errors.push('jour férié du '+C.frDate(x.date)+' saisi deux fois');
      holSeen[x.date]=1;
    });
    if(dirty){ const seenLabel={}; d.forEach(function(p){ const k=C.nameKey(C.shiftLabel(p)); if(String(p.activity).trim()&&seenLabel[k]) errors.push(C.shiftLabel(p).trim()+' : deux créneaux ont la même activité et les mêmes horaires d’hiver'); seenLabel[k]=1; }); }
    if(errors.length){ alert('Rien n’a été enregistré :\n- '+errors.join('\n- ')); return; }
    v.rules=C.clone(getRulesDraft());
    v.holidays=C.normalizeHolidays(hol);
    const R=S.data.settings, changed=Object.keys(v).some(function(k){ return JSON.stringify(R[k])!==JSON.stringify(v[k]); });
    if(!changed&&!dirty){ status('Aucune modification à enregistrer.','info'); notify('Rien à enregistrer : tout est déjà à jour'); return; }
    document.querySelectorAll('[data-keep]').forEach(function(el){ if(el.id.indexOf('setting-')===0){ el.defaultValue=el.value; } });
    const w=[];
    if(changed){ S.rulesDraft=null; S.holDraft=null; w.push(execute({type:'settings',values:v})); }
    if(dirty){ const list=C.clone(d).map(function(p){ delete p.name; p.activity=String(p.activity).trim(); return p; }); S.draft=null; w.push(execute({type:'shifts',shifts:list})); }
    afterSave(w,'Réglages enregistrés');
  },
  // shift-add : nouveau créneau dans la copie de travail (enregistré avec « Enregistrer les réglages »),
  // ouvert tous les jours de la semaine par défaut.
  // Réglages par défaut d'un nouveau créneau : affiché même vide (il est indispensable : au moins 1), jamais vide décoché.
  'shift-add':function(){ getDraft().push({id:uid('p'),activity:'',days:[1,2,3,4,5,6,7],winter:null,summer:null,min:1,max:1,managerNeverAlone:false,showEmpty:true,neverEmpty:{summer:false,winter:false}}); render(); },
  // shift-del : supprime un créneau de la copie de travail, après confirmation.

  // leave-mode : entre dans le mode « Congés » (bloque les autres fonctions). La première personne est choisie.
  'leave-mode':function(){ if(S.preview||!S.data.employees.length||C.isValidated(S.data,S.month)) return; S.leaveMode={employee:S.data.employees[0].id,changed:false,kind:'leave'}; render(); },
  // block-mode : même mode, pour les CRÉNEAUX INDISPONIBLES hors congés (rendez-vous médical…) : la génération ne place

  'block-mode':function(){ if(S.preview||!S.data.employees.length||C.isValidated(S.data,S.month)) return; S.leaveMode={employee:S.data.employees[0].id,changed:false,kind:'block'}; render(); },
  // leave-day : pose ou retire un congé de la personne choisie ce jour-là ; enregistré aussitôt.
  'leave-day':function(b){

    if(C.isValidated(S.data,d.slice(0,7))){ status('Mois validé : ses congés et indisponibilités ne peuvent plus être modifiés.','error'); return; }

  // leave-done : quitte le mode « Congés » (ou « Indisponible »). Aucune solution n'est proposée : il suffit de

  'leave-done':function(){
    const changed=S.leaveMode&&S.leaveMode.changed, blk=S.leaveMode&&S.leaveMode.kind==='block'; S.leaveMode=null; render();
    if(!changed) return;
    const what=blk?'Indisponibilités enregistrées':'Congés enregistrés';
    status(C.hasPlanning(S.data,S.month)?what+(blk?'. La personne est retirée de ces créneaux dans le planning : choisissez qui la remplace avec « Modifier » (le reste du planning ne change pas).':'. Les heures à faire sont mises à jour, et la personne est retirée de ses créneaux ces jours-là ; le reste du planning ne change pas.'):what+'.','ok');
  },
  // validate-month : VALIDATION DU MOIS (cadenas). Arrête les heures et ajoute l'écart de chacun à ses heures sup.
  'validate-month':function(){
    const m=S.month; if(previewHere()||!C.hasPlanning(S.data,m)) return;
    const an=C.analyze(S.data,m,savedAsg(),{today:C.today()});
    const lines=an.stats.filter(function(st){return !st.boss;}).map(function(st){ const g=C.round2(st.planned-st.base); return '- '+st.name+' : '+H(st.planned)+' prévues pour '+H(st.base)+' (contrat moins congés) → écart '+C.signedHours(g)+(g<-0.01?' (heures dues)':g>0.01?' (heures à rendre)':''); });
    const conf=Object.keys(C.leaveConflicts(S.data,m,savedAsg(),'')).length;
    if(!confirm((conf?'ATTENTION : '+plural(conf,'jour')+' où une personne en congé est placée au planning ; ces heures seraient comptées comme travaillées.\n\n':'')+'Valider '+C.monthLabel(m)+' ?\n\nLe mois est verrouillé : son planning et ses congés ne peuvent plus être modifiés. L’écart de chacun s’ajoute à ses heures sup. :\n'+(lines.join('\n')||'- aucun salarié')+'\n\nLes heures à faire des mois suivants ne changent pas. Le cadenas permet de déverrouiller le mois.')) return;
    execute({type:'validateMonth',month:m,val:true});
  },
  // unlock-month : déverrouille un mois validé ; son écart sort des heures sup. tant qu'il n'est pas validé de nouveau.
  'unlock-month':function(){
    const m=S.month;
    if(!confirm('Déverrouiller '+C.monthLabel(m)+' ?\n\nSon planning et ses congés redeviennent modifiables. Son écart d’heures sort des heures sup. tant que le mois n’est pas validé de nouveau.')) return;
    execute({type:'validateMonth',month:m,val:false});
  },
  // propose-full : « Générer le planning » / « Re-générer le planning ».
  'propose-full':function(){ runProposal('complete'); },
  // propose-unlock : « Tout recalculer » : les jours gardés à la main sont libérés et recalculés eux aussi.
  'propose-unlock':function(){ if(confirm('Recalculer aussi les jours gardés à la main ?\nLes changements faits à la main sur ces jours seront remplacés. Le résultat reste un brouillon, à vérifier avant d’enregistrer.')) runProposal('complete',true); },
  // edit : ouvre un brouillon à partir du planning enregistré, pour le modifier à la main.
  'edit':function(){
    if(C.isValidated(S.data,S.month)) return;
    const v={}; planningOf(S.month).locks.forEach(function(d){v[d]=true;});
    S.preview={month:S.month,assignments:C.clone(savedAsg()),locks:v,mode:'manual'}; S.proposalInfo=''; render();
  },
  // discard : abandonne le brouillon après confirmation ; le planning enregistré ne change pas.
  'discard':function(){ if(confirm('Annuler les changements ? Le brouillon sera perdu, le planning enregistré reste tel quel.')){ S.preview=null; render(); } },
  // save-schedule : publie l'aperçu. Demande confirmation s'il enfreint une règle absolue.
  'save-schedule':function(){
    const m=S.preview.month, asg={}, a=S.preview.assignments;
    C.monthSlots(S.data,m).forEach(function(sl){ const x=(a[sl.key]||[]).filter(Boolean); if(x.length) asg[sl.key]=x; });
    if(C.isValidated(S.data,m)){ alert('Ce mois est validé : déverrouillez-le (cadenas) avant d’enregistrer un nouveau planning.'); return; }
    if(!confirmSevere(C.analyze(S.data,m,asg,{today:C.today()}))) return;
    const locks=Object.keys(S.preview.locks).filter(function(d){return S.preview.locks[d]&&d.slice(0,7)===m;});
    S.preview=null;
    afterSave([execute({type:'schedule',month:m,assignments:asg,locks:locks})],'Planning de '+C.monthLabel(m)+' enregistré');
  },
  // clear-schedule : efface le planning du mois, après confirmation (le contenu part dans le journal).
  'clear-schedule':function(){ if(confirm('Effacer tout le planning de '+C.monthLabel(S.month)+' ?')) execute({type:'clearSchedule',month:S.month}); },
  // print, sheet : impression du calendrier, ou de la fiche d'une personne.
  'print':function(){ printPage(); },
  // mail : envoi par Gmail du planning global (data-id = global) ou du planning individuel affiché (filter).
  'mail':function(b){ startMail(b.dataset.id==='filter'&&!!S.filter&&!!S.filter.employee); },
  'mail-again':function(){ if(!S.mail) return; try{ downloadFile(S.mail.file,planningPdf(S.mail.title),'application/pdf'); }catch(e){ showError('Le PDF n’a pas pu être fabriqué',e); } },
  'mail-close':function(){ S.mail=null; render(); },
  // person-plan : ouvre le planning individuel, préfiltré sur la personne et sur son activité (si elle n'en a qu'une).
  'person-plan':function(b){
    const s=C.findEmployee(S.data,b.dataset.id); if(!s) return;
    const acts={}; s.shifts.forEach(function(id){ const p=C.findShift(S.data,id); if(p) acts[C.nameKey(p.activity)]=1; });
    const keys=Object.keys(acts);
    S.filter={employee:s.id,activity:keys.length===1?keys[0]:'*'}; S.mail=null; render(); window.scrollTo(0,0);
  },
  // filter-close : revient au planning de toute l'équipe.
  'filter-close':function(){ S.filter=null; S.mail=null; render(); },
  'sheet':function(b){ const s=C.findEmployee(S.data,b.dataset.id); if(s) printSheet(s); },
  // unlock : libère un jour gardé ; une nouvelle génération pourra le changer.
  'unlock':function(b){ if(S.preview){ S.preview.locks[b.dataset.id]=false; render(); } },
  // month-nav : mois précédent ou suivant.
  'month-nav':function(b){ setMonth(C.addMonths(S.month,Number(b.dataset.id))); },
  // backup : télécharge une copie complète des données (fichier JSON, dossier Téléchargements du poste).
  'backup':function(){ const n=new Date(), t=n.toISOString().slice(0,10)+'_'+String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0'); downloadFile('sauvegarde-planning-elevage_'+t+'.json',C.serialize(S.data),'application/json'); }
};
// changes : table des événements « change » (clé = data-change). Aucune n'écrit dans le fichier :
// admin, month et sheet changent l'affichage ; assign et lock modifient l'aperçu ; shift modifie la copie
// de travail des créneaux.
const changes={
  // admin : interrupteur « Administration ». Sans mot de passe : il affiche ou masque les onglets Équipe et
  // Réglages, il n'ouvre aucun droit.
  'admin':function(el){ S.admin=el.checked; render(); },
  // month : mois choisi dans le sélecteur de mois.
  'month':function(el){ setMonth(el.value); },
  // leave-person : personne dont on saisit les congés.
  // holiday : date ou nom d'un jour férié (copie de travail). Écran reconstruit pour une date (jour de la semaine affiché).
  'holiday':function(el){
    const x=getHolDraft()[Number(el.dataset.i)]; if(!x) return;
    const was=holDirty(); x[el.dataset.f]=el.dataset.f==='name'?el.value.trim():el.value;
    if(el.dataset.f==='date'||was!==holDirty()) render();
  },
  // rule-on : coche ou décoche une règle de répartition (copie de travail).
  'rule-on':function(el){ const r=getRulesDraft().filter(function(x){return x.id===el.dataset.id;})[0]; if(r){ r.on=el.checked; render(); } },
  // filter-person, filter-activity : filtres du planning individuel.
  'filter-person':function(el){ if(S.filter){ S.filter.employee=C.findEmployee(S.data,el.value)?el.value:''; S.mail=null; render(); } },
  'filter-activity':function(el){ if(S.filter){ S.filter.activity=el.value; S.mail=null; render(); } },
  'leave-person':function(el){ if(S.leaveMode&&C.findEmployee(S.data,el.value)){ S.leaveMode.employee=el.value; render(); } },
  // assign : la liste n°pos d'un créneau. Les personnes du créneau sont gardées dans l'ordre affiché.
  'assign':function(el){
    const key=el.dataset.slot, pos=Number(el.dataset.pos), a=(S.preview.assignments[key]||[]).filter(Boolean);
    if(el.value&&a.indexOf(el.value)>=0&&a.indexOf(el.value)!==pos){ alert('Cette personne est déjà sur ce créneau.'); render(); return; }
    if(pos<a.length){ if(el.value) a[pos]=el.value; else a.splice(pos,1); } else if(el.value) a.push(el.value);
    S.preview.assignments[key]=a; S.preview.locks[key.split('|')[0]]=true; render();
  },
  // shift : modification d'un champ de la copie de travail. Les champs de texte, d'heure et de nombre ne
  // reconstruisent pas l'écran (la frappe en cours serait perdue) ; les cases et listes, si.
  'shift':function(el){
    const p=getDraft()[Number(el.dataset.i)], f=el.dataset.f; if(!p) return;
    const wasDirty=draftDirty();
    if(f==='activity') p.activity=el.value;
    else if(f==='min'||f==='max') p[f]=parseInt(el.value,10);
    else if(f==='alone') p.managerNeverAlone=el.checked;
    else if(f==='showempty') p.showEmpty=el.checked;
    else if(f==='ne-summer'||f==='ne-winter') (p.neverEmpty=p.neverEmpty||{summer:false,winter:false})[f.slice(3)]=el.checked;
    else if(/^day[1-7]$/.test(f)){ const j=Number(f.slice(3)); p.days=p.days.filter(function(x){return x!==j;}); if(el.checked) p.days.push(j); p.days.sort(); }
    // Horaire facultatif : créé à la première saisie, retiré (null) quand début et fin sont vidés.
    else{ const parts=f.split('-'), sn=parts[0]; if(sn==='winter'||sn==='summer'){
      el.value=toTime(el.value);
      const t=p[sn]||{from:'',to:''}; t[parts[1]]=el.value; p[sn]=!String(t.from).trim()&&!String(t.to).trim()?null:t;
      const x=C.spanHours(p[sn]), dur=document.getElementById('shift-'+el.dataset.i+'-'+sn+'-dur'); if(dur) dur.textContent=x?H(x):p[sn]?'?':'aucun'; } }
    if(el.type==='checkbox'||el.tagName==='SELECT'||wasDirty!==draftDirty()) render();
  }
};
// Délégation d'événements : un seul écouteur par type pour toute la page. Une action inconnue ou un
// bouton désactivé est ignoré.
document.addEventListener('click',function(e){
  const b=e.target.closest('[data-action]'); if(!b||b.disabled) return;
  const f=actions[b.dataset.action]; if(f){ e.preventDefault(); f(b,e); }
});
// Clavier : une case de jour cliquable (mode « Congés ») se valide aussi avec Entrée ou Espace.
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  const b=e.target.closest&&e.target.closest('[role="button"][data-action]'); if(!b) return;
  const f=actions[b.dataset.action]; if(f){ e.preventDefault(); f(b,e); }
});
document.addEventListener('change',function(e){
  const el=e.target.closest('[data-change]'); if(!el) return;
  const f=changes[el.dataset.change]; if(f) f(el,e);
});
// Avertit avant de quitter la page si un brouillon ou des créneaux ne sont pas enregistrés, ou si une
// modification n'est pas encore écrite dans le fichier. Le texte du message est celui du navigateur.
// Glisser-déposer des règles de répartition (Réglages) : la règle saisie est déposée avant ou après la règle
// survolée, selon la moitié de la ligne. Les flèches de chaque ligne font la même chose au clavier.
let dragRule=null;
function dropMarks(){ document.querySelectorAll('.rule.drop-before,.rule.drop-after').forEach(function(x){ x.classList.remove('drop-before','drop-after'); }); }
document.addEventListener('dragstart',function(e){
  const li=e.target.closest&&e.target.closest('.rule[draggable]'); if(!li) return;
  dragRule=Number(li.dataset.i); li.classList.add('dragging');
  e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',li.dataset.rule); }catch(_){}
});
document.addEventListener('dragover',function(e){
  const li=e.target.closest&&e.target.closest('.rule'); if(dragRule==null||!li) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move'; dropMarks();
  const r=li.getBoundingClientRect(); li.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');
});
document.addEventListener('drop',function(e){
  const li=e.target.closest&&e.target.closest('.rule'); if(dragRule==null||!li) return;
  e.preventDefault();
  const r=li.getBoundingClientRect(), i=Number(li.dataset.i), from=dragRule;
  let to=i+(e.clientY<r.top+r.height/2?0:1); if(to>from) to--;
  dragRule=null; dropMarks(); if(to!==from) moveRule(from,to); else render();
});
document.addEventListener('dragend',function(){ dragRule=null; dropMarks(); document.querySelectorAll('.rule.dragging').forEach(function(x){ x.classList.remove('dragging'); }); });
window.addEventListener('beforeunload',function(e){
  const busy=S.store&&S.store.busy();
  if(S.preview||draftDirty()||rulesDirty()||holDirty()||busy){ e.preventDefault(); e.returnValue=''; }
});

// Point de départ.
boot();
})();
</script>
</body>
