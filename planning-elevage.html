  function bg(id){ return [hueOf(id),55,91]; } function fg(id){ return [hueOf(id),55,30]; }
  // Contenu de chaque jour (mêmes règles d'affichage que le calendrier, voir slotView).
  const byDate={}; summary.slots.forEach(function(sl){ (byDate[sl.date]=byDate[sl.date]||[]).push(sl); });
  function dayItems(d){
    const past=d<todayIso, slots=filterSlots(byDate[d]||[],asg,filter), it={slots:[],leaves:[],over:[],note:''};
    slots.forEach(function(sl){ const v=slotView(sl,asg,summary,past,false); if(!v) return;
      it.slots.push({label:sl.label,ids:v.ids,missing:v.missing&&!past?v.missing:0,why:v.why?cap1(v.why.short):''}); });
    summary.stats.forEach(function(st){ const x=st.days[d]; if(emp&&st.id!==emp) return; if(!st.boss&&x&&x.hours>C.MAX_DAY_HOURS+1e-9) it.over.push(firstName(st.person)+' '+H(x.hours)); });
    // Congés (journée) et créneaux indisponibles : une étiquette par personne.
    S.data.employees.forEach(function(s){ if(emp&&s.id!==emp) return;
      if(C.onLeave(s,d)){ it.leaves.push({s:s,txt:'Congé · '+firstName(s)}); return; }
      const b=(byDate[d]||[]).filter(function(sl){ return C.isBlocked(s,d,sl.shift); }).map(function(sl){ return sl.label; });
      if(b.length) it.leaves.push({s:s,txt:'Indispo · '+firstName(s)+' : '+b.join(', ')}); });
    const hol=C.holidayOf(S.data,d); it.holiday=hol?'Férié'+(hol.name?' · '+hol.name:''):'';
    if(!slots.length&&!it.leaves.length) it.note=!emp?'Aucun créneau':'Repos';
    return it;
  }
  // En-tête : titre, personne et activité, saison ; date d'édition à droite ; trait de la couleur d'accent.
  D.text(M,M+8,S.data.settings.title,8,true,MUTED);
  D.text(M,M+26,'Planning · '+cap1(C.monthLabel(m)),17,true,TXT);
  D.text(M,M+38,(es?es.name:'Toute l’équipe')+(act?' · '+act.label:'')+' · '+seasonNote(m),9,false,MUTED);
  const ed='Édité le '+nowDate(), sv=planningOf(m).savedAt?'Planning enregistré le '+dateTimeStr(planningOf(m).savedAt):'';
  D.text(PW-M-pdfTextW(ed,8,false),M+8,ed,8,false,MUTED);
  if(sv) D.text(PW-M-pdfTextW(sv,8,false),M+20,sv,8,false,MUTED);
  D.rect(M,M+44,PW-2*M,1.4,0,ACCENT);
  // Grille : 7 jours + une colonne d'heures de la semaine (si au moins un salarié compté).
  const TW=counted.length?82:0, top=M+54, head=11, foot=16;
  const cw=(PW-2*M-(TW?TW+G:0)-6*G)/7, weeks=summary.weeks, rows=weeks.length;
  const rh=(PH-M-foot-top-head-(rows-1)*G)/rows;
  // drawCell : dessine (ou mesure seulement, si draw est faux) une case ; rend la hauteur occupée.
  function drawCell(draw,x,y,w,d,it,fs){
    const pad=3, inner=w-2*pad, lh=fs*1.5, ph=fs*1.32; let cy=y+pad;
    if(draw) D.text(x+pad,cy+fs+1.2,String(C.parseISO(d).getUTCDate()),fs+1.5,true,TXT);
    cy+=(fs+1.5)*1.3;
    if(it.holiday){ if(draw){ D.rect(x+pad,cy,inner,ph,1.4,'#e2f0f0',ACCENT,0.4,true); D.text(x+pad+2,cy+fs*1.0,pdfFit(it.holiday,inner-4,fs,true),fs,true,'#3f8589'); } cy+=ph+1.5; }
    it.slots.forEach(function(sl){
      // Jetons du créneau : libellé, puis une étiquette par personne (ou « personne » en rouge), à la ligne si besoin.
      const toks=[{t:sl.label,w:pdfTextW(sl.label,fs,false)+2,kind:'label'}];
      sl.ids.forEach(function(id){ const s=C.findEmployee(S.data,id), t=firstName(s); toks.push({t:t,w:pdfTextW(t,fs,true)+3.2,kind:'who',id:id}); });
      if(!sl.ids.length) toks.push({t:sl.missing||sl.why?'personne':'—',w:pdfTextW('personne',fs,true)+2,kind:sl.missing||sl.why?'none':'dash'});
      else if(sl.missing) toks.push({t:'+'+sl.missing+' à trouver',w:pdfTextW('+'+sl.missing+' à trouver',fs,true)+2,kind:'none'});
      const x0=x+pad+3, xmax=x+w-pad; let cx=x0, line=0; const pos=[];
      toks.forEach(function(k){ const kw=Math.min(k.w,xmax-x0); if(cx>x0&&cx+kw>xmax){ line++; cx=x0; } pos.push({k:k,x:cx,line:line,w:kw}); cx+=kw+1.5; });
      const bh=(line+1)*lh+(sl.why?lh*0.95:0)+1;
      if(draw){
        D.rect(x+pad,cy,inner,bh,1.5,sl.why?DANGER_SOFT:SLOT);
        D.rect(x+pad,cy,1.4,bh,0,sl.missing||sl.why?DANGER:BORDER);
        pos.forEach(function(p){
          const by=cy+p.line*lh+(lh-ph)/2;
          if(p.k.kind==='who'){ D.rect(p.x,by,p.w,ph,1.4,bg(p.k.id)); D.text(p.x+1.6,by+fs*1.0,pdfFit(p.k.t,p.w-3.2,fs,true),fs,true,fg(p.k.id)); }
          else D.text(p.x,by+fs*1.0,pdfFit(p.k.t,p.w,fs,p.k.kind!=='label'),fs,p.k.kind!=='label',p.k.kind==='label'?MUTED:p.k.kind==='none'?DANGER:FAINT);
        });
        if(sl.why) D.text(x0,cy+(line+1)*lh+fs*0.95,pdfFit('! '+sl.why,xmax-x0,fs*0.9,true),fs*0.9,true,DANGER);
      }
      cy+=bh+1.5;
    });
    it.over.forEach(function(t){ if(draw) D.text(x+pad,cy+fs,pdfFit('! '+t,inner,fs*0.9,true),fs*0.9,true,DANGER); cy+=lh; });
    it.leaves.forEach(function(l){ if(draw){ D.rect(x+pad,cy,inner,ph,1.4,[hueOf(l.s.id),50,88]); D.text(x+pad+2,cy+fs*1.0,pdfFit(l.txt,inner-4,fs,true),fs,true,fg(l.s.id)); } cy+=ph+1.5; });
    if(it.note){ if(draw) D.text(x+pad,cy+fs,it.note,fs,false,FAINT); cy+=lh; }
    return cy-y+pad;
  }
  // drawTot : heures de la semaine de chaque salarié compté (une ligne chacun).
  function drawTot(draw,x,y,w,wi,fs){
    const pad=3, lh=fs*1.7, ph=fs*1.32; let cy=y+pad;
    counted.forEach(function(st){
      if(draw){
        const hrs=H(weekHoursOf(summary,st,wi,filter)), hw=pdfTextW(hrs,fs,true), nw=Math.min(pdfTextW(firstName(st.person),fs,true)+3.2,w-2*pad-hw-3);
        D.rect(x+pad,cy,nw,ph,1.4,bg(st.id)); D.text(x+pad+1.6,cy+fs*1.0,pdfFit(firstName(st.person),nw-3.2,fs,true),fs,true,fg(st.id));
        D.text(x+w-pad-hw,cy+fs*1.0,hrs,fs,true,TXT);
        const lv=st.weeks[wi].leave; if(lv){ const t='congé −'+H(lv); D.text(x+w-pad-pdfTextW(t,fs*0.8,false),cy+fs*1.0+fs*0.95,t,fs*0.8,false,MUTED); }
      }
      cy+=lh+(st.weeks[wi].leave?fs*0.9:0);
    });
    return cy-y+pad;
  }
  // Taille du texte : la plus grande (de 9 à 4,5 points) pour laquelle chaque case tient dans sa ligne.
  const items={}; weeks.forEach(function(w){ w.days.forEach(function(d){ items[d]=dayItems(d); }); });
  let fs=4.5;
  [9,8.5,8,7.5,7,6.5,6,5.5,5,4.5].some(function(f){
    const ok=weeks.every(function(w,wi){ return w.days.every(function(d){ return drawCell(false,0,0,cw,d,items[d],f)<=rh; })&&(!TW||drawTot(false,0,0,TW,wi,f)<=rh); });
    if(ok) fs=f; return ok;
  });
  // Noms des jours, puis les semaines.
  C.WEEK_NAMES.forEach(function(nm,i){ D.text(M+i*(cw+G)+3,top+7,nm.toUpperCase(),6.2,true,MUTED); });
  if(TW) D.text(M+7*(cw+G)+3,top+7,'HEURES DE LA SEMAINE',6.2,true,MUTED);
  weeks.forEach(function(w,wi){
    const y=top+head+wi*(rh+G);
    for(let i=0;i<7;i++){
      const d=C.addDays(w.monday,i), x=M+i*(cw+G);
      if(d.slice(0,7)!==m){ D.rect(x,y,cw,rh,3,null,BORDER,0.5,true); continue; }
      D.rect(x,y,cw,rh,3,'#ffffff',ACCENT,0.7);
      D.clip(x,y,cw,rh); drawCell(true,x,y,cw,d,items[d],fs); D.unclip();
    }
    if(TW){ const x=M+7*(cw+G); D.rect(x,y,TW,rh,3,'#faf7ec',BORDER,0.6); D.clip(x,y,TW,rh); drawTot(true,x,y,TW,wi,fs); D.unclip(); }
  });
  // Pied de page : heures du mois de chaque salarié compté.
  const line=counted.map(function(st){ return st.name+' '+(act?H(st.hoursBy[act.key]||0):H(st.planned)+' / '+H(st.target)); }).join(' · ');
  if(line) D.text(M,PH-M+4,pdfFit('Heures du mois : '+line,PW-2*M,7.5,false),7.5,false,MUTED);
  return D.bytes(title);
}
// personSheet : fiche du mois d'une personne (jours, activité et créneaux, heures, totaux par semaine). Noms échappés.
// Chaque créneau porte son activité (par exemple Élevage, Magasin), sur une étiquette de couleur.
// Les heures de congé ne s'ajoutent pas aux heures travaillées : elles sont déduites des heures à faire.
// sheetDay : jour de la fiche d'heures, avec la mention « férié » (Réglages > Jours fériés).
function sheetDay(d){ const h=C.holidayOf(S.data,d); return C.dayLabel(d)+(h?' · férié'+(h.name?' ('+h.name+')':''):''); }
function personSheet(s){
  const summary=C.analyze(S.data,S.month,savedAsg(),{today:C.today()}), st=summary.stats.filter(function(x){return x.id===s.id;})[0];
  const ldh=C.leaveDayHours(s);
  // slotText : « [ÉLEVAGE] 9h–13h » : l'activité sur son étiquette de couleur, puis les horaires du jour.
  function slotText(sl){
    if(!sl.activityKey) return esc(sl.label);
    return '<span class="act c'+(sl.activityIndex%4)+'">'+esc(sl.activity)+'</span>'+esc(C.rangeLabel(sl));
  }
  let rows='';
  summary.weeks.forEach(function(w,wi){
    const wk=st.weeks[wi];
    rows+='<tr class="week-row"><th colspan="3">'+esc(C.weekLabel(w))+'</th></tr>';
    // Jours de congé de la semaine : les premiers sont déduits (leaveDayHours chacun), dans la limite retenue
    // par le calcul ; au-delà, le jour de congé tombe sur un jour de repos et n'est pas déduit.
    const counted=(w.per[s.id]&&w.per[s.id].leaveDates)||[];
    w.days.forEach(function(d){
      const x=st.days[d];
      if(!x&&C.onLeave(s,d)){
        // Congé décompté (Core.weekRules), ou non : dimanche, jour férié, ou au-delà des jours travaillables de la semaine.
        const hrs=counted.indexOf(d)>=0?ldh:0, why=C.weekday(d)===7?'dimanche':C.holidayOf(S.data,d)?'jour férié':'';
        const note=st.boss?'':hrs?' <span class="sheet-note">('+esc(H(hrs))+' déduites des heures à faire)</span>':why?' <span class="sheet-note">('+why+' : non décompté)</span>':' <span class="sheet-note">(sur un jour de repos : non déduit)</span>';
        rows+='<tr class="leave"><td>'+esc(sheetDay(d))+'</td><td>Congé'+note+'</td><td class="num">—</td></tr>'; return;
      }
      // Créneaux indisponibles hors congés (rendez-vous médical…), un jour sans travail : rien n'est déduit.
      const bl=C.blockedOn(s,d).map(function(id){ const p=C.findShift(S.data,id); return p?C.shiftLabel(p).trim():''; }).filter(Boolean);
      if(!x&&bl.length){ rows+='<tr class="rest"><td>'+esc(sheetDay(d))+'</td><td>Indisponible : '+esc(bl.join(', '))+' <span class="sheet-note">(hors congés : non décompté)</span></td><td class="num">—</td></tr>'; return; }
      if(!x){ rows+='<tr class="rest"><td>'+esc(sheetDay(d))+'</td><td>Repos</td><td class="num">—</td></tr>'; return; }
      const over=!st.boss&&x.hours>C.MAX_DAY_HOURS+1e-9;
      rows+='<tr><td>'+esc(sheetDay(d))+'</td><td>'+x.items.slice().sort(function(a,b){return a.start-b.start;}).map(slotText).join(' · ')+'</td><td class="num"'+(over?' style="color:#b42318;font-weight:700" title="Dépassement d’horaires"':'')+'>'+(st.boss?'présent':esc(H(x.hours))+(over?' ⚠':''))+'</td></tr>';
    });
    // Total de la semaine, sur une ligne à part : heures travaillées pour un salarié, jours de présence pour le gérant.
    const present=w.days.filter(function(d){return !!st.days[d];}).length;
    rows+='<tr class="week-total"><td colspan="2">Total de la semaine'+(!st.boss&&wk.leave?' <span class="sheet-note">(congé : '+esc(H(wk.leave))+' déduites des heures à faire)</span>':'')+'</td><td class="num">'+(st.boss?esc(plural(present,'jour')):esc(H(wk.planned)))+'</td></tr>';
  });
  const at=nowDate(), gap=hoursStatus(st.goal-st.planned), bal=st.boss?null:C.leaveBalance(S.data,s,S.month);
  const stats=st.boss?'<span>Total : <b>'+plural(st.daysWorked,'jour')+'</b> de présence</span>':
    '<span>Heures prévues : <b>'+esc(H(st.planned))+'</b></span>'+
    '<span>Heures à faire : <b>'+esc(H(st.target))+'</b> ('+esc(targetDetail(st))+')</span>'+
    '<span>'+esc(gap.txt)+'</span>'+
    summary.activities.map(function(a){ return '<span><span class="act c'+(a.index%4)+'">'+esc(a.label)+'</span><b>'+esc(H(st.hoursBy[a.key]||0))+'</b></span>'; }).join('')+
    (bal&&bal.initial!=null?'<span>Congés '+esc(bal.period.label)+' : <b>'+esc(daysText(bal.remaining))+'</b> restant'+(Math.abs(bal.remaining)>1?'s':'')+' sur '+esc(daysText(bal.initial))+'</span>':'');
  const rule=!st.boss&&st.leaveDays.length?'<p class="sheet-rule">Congés : '+esc(leaveText(st))+'. '+esc(leaveRule(st))+'</p>':'';
  return '<section class="sheet"><header class="sheet-head"><div><div class="sheet-kicker">'+esc(S.data.settings.title)+'</div><h1>'+esc(s.name)+'</h1><div class="sheet-scope">Fiche d’heures de '+esc(C.monthLabel(S.month))+(C.isValidated(S.data,S.month)?' · mois validé':'')+'</div></div>'+
    '<div class="sheet-date">Édité le<b>'+esc(at)+'</b></div></header>'+
    '<div class="sheet-stats">'+stats+'</div>'+rule+
    '<table><thead><tr><th>Jour</th><th>Activité et créneaux</th><th class="num">'+(st.boss?'Présence':'Heures')+'</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="sheet-sign"><div class="sign-box"><b>Signature de l’employeur</b><span class="sign-space"></span><span class="sign-date">Date de signature : ____ / ____ / ________</span></div>'+
      '<div class="sign-box"><b>Signature de l’employé(e)</b><span class="sign-space"></span><span class="sign-date">Date de signature : ____ / ____ / ________</span></div></div>'+
    '<footer class="sheet-foot"><span>'+esc(s.name)+' · '+esc(C.monthLabel(S.month))+'</span><span>Planning enregistré'+(planningOf(S.month).savedAt?' le '+esc(dateTimeStr(planningOf(S.month).savedAt)):' : aucun')+'</span></footer></section>';
}

// render : reconstruit tout l'écran depuis l'état S. Préserve ce qui est en cours de frappe
// (champs marqués data-keep, cases comprises), le champ actif et la position de défilement.
function render(){
  const guard={}, active=document.activeElement, focus=active&&active.id, sx=window.scrollX, sy=window.scrollY;
  document.querySelectorAll('[data-keep]').forEach(function(el){
    if(el.type==='checkbox'){ if(el.checked!==el.defaultChecked) guard[el.id]={c:el.checked}; }
    else if(el.value!==el.defaultValue) guard[el.id]={v:el.value};
  });
  app.innerHTML=view();
  Object.keys(guard).forEach(function(id){ const el=document.getElementById(id); if(!el) return; if('c' in guard[id]) el.checked=guard[id].c; else el.value=guard[id].v; });
  if(focus){ const f=document.getElementById(focus); if(f&&f.focus&&f.tagName!=='BUTTON') f.focus({preventScroll:true}); }
  if(window.scrollX!==sx||window.scrollY!==sy) window.scrollTo(sx,sy);
  if(S.data) document.title=S.data.settings.title;
}
// view : aiguillage. Écrans de connexion, ou barre de titre + ligne d'état + onglets + onglet courant.
// Un onglet réservé à l'administration est remplacé par le planning si l'interrupteur est coupé.
function view(){
  if(S.mode==='booting') return '<div class="home"><p class="help" style="text-align:center">Chargement…</p></div>';
  if(S.mode==='incompatible') return incompatibleView();
  if(S.mode==='home') return homeView();
  if(S.mode==='reconnect') return reconnectView();
  if(!S.admin && TABS.some(function(o){return o.id===S.tab&&o.adminOnly;})) S.tab='schedule';
  const R=S.data.settings;
  let h='<header class="bar"><div class="bar-inner">'+
    '<div class="brand"><span class="logo">'+ico('barn')+'</span><div style="min-width:0"><h1>'+esc(R.title)+'</h1></div></div>'+
    '<div class="bar-right no-print">'+
      '<label class="switch" title="Affiche les onglets Équipe et Réglages"><input type="checkbox" data-change="admin"'+(S.admin?' checked':'')+(S.leaveMode?' disabled':'')+'><span class="track"></span><span>Administration</span></label>'+
    '</div></div></header>';
  h+='<div class="container">';
  h+='<div class="state no-print"><span class="state-file" title="Dossier où le planning est enregistré">'+ico('folder')+'<b>'+esc(S.folderName)+'</b></span>'+
    '<span id="status" class="status status-'+S.status.type+'" title="'+esc(S.status.txt)+'">'+esc(S.status.txt)+'</span>'+
    '<span class="state-links">'+(S.store&&S.store.dirty&&!S.store.writing?'<button class="link" data-action="retry-save">'+ico('refresh')+'Réessayer d’enregistrer</button>':'')+'<button class="link" data-action="change-file">'+ico('folder')+'Changer de dossier</button></span></div>';
  h+='<nav class="tabs no-print" aria-label="Sections"><div class="tabs-inner">';
  let sepDone=false;
  TABS.forEach(function(o){
    if(o.adminOnly&&!S.admin) return;
    if(o.adminOnly&&!sepDone){ h+='<span class="sep" aria-hidden="true"></span>'; sepDone=true; }
    h+='<button data-action="tab" data-id="'+o.id+'"'+(S.tab===o.id?' aria-current="page"':'')+(S.leaveMode&&S.tab!==o.id?' disabled title="Terminez d’abord la saisie en cours (congés ou indisponibilités)"':'')+'>'+ico(o.ico)+'<span>'+esc(o.name)+'</span>'+(o.id==='schedule'&&S.preview?'<span class="tag tag-warn">brouillon</span>':'')+(o.id==='settings'&&(draftDirty()||rulesDirty()||holDirty())?'<span class="tag tag-warn">non enregistré</span>':'')+'</button>';
  });
  h+='</div></nav>';
  h+='<div class="print-only print-meta"><span>'+esc(cap1(C.monthLabel(S.month)))+'</span><span>Édité le <span class="date-print">'+esc(nowDate())+'</span></span></div>';
  h+='<main>';
  switch(S.tab){
    case 'employees': h+=employeesView(); break;
    case 'settings': h+=settingsView(); break;
    default: h+=scheduleView();
  }
  h+='</main></div>';
  return h;
}

    '<div class="card" style="max-width:560px;margin:0 auto"><p class="tip" style="margin:0 0 16px">'+ico('info')+'<span>Dans la fenêtre de Chrome, choisissez <b>« Autoriser à chaque visite »</b> : cet écran ne s’affichera plus.</span></p>'+
    '<div class="actions" style="justify-content:center;margin:0">'+button('reconnect','shield','Autoriser l’accès au dossier','pri')+button('open','folder','Choisir un autre dossier…','sec')+'</div>'+
    (S.status.type==='error'?'<p class="status status-error" style="justify-content:center;margin-top:12px">'+esc(S.status.txt)+'</p>':'')+'</div></div>';

// incompatibleView : navigateur sans accès aux dossiers (il faut Google Chrome ou Microsoft Edge).

// ---------- Onglet Planning : calendrier du mois ----------
// scheduleView : le mois affiché. De haut en bas : titre et actions, heures de chaque personne,
// calendrier, points à vérifier. Le planning enregistré est affiché, ou le brouillon en cours (S.preview).
// Les listes de modification n'apparaissent qu'avec un brouillon ouvert. L'interrupteur « Administration » ne joue pas ici.
function scheduleView(){
  const m=S.month, draft=previewHere(), editing=draft, asg=shownAsg(), todayIso=C.today();
  const summary=C.analyze(S.data,m,asg,{today:todayIso}), saved=savedAsg(), savedExists=C.hasPlanning(S.data,m), validated=C.isValidated(S.data,m);
  const exists=Object.keys(asg).some(function(k){return (asg[k]||[]).some(Boolean);});
  const modified={};
  if(draft){
    const dk={}, sk={};
    summary.slots.forEach(function(sl){ dk[sl.date]=(dk[sl.date]||'')+sl.key+':'+(asg[sl.key]||[]).filter(Boolean).slice().sort().join()+';'; sk[sl.date]=(sk[sl.date]||'')+sl.key+':'+(saved[sl.key]||[]).filter(Boolean).slice().sort().join()+';'; });
    // Après « Tout recalculer », presque tout change : l'étiquette n'aide alors pas, elle n'est pas affichée.
    if(S.preview.mode!=='complete') Object.keys(dk).forEach(function(d){ if(savedExists&&dk[d]!==sk[d]) modified[d]=true; });
  }
  const pl=planningOf(m);
  const state=draft?'<span class="tag tag-warn">Brouillon</span> pas encore enregistré':pl.savedAt?'Enregistré le '+esc(dateTimeStr(pl.savedAt)):'Pas encore de planning pour ce mois';
  const lockTag=validated?' · <span class="tag tag-accent">'+ico('lock')+'Mois validé'+(pl.validated.at?' le '+esc(dateTimeStr(pl.validated.at)):'')+'</span>':'';
  let h='<div class="month-head"><div><h2 class="month-title">'+esc(cap1(C.monthLabel(m)))+'</h2><p class="help">'+state+lockTag+' · '+esc(seasonNote(m))+'</p></div>'+
    '<div class="tools no-print">'+lockButton(draft,savedExists,validated)+monthNav()+'</div></div>';
  if(S.preview&&!draft) h+='<div class="banner caution">'+ico('info')+'<div>Le brouillon de <b>'+esc(C.monthLabel(S.preview.month))+'</b> n’est pas enregistré. <button class="link" data-action="goto-preview">Y retourner</button></div></div>';
  if(!S.data.employees.length) return h+empty('users','Personne dans l’équipe','Cochez « Administration », puis ajoutez les personnes dans l’onglet « Équipe ».');
  if(!summary.slots.length) return h+empty('cal','Aucun créneau ce mois-ci','Aucun créneau n’a d’horaires pour la saison de ce mois. Cochez « Administration », puis vérifiez les créneaux de travail dans l’onglet « Réglages ».');
  // Planning individuel : vue à imprimer, filtrée par salarié et par activité, à la place du reste de l'onglet.
  if(S.filter&&!S.leaveMode) return h+filterView(m,todayIso);
  // L'interrupteur « Administration » ne concerne que les onglets Équipe et Réglages : le planning se génère,
  // se modifie et se valide toujours.
  if(S.leaveMode) h+=leaveBar();
  else h+=actionsBar(draft,savedExists,validated);
  // Congé ou indisponibilité posé sur un planning enregistré : avertissement (re-générer pour en tenir compte).
  if(!draft&&!S.leaveMode&&savedExists&&!validated){ const conf=C.leaveConflicts(S.data,m,saved,todayIso); if(Object.keys(conf).length) h+=absentBanner(m,conf); }
  if(exists||draft) h+=hoursCards(summary)+neighborBanner(summary);
  if(!S.leaveMode) h+=mailBanner()+calTools(draft);
  h+=calendarView(m,summary,asg,editing,modified,todayIso,null);
  if(exists) h+=checksCard(summary);
  if(exists||draft) h+=activityCard(summary);
  if(editing) h+=counterBar(summary);
  return h;
}
// neighborBanner : AVERTISSEMENT des semaines à cheval sur un mois voisin pas encore planifié. Leurs règles de semaine
// (jours de repos, repère d'heures) sont alors estimées au prorata des jours, et un dimanche de repos voisin n'est
// pas vu. Re-générer ce mois après avoir fait le planning du mois voisin en tient compte.
function neighborBanner(summary){
  const ws=summary.weeks.filter(function(w){ return !w.full&&!w.otherPlanned; });
  if(!ws.length) return '';
  const months={}; ws.forEach(function(w){ months[w.otherMonth]=1; });
  return '<div class="banner caution no-print">'+ico('alert')+'<div><b>Semaine'+(ws.length>1?'s':'')+' à cheval sur '+esc(Object.keys(months).sort().map(C.monthLabel).join(' et '))+', pas encore planifié'+(Object.keys(months).length>1?'s':'')+'.</b> '+
    esc(ws.map(function(w){ return C.weekLabel(w); }).join(' ; '))+' : les jours de repos et les heures de la semaine sont estimés au prorata des jours du mois, sans connaître l’autre partie de la semaine. Une fois le mois voisin planifié, re-générez ce mois pour en tenir compte.</div></div>';
}
// leaveBar : bandeau du mode « Congés » (ou « Indisponible »). On choisit la personne, puis chaque clic sur un jour du calendrier
// pose ou retire un congé (enregistré aussitôt). Les autres fonctions sont bloquées jusqu'à « Terminer ».
function leaveBar(){
  const cur=C.findEmployee(S.data,S.leaveMode.employee);
  let sel='<select data-change="leave-person" aria-label="Personne"'+(cur?' class="who-sel" style="--h:'+hueOf(cur.id)+'"':'')+'>';
  S.data.employees.forEach(function(s){ sel+='<option value="'+esc(s.id)+'"'+(cur&&cur.id===s.id?' selected':'')+'>'+esc(s.name)+'</option>'; });
  sel+='</select>';
  // Mode « Indisponible » (kind block) : jours hors congés (rendez-vous médical…), sans solde à afficher.
  const blk=S.leaveMode.kind==='block';
  const n=cur?(blk?(cur.blockedSlots||[]).filter(function(k){ return k.slice(0,7)===S.month; }).length:C.monthDays(S.month).filter(function(d){return C.onLeave(cur,d);}).length):0;
  // Solde de congés de l'année (juin → mai), mis à jour à chaque clic : visible au moment de poser le congé.
  const bal=!blk&&cur&&!cur.manager?C.leaveBalance(S.data,cur,S.month):null;
  return '<div class="banner info leave-bar no-print">'+ico(blk?'ban':'cal')+'<div>'+
    (blk?'<b>Créneaux indisponibles (hors congés).</b> Pour un rendez-vous médical, par exemple. Choisissez la personne : chaque jour affiche ses créneaux prévus. Cliquez sur un créneau pour le marquer indisponible, à nouveau pour le rendre disponible. Chaque clic est enregistré. Si elle y était placée, elle en est retirée aussitôt : choisissez ensuite qui la remplace avec « Modifier », sans re-générer. La génération ne la place jamais sur ces créneaux ; ses autres créneaux du jour restent possibles, et rien n’est décompté des congés ni des heures à faire.'
        :'<b>Congés.</b> Choisissez la personne, puis cliquez sur les jours du calendrier pour poser ou retirer un congé. Chaque clic est enregistré.')+
    (C.isValidated(S.data,S.month)?' <b>Ce mois est validé : il ne peut plus être modifié.</b>':'')+
    '<div class="leave-controls">'+sel+'<span class="help">'+(cur?esc(cur.name)+' : '+(blk?plural(n,'créneau','créneaux')+' indisponible'+(n>1?'s':''):plural(n,'jour')+' de congé')+' en '+esc(C.monthLabel(S.month)):'')+'</span>'+button('leave-done','check','Terminer','pri')+'</div>'+
    (bal?'<p class="leave-balance'+(bal.remaining!=null&&bal.remaining<0?' miss':'')+'">'+esc(balanceText(bal))+'</p>':'')+'</div></div>';

// lockButton : cadenas du mois. Ouvert : « Valider le mois » ; fermé : mois validé, un clic le déverrouille.

// filterView : PLANNING INDIVIDUEL. Calendrier du planning enregistré, filtré par salarié et par activité, avec ses
// boutons d'impression et d'envoi. Le lien « Planning individuel » d'une carte l'ouvre préfiltré sur la personne.
function filterView(m,todayIso){
  const f=S.filter, asg=savedAsg(), saved=C.hasPlanning(S.data,m);
  if(f.employee&&!C.findEmployee(S.data,f.employee)) f.employee='';
  const s=f.employee?C.findEmployee(S.data,f.employee):null, summary=C.analyze(S.data,m,asg,{today:todayIso}), acts=summary.activities;
  if(f.activity!=='*'&&!acts.some(function(a){return a.key===f.activity;})) f.activity='*';
  let sel='<select data-change="filter-person" aria-label="Salarié"'+(s?' class="who-sel" style="--h:'+hueOf(s.id)+'"':'')+'><option value="">Toute l’équipe</option>';
  S.data.employees.forEach(function(x){ sel+='<option value="'+esc(x.id)+'"'+(s&&s.id===x.id?' selected':'')+'>'+esc(x.name)+'</option>'; });
  sel+='</select>';
  let asel='<select data-change="filter-activity" aria-label="Activité"><option value="*">Toutes les activités</option>';
  acts.forEach(function(a){ asel+='<option value="'+esc(a.key)+'"'+(f.activity===a.key?' selected':'')+'>'+esc(a.label)+'</option>'; });
  asel+='</select>';
  let h='<div class="banner info filter-bar no-print">'+ico('user')+'<div><b>Planning individuel.</b> Le planning enregistré, filtré par salarié et par activité, à imprimer ou à envoyer.'+
    '<div class="leave-controls">'+sel+asel+button('print','print','Imprimer ce planning','pri',{disabled:!saved})+button('mail','mail','Envoyer par Gmail','sec',{id:'filter',disabled:!saved})+button('filter-close','x','Fermer','subtle')+'</div></div></div>';
  h+=mailBanner();
  if(!saved) return h+empty('cal','Pas encore de planning enregistré pour ce mois','Le planning individuel est tiré du planning enregistré.');
  const st=s?summary.stats.filter(function(x){return x.id===s.id;})[0]:null, act=acts.filter(function(a){return a.key===f.activity;})[0];
  let line=(s?s.name:'Toute l’équipe')+(act?' · '+act.label:'');
  if(st&&st.boss) line+=' · '+plural(st.daysWorked,'jour')+' de présence';
  else if(st) line+=' · '+(act?H(st.hoursBy[act.key]||0)+' prévues':H(st.planned)+' prévues sur '+H(st.target)+' à faire');
  h+='<p class="filter-scope">'+esc(line)+'</p>';
  return h+calendarView(m,summary,asg,false,{},todayIso,f);
}
// absentBanner : AVERTISSEMENT quand le planning enregistré place une personne un jour de congé ou sur un créneau
// indisponible posés après la génération. Aucune solution n'est proposée : « Re-générer le planning » en tient compte
// (la place est libérée et recalculée, même sur un jour gardé).
function absentBanner(m,conf){
  const who={};
  Object.keys(conf).sort().forEach(function(d){ conf[d].forEach(function(id){ (who[id]=who[id]||[]).push(C.dayLabel(d)); }); });
  const txt=Object.keys(who).map(function(id){ return nameOf(id)+' ('+who[id].join(', ')+')'; }).join(' ; ');
  return '<div class="banner caution no-print">'+ico('alert')+'<div><b>Congé ou indisponibilité posé sur le planning enregistré :</b> '+esc(txt)+'. Re-générez le planning pour en tenir compte.</div></div>';
}
// SEVERE : alertes qui demandent confirmation avant d'enregistrer un planning (règles absolues).
const SEVERE=['overlap','empty','alone','ineligible','duplicate','toomany','rest','sunday','daymax'];
function severeAlerts(summary){ return summary.alerts.filter(function(x){return SEVERE.indexOf(x.type)>=0;}); }
// confirmSevere : vrai si rien de grave, ou si le gérant confirme malgré les points listés.
function confirmSevere(summary){
  const severe=severeAlerts(summary);
  return !severe.length||confirm('À vérifier avant d’enregistrer :\n- '+severe.slice(0,15).map(function(x){return x.msg;}).join('\n- ')+(severe.length>15?'\n- … et '+(severe.length-15)+' autres':'')+'\n\nEnregistrer quand même ?');
}
// actionsBar : les boutons du mois, selon qu'il y a un brouillon, un planning enregistré (validé ou non), ou rien.
function actionsBar(draft,savedExists,validated){
  let h='';
  if(validated){
    h+='<div class="banner info no-print">'+ico('lock')+'<div><b>Mois validé.</b> Planning, congés et heures verrouillés.</div></div>';
  }else if(draft){
    h+='<div class="banner caution no-print">'+ico('edit')+'<div><b>Brouillon.</b> '+esc(S.proposalInfo||'')+' Pas encore enregistré.</div></div>';
    const keptNow=Object.keys(S.preview.locks).filter(function(d){ return S.preview.locks[d]&&d.slice(0,7)===S.preview.month&&d>=C.today(); }).length;
    h+='<div class="actions no-print">'+button('save-schedule','check','Enregistrer','pri',{title:TIPS.save})+button('discard','x','Annuler les changements','sec',{title:TIPS.discard})+
      button('propose-full','sparkle','Re-générer le planning','sec',{title:TIPS.regenerate})+
      (keptNow?button('propose-unlock','unlock','Tout recalculer ('+plural(keptNow,'jour gardé')+' compris)','subtle',{title:TIPS.unlockAll}):'')+'</div>';
  }else if(savedExists){
    h+='<div class="actions no-print">'+button('edit','edit','Modifier','pri',{title:TIPS.edit})+button('leave-mode','cal','Congés','sec',{disabled:!!S.preview,title:TIPS.leave})+button('block-mode','ban','Indisponible','sec',{disabled:!!S.preview,title:TIPS.block})+
      button('propose-full','sparkle','Re-générer le planning','sec',{title:TIPS.regenerate})+button('clear-schedule','trash','Effacer le mois','subtle-danger',{title:TIPS.clear})+'</div>';
  }else{
    h+='<div class="actions no-print">'+button('propose-full','sparkle','Générer le planning','pri',{title:TIPS.generate})+button('edit','edit','Le remplir moi-même','sec',{title:TIPS.fill})+
      button('leave-mode','cal','Congés','sec',{disabled:!!S.preview,title:TIPS.leave})+button('block-mode','ban','Indisponible','sec',{disabled:!!S.preview,title:TIPS.block})+'</div>';
  }
  return h;
}
// TIPS : explication de chaque bouton du planning, affichée au survol (bulle d'aide) plutôt qu'en clair sur la page.
const TIPS={
  generate:'Calcule automatiquement tout le mois : chacun sur ses créneaux et ses jours, en respectant les repos, les congés et les règles de répartition (Réglages), au plus près des heures à faire. Le résultat est un brouillon, à vérifier puis à enregistrer.',
  unlockAll:'Libère les jours gardés à la main (cadenas) et recalcule tout le mois à venir, y compris les personnes de ces jours-là. Les changements faits à la main sur ces jours sont perdus. Le résultat est un brouillon.',
  regenerate:'Recalcule le mois, par exemple après un changement dans l’équipe, les congés ou les réglages. Les jours passés ne changent pas ; les jours gardés à la main (cadenas) gardent leurs personnes, mais leurs places vides peuvent être complétées. Le résultat est un brouillon, à vérifier avant de l’enregistrer.',
  edit:'Ouvre le planning enregistré en brouillon : changez la personne d’un créneau avec les listes du calendrier. Un jour changé à la main est gardé si vous re-générez ensuite (ses personnes restent ; ses places vides peuvent être complétées). Rien n’est enregistré avant « Enregistrer ».',
  fill:'Ouvre un planning vide en brouillon : choisissez vous-même la personne de chaque créneau avec les listes du calendrier ; le compteur en bas de l’écran suit les heures de chacun. Rien n’est enregistré avant « Enregistrer ».',
  block:'Marque des créneaux où une personne est indisponible hors congés (rendez-vous médical…) : choisissez la personne, puis cliquez sur ses créneaux dans le calendrier. Si elle y était placée, elle en est retirée aussitôt : choisissez qui la remplace avec « Modifier », sans re-générer. Rien n’est décompté des congés ni des heures à faire.',
  leave:'Pose ou retire des congés : choisissez la personne, puis cliquez sur les jours du calendrier. Chaque clic est enregistré aussitôt et le solde de congés de l’année s’affiche. Un congé remplace les créneaux indisponibles du jour, et la personne est aussitôt retirée de ses créneaux de ce jour-là : le reste du planning ne bouge pas, pas besoin de re-générer.',
  save:'Enregistre le brouillon comme planning du mois. Si une règle n’est pas respectée (repos, dimanches…), la liste vous est montrée avant.',
  discard:'Abandonne le brouillon ; le planning enregistré reste tel quel.',
  clear:'Supprime tout le planning de ce mois, après confirmation. Son contenu reste noté dans le journal.'
};
// hoursStatus : écart entre les heures prévues et les heures du contrat, en mots simples.
// r = heures du contrat − heures prévues.
function hoursStatus(r){
  if(r>0.01) return {txt:'Manque '+H(r), cls:'todo'};
  if(r<-0.01) return {txt:'Surplus '+H(-r), cls:'over'};
  return {txt:'Complet ✓', cls:'ok'};
}
// leaveText : « 151 h au contrat − 35 h de congé (5 jours × 7 h) » : comment les heures à faire du mois
// sont obtenues. Les jours de congé qui dépassent les jours travaillables d'une semaine (ils tombent sur
// un jour de repos) ne sont pas déduits : c'est précisé. Texte brut, à échapper par l'appelant.
function leaveText(st){
  if(st.boss||!st.leaveDays.length) return '';
  const extra=st.leaveDays.length-st.leaveCounted;
  return H(st.monthly)+' au contrat − '+H(st.leaveHours)+' de congé ('+plural(st.leaveCounted,'jour')+' × '+H(C.leaveDayHours(st.person))+')'+
    (extra>0?' ; '+plural(extra,'jour')+' de congé non décompté'+(extra>1?'s':'')+' (dimanche, jour férié ou jour de repos)':'');
}
// leaveRule : la règle de calcul d'un jour de congé, en clair (bulle d'aide). Texte brut.
function leaveRule(st){
  const s=st.person;
  return 'Un jour de congé vaut '+H(C.leaveDayHours(s))+' : '+H(s.monthlyHours)+' × 12 ÷ 52 = '+C.frNumber(s.monthlyHours*12/52)+' h par semaine, ÷ '+(7-s.restDaysPerWeek)+' jours travaillés, arrondi à l’heure. Ces heures sont déduites des heures à faire du mois.';
}
// overDaysOf : jours où la personne dépasse la durée maximale d'une journée.
function overDaysOf(st){ const mx=C.MAX_DAY_HOURS; return st.boss?[]:Object.keys(st.days).filter(function(d){return st.days[d].hours>mx+1e-9;}).sort(); }
// hoursCards : une carte par personne : ses heures du mois, et sous son nom les liens « Fiche d'heures » (à faire
// signer) et « Planning individuel » (calendrier filtré sur la personne et son activité).
function hoursCards(summary){
  let h='<div class="people no-print">', line=[];
  summary.stats.forEach(function(st){
    if(st.boss) return; // le gérant n'a pas d'heures : pas de carte
    const links='<div class="pcard-links"><button class="link" data-action="sheet" data-id="'+esc(st.id)+'" title="Imprimer la fiche d’heures du mois de '+esc(st.name)+', à faire signer">'+ico('print')+'Fiche d’heures</button>'+
      '<button class="link" data-action="person-plan" data-id="'+esc(st.id)+'" title="Planning de '+esc(st.name)+' seul, à imprimer ou à envoyer">'+ico('user')+'Planning individuel</button></div>';
    const s=hoursStatus(st.goal-st.planned), pct=st.goal>0?Math.min(100,st.planned/st.goal*100):100, od=overDaysOf(st).length;
    const bal=C.leaveBalance(S.data,st.person,summary.month), ot=overtimeOf(st,summary.month);
    line.push(st.name+' '+H(st.planned)+' / '+H(st.target));
    // Heures sup. du mois, calculées par rapport au contrat (moins les congés) : badge +Xh / −Xh en haut à droite.
    // Recalculé à chaque modification du planning, y compris à la main.
    // Congés restants de l'année de congés (juin → mai) : tag à côté des heures sup. ; le détail est dans la bulle.
    const lvTip=balanceText(bal)+(st.leaveDays.length?' · Ce mois : '+leaveText(st)+'. '+leaveRule(st):'');
    h+='<div class="pcard"><div class="pcard-top"><span class="pcard-name">'+esc(st.name)+'</span><span class="pcard-tags">'+
      '<span class="ot-badge lv-badge'+(bal.remaining!=null&&bal.remaining<0?' ot-neg':'')+'" title="'+esc(lvTip)+'">Congés restants : '+(bal.initial==null?'non saisi':esc(C.frNumber(bal.remaining)))+'</span>'+
      '<span class="ot-badge '+(ot.month>0.01?'ot-pos':ot.month<-0.01?'ot-neg':'')+'" title="'+esc(ot.tip)+'">'+esc(shortSigned(ot.month))+'</span></span></div>'+links+
      '<div class="pcard-hours">'+esc(H(st.planned))+' <span>sur '+esc(H(st.target))+' à faire</span></div>'+
      '<div class="bar-load"><span class="filled'+(s.cls==='over'?' over':'')+'" style="width:'+pct.toFixed(1)+'%"></span></div>'+
      // Le badge donne l'écart DU MOIS ; cette ligne, le CUMUL des heures sup. (mois validés, plus ce mois s'il ne l'est pas).
      '<div class="pcard-meta" title="'+esc(ot.tip)+'">Heures sup. : '+esc(shortSigned(ot.month))+' ce mois · cumul '+esc(shortSigned(ot.total))+'</div>'+
      (od?'<div class="pcard-meta miss">'+plural(od,'journée')+' de plus de '+esc(H(C.MAX_DAY_HOURS))+'</div>':'')+
      '</div>';
  });
  h+='</div><p class="print-only print-hours">Heures du mois : '+esc(line.join(' · '))+'</p>';
  if(summary.uncovered>0.01) h+='<div class="banner error">'+ico('alert')+'<div><b>Créneaux sans personne</b> : voir « Points à vérifier » sous le calendrier.</div></div>';
  return h;
}
// calendarView : grille lundi → dimanche, une ligne par semaine, suivie des heures de la semaine.
// filter (planning individuel) : {employee, activity} ; seuls les créneaux de cette activité (« * » : toutes) où la
// personne est placée sont montrés, et seules ses heures de la semaine. null : planning global.
// weekHoursOf : heures de la semaine wi d'un salarié ; avec un filtre d'activité, celles de cette activité seulement.
function weekHoursOf(summary,st,wi,filter){
  if(!filter||filter.activity==='*') return st.weeks[wi].planned;
  let t=0; summary.weeks[wi].days.forEach(function(d){ const x=st.days[d]; if(x) x.items.forEach(function(sl){ if(sl.activityKey===filter.activity) t+=sl.hours; }); });
  return C.round2(t);
}
function calendarView(m,summary,asg,editing,modified,todayIso,filter){
  const byDate={}; summary.slots.forEach(function(sl){ (byDate[sl.date]=byDate[sl.date]||[]).push(sl); });
  const emp=filter&&filter.employee||'', locks=editing?S.preview.locks:{};
  const counted=summary.stats.filter(function(st){return !st.boss&&(!emp||st.id===emp);});
  function weekHours(st,wi){ return weekHoursOf(summary,st,wi,filter); }
  const people=emp?S.data.employees.filter(function(s){return s.id===emp;}):S.data.employees;
  let h='<div class="card" style="padding:12px"><div class="legend">'+people.map(whoShort).join('')+'<span><i class="lg missing"></i>personne n’est prévu</span>'+(editing?'<span>'+ico('lock')+'jour gardé si vous recalculez</span>':'')+'</div>'+
    '<div class="cal'+(counted.length?' with-tot':'')+'" style="--wcols:'+Math.max(1,counted.length)+'">';
  C.WEEK_NAMES.forEach(function(n){ h+='<div class="cal-head">'+esc(n)+'</div>'; });
  counted.forEach(function(st){ h+='<div class="cal-head tot-head">'+whoShort(st.person)+'</div>'; });
  // outSlots : créneaux des mois voisins par jour, calculés une fois par affichage (cases hors du mois, outCell).
  const outSlots={};
  summary.weeks.forEach(function(w,wi){
    // Semaine à cheval sur un mois voisin pas encore planifié : la case hors du mois le rappelle (une seule fois).
    let noted=false;
    for(let i=0;i<7;i++){
      const d=C.addDays(w.monday,i);
      if(d.slice(0,7)!==m){
        const note=!w.otherPlanned&&!noted&&!filter?'<span class="out-note no-print">'+esc(cap1(C.monthLabel(w.otherMonth)))+' pas encore planifié : semaine estimée au prorata</span>':'';
        if(note) noted=true;
        h+=outCell(d,note,filter,outSlots);
      }else h+=dayCell(d,byDate[d]||[],summary,asg,editing,modified,locks,todayIso,wi,filter);
    }
    // Heures de la semaine de chaque salarié, à droite de la semaine (celles du mois affiché ; la bulle donne aussi
    // celles déjà prévues dans le mois voisin pour une semaine à cheval).
    counted.forEach(function(st){
      const oh=summary.weeks[wi].per[st.id]&&summary.weeks[wi].per[st.id].otherHours;
      h+='<div class="week-tot" style="--h:'+hueOf(st.id)+'" title="'+esc(st.name)+' · semaine du '+esc(C.dayLabel(w.monday))+(oh?' · '+esc(H(oh))+' déjà prévues en '+esc(C.monthLabel(w.otherMonth))+', soit '+esc(H(C.round2(oh+weekHours(st,wi))))+' sur la semaine entière':'')+'"><span class="wt-name">'+esc(firstName(st.person))+'</span><b>'+esc(H(weekHours(st,wi)))+'</b><span class="wt-l">semaine</span>'+(st.weeks[wi].leave?'<span class="wt-leave" title="Heures de congé déduites des heures à faire">congé −'+esc(H(st.weeks[wi].leave))+'</span>':'')+'</div>';
    });
  });
  return h+'</div></div>';
}
// outCell : case d'un jour du MOIS VOISIN (semaine à cheval), POUR INFORMATION SEULEMENT : grisée, rien n'y est
// cliquable ni modifiable. Elle montre le planning enregistré de ce mois-là (créneaux et personnes, avec le filtre du
// planning individuel), les congés, les créneaux indisponibles et les jours fériés ; sans planning enregistré, les
// créneaux du jour sans personne. note : rappel « … pas encore planifié » (une fois par semaine).
function outCell(d,note,filter,outSlots){
  const om=d.slice(0,7);
  if(!outSlots[om]){ const by=outSlots[om]={}; C.monthSlots(S.data,om).forEach(function(sl){ (by[sl.date]=by[sl.date]||[]).push(sl); }); }
  const daySl=outSlots[om][d]||[];
  const planned=C.hasPlanning(S.data,om), asg=planned?S.data.schedules[om].assignments:{}, emp=filter&&filter.employee||'';
  let body='';
  filterSlots(daySl,asg,filter).forEach(function(sl){
    const ids=(asg[sl.key]||[]).filter(function(id){ return !!C.findEmployee(S.data,id); });
    if(!ids.length&&planned&&!sl.showEmpty) return;
    body+='<div class="slot"><div class="slot-h"><span>'+esc(sl.label)+'</span></div><div class="slot-p">'+
      (ids.length?ids.map(function(id){ return whoShort(C.findEmployee(S.data,id)); }).join(''):'<span class="help">—</span>')+'</div></div>';
  });
  S.data.employees.forEach(function(s){
    if(emp&&s.id!==emp) return;
    if(C.onLeave(s,d)){ body+='<div class="leave-line" style="--h:'+hueOf(s.id)+'">Congé · '+esc(firstName(s))+'</div>'; return; }
    const b=daySl.filter(function(sl){ return C.isBlocked(s,d,sl.shift); }).map(function(sl){ return sl.label; });
    if(b.length) body+='<div class="block-line" style="--h:'+hueOf(s.id)+'">Indispo · '+esc(firstName(s))+' : '+esc(b.join(', '))+'</div>';
  });
  const hol=C.holidayOf(S.data,d);
  if(hol) body='<div class="holiday-line">Férié'+(hol.name?' · '+esc(hol.name):'')+'</div>'+body;
  return '<div class="day out" aria-disabled="true" title="'+esc(cap1(C.monthLabel(om)))+' : affiché pour information. Pour le modifier, ouvrez ce mois-là.">'+
    '<div class="day-top"><span class="day-num">'+C.parseISO(d).getUTCDate()+'<small>'+esc(C.WEEK_NAMES[C.weekday(d)-1].slice(0,3))+'.</small></span></div>'+
    (note?note:'')+'<div class="out-body">'+body+'</div></div>';
}
// dayCell : une case du calendrier. En modification, une liste par personne présente sur le créneau,
// plus une liste vide tant que le maximum du créneau n'est pas atteint.
// filterSlots : planning individuel : seulement les créneaux de l'activité choisie, et ceux de la personne choisie.
function filterSlots(slots,asg,filter){
  const emp=filter&&filter.employee||'';
  return !filter?slots:slots.filter(function(sl){ return (filter.activity==='*'||sl.activityKey===filter.activity)&&(!emp||(asg[sl.key]||[]).indexOf(emp)>=0); });
}
// slotView : ce qu'un créneau montre dans la case du jour, ou null s'il est masqué. Sert au calendrier et au PDF.
//   ids (personnes), missing (places indispensables vides), why (créneau « Ne jamais laisser vide » resté vide).
function slotView(sl,asg,summary,past,editing){
  const ids=(asg[sl.key]||[]).filter(function(id){return id&&C.findEmployee(S.data,id);});
  // why : créneau « Ne jamais laisser vide » resté sans personne (jour à venir) : toujours affiché, en rouge, expliqué.
  const why=summary.neverEmptyMissing[sl.key];
  let c=0; ids.forEach(function(id){ if(!(sl.noBossAlone&&C.findEmployee(S.data,id).manager)) c++; });
  const missing=Math.max(0,sl.min-c);
  if(!ids.length&&!why){
    // Créneau facultatif, vide, que personne de l'équipe ne peut tenir ce jour-là (ex. magasin le mercredi) : masqué.
    if(!sl.min&&!S.data.employees.some(function(s){return C.canWork(s,sl.shift,sl.date);})) return null;
    // Réglage « Afficher dans le planning même si personne n'est affecté » décoché : le créneau vide est masqué
    // (un magasin sans personne de tout le mois disparaît ainsi du planning). Restent visibles : en modification,
    // pour pouvoir y placer quelqu'un, et un créneau indispensable à venir (il manque quelqu'un : c'est une alerte).
    if(!sl.showEmpty&&!editing&&!(missing&&!past)) return null;
  }
  return {ids:ids,missing:missing,why:why};
}
function dayCell(d,slots,summary,asg,editing,modified,locks,todayIso,wi,filter){
  const past=d<todayIso, wd=C.weekday(d), emp=filter&&filter.employee||'', daySlots=slots;
  slots=filterSlots(slots,asg,filter);
  let problem=false, body='';
  slots.forEach(function(sl){
    const v=slotView(sl,asg,summary,past,editing); if(!v) return;
    const ids=v.ids, why=v.why, missing=v.missing;
    if((missing||why)&&!past) problem=true;
    body+='<div class="slot'+((missing||why)&&!past?' missing':'')+(why?' never-empty':'')+'"><div class="slot-h"><span>'+esc(sl.label)+'</span>'+(why?'<span class="slot-info" style="color:var(--danger)">jamais vide</span>':'')+'</div><div class="slot-p">';
    if(editing){
      const shown=Math.min(sl.max,Math.max(sl.min,why?1:0,ids.length+1));
      for(let p=0;p<shown;p++) body+=personSelect(sl,ids[p]||'',p);
    }else{
      body+=ids.length?ids.map(function(id){ return whoShort(C.findEmployee(S.data,id)); }).join(''):(missing||why)?'<span class="none">personne</span>':'<span class="help">—</span>';
      if(ids.length&&missing&&!past) body+='<span class="none">+'+missing+' à trouver</span>';
    }
    body+='</div>'+(why?'<div class="empty-why" title="'+esc(why.txt)+'">⚠ '+esc(cap1(why.short))+'</div>':'')+'</div>';
  });
  if(!slots.length){
    const es=emp&&C.findEmployee(S.data,emp), st=emp&&summary.stats.filter(function(x){return x.id===emp;})[0];
    body=!emp?'<span class="help" style="font-size:.78rem">Aucun créneau</span>':
      (es&&C.onLeave(es,d))?'':'<span class="help" style="font-size:.78rem">'+(st&&st.days[d]?'—':'Repos')+'</span>';
  }
  // Journée plus longue que la durée maximale : permise, mais signalée en rouge.
  summary.stats.forEach(function(st){ const x=st.days[d]; if(emp&&st.id!==emp) return; if(!st.boss&&x&&x.hours>C.MAX_DAY_HOURS+1e-9) body+='<div class="over-day" title="Journée plus longue que '+esc(H(C.MAX_DAY_HOURS))+'">⚠ '+esc(firstName(st.person))+' '+esc(H(x.hours))+'</div>'; });
  // Congés du jour : une ligne par personne en congé, à sa couleur.
  // Un congé un dimanche ou un jour férié est affiché, mais pas décompté (Core.leaveCounts) : la bulle le précise.
  const nc=!C.leaveCounts(S.data,d)?' (dimanche ou jour férié : non décompté des congés)':'';
  S.data.employees.forEach(function(s){ if(emp&&s.id!==emp) return; if(C.onLeave(s,d)) body+='<div class="leave-line" style="--h:'+hueOf(s.id)+'" title="'+esc(s.name)+' en congé'+(s.manager?'':nc)+'">Congé · '+esc(firstName(s))+'</div>'; });
  // Créneaux indisponibles hors congés (rendez-vous médical…) : une ligne par personne avec ses créneaux ; jamais
  // décomptés, respectés par la génération.
  S.data.employees.forEach(function(s){
    if(emp&&s.id!==emp) return;
    const b=daySlots.filter(function(sl){ return C.isBlocked(s,d,sl.shift); }).map(function(sl){ return sl.label; }); if(!b.length) return;
    body+='<div class="block-line" style="--h:'+hueOf(s.id)+'" title="'+esc(s.name)+' indisponible : '+esc(b.join(', '))+' (hors congés : non décompté)">Indispo · '+esc(firstName(s))+' : '+esc(b.join(', '))+'</div>';
  });
  // Jour férié (Réglages) : affiché en tête de la case.
  const hol=C.holidayOf(S.data,d);
  if(hol) body='<div class="holiday-line" title="Jour férié : un congé posé ce jour-là n’est pas décompté">Férié'+(hol.name?' · '+esc(hol.name):'')+'</div>'+body;
  const kept=editing&&!past&&!!locks[d];
  // Mode congés : toute la case est un bouton ; elle est marquée si la personne choisie est en congé ce jour-là.
  // Mois validé : les congés ne se modifient plus, les cases ne sont pas cliquables.
  // Mode « Indisponible » (kind block) : la case n'est pas cliquable ; elle montre un bouton par créneau prévu pour la
  // personne ce jour-là (onglet Équipe). Un clic rend le créneau indisponible ; un second clic le rend disponible.
  const lm=S.leaveMode&&!filter&&!C.isValidated(S.data,d.slice(0,7))?S.leaveMode:null, lp=lm&&C.findEmployee(S.data,lm.employee);
  const blk=!!lm&&lm.kind==='block', onl=lp&&!blk&&C.onLeave(lp,d);
  const pick=lp&&!blk?' leave-pick'+(onl?' on-leave':'')+'" style="--h:'+hueOf(lp.id)+'" data-action="leave-day" data-id="'+d+'" role="button" tabindex="0" aria-pressed="'+(onl?'true':'false')+'" title="'+esc(lp.name)+' : '+(onl?'retirer le congé':'poser un congé')+' le '+esc(C.dayLabel(d)):'';
  if(lp&&blk){
    const own=daySlots.filter(function(sl){ return C.hasShift(lp,sl.shift,d); });
    let chips='<div class="block-pick" style="--h:'+hueOf(lp.id)+'"><span class="block-who">'+esc(firstName(lp))+' :</span>';
    if(C.onLeave(lp,d)) chips+='<span class="help">en congé ce jour-là</span>';
    else if(!own.length) chips+='<span class="help">aucun créneau prévu</span>';
    else own.forEach(function(sl){ const on=C.isBlocked(lp,d,sl.shift);
      chips+='<button class="block-chip'+(on?' on':'')+'" data-action="block-slot" data-id="'+esc(sl.key)+'" aria-pressed="'+(on?'true':'false')+'" title="'+esc(lp.name)+' : '+(on?'rendre disponible':'marquer indisponible')+' — '+esc(sl.label)+', '+esc(C.dayLabel(d))+'">'+(on?ico('ban'):'')+esc(sl.label)+'</button>'; });
    body+=chips+'</div>';
  }
  return '<div class="day'+(past?' past':'')+(d===todayIso?' today':'')+(modified[d]?' modified':'')+(problem?' problem':'')+pick+'">'+
    '<div class="day-top"><span class="day-num">'+C.parseISO(d).getUTCDate()+'<small>'+esc(C.WEEK_NAMES[wd-1].slice(0,3))+'.</small></span><span class="day-tags">'+
    (modified[d]?'<span class="tag tag-accent">changé</span>':'')+
    (kept?'<button class="lock-tag no-print" data-action="unlock" data-id="'+d+'" title="Jour gardé : ses personnes ne changent pas si vous recalculez ; une place restée vide peut être complétée. Cliquez pour le libérer.">'+ico('lock')+'gardé</button>':'')+
    '</span></div>'+body+'</div>';
}
// personSelect : liste d'une place de créneau. Seules les personnes prévues sur ce créneau ce jour-là
// (onglet Équipe) sont proposées. Une personne déjà placée mais plus prévue reste affichée, signalée.
function personSelect(sl,cur,pos){
  const relay0=C.relayOpen(S.data,sl);
  const placeholder=pos<sl.min?'À choisir':'+ ajouter';
  let h='<select data-change="assign"'+(cur?' class="who-sel" style="--h:'+hueOf(cur)+'"':' class="empty"')+' data-slot="'+esc(sl.key)+'" data-pos="'+pos+'" aria-label="'+esc(sl.label+' du '+C.dayLabel(sl.date))+'"><option value="">'+(cur?'— retirer —':placeholder)+'</option>';
  S.data.employees.forEach(function(s){
    // Le gérant peut aussi se placer à la main en dehors de ses jours fixes (sauf un jour de congé).
    // RELAIS DU GÉRANT (Core.relayOpen) : créneau « Ne jamais laisser vide » un jour où le gérant est en congé : tous les
    // salariés sont proposés, même sans ce créneau coché dans Équipe (la génération, elle, ne les y place pas).
    const allowed=C.canWork(s,sl.shift,sl.date), free=!allowed&&!C.isAway(s,sl.date,sl.shift);
    const extra=free&&s.manager, relay=free&&!s.manager&&relay0;
    if(!allowed&&!extra&&!relay&&s.id!==cur) return;
    h+='<option value="'+esc(s.id)+'"'+(s.id===cur?' selected':'')+'>'+esc(firstName(s))+(allowed?'':extra?' (hors jours fixes)':relay?' (relais gérant)':C.onLeave(s,sl.date)?' (en congé)':C.isBlocked(s,sl.date,sl.shift)?' (indisponible)':' (pas prévu)')+'</option>';
  });
  return h+'</select>';
}
// checksCard : « Points à vérifier », regroupés et en mots simples : heures du mois non atteintes ou
// dépassées (une ligne par salarié), créneaux sans personne, journées trop longues, autres alertes.
function checksCard(summary){
  const items=[], uncovered=[], longDays={};
  summary.alerts.forEach(function(x){
    if(x.type==='monthmax') return; // remplacé par la ligne « heures du mois » de chaque salarié, plus bas
    if(x.type==='uncovered'){ uncovered.push(x.date); return; }
    if(x.type==='daymax') return;
    items.push(x.msg);
  });
  if(uncovered.length){
    const byDay={}; summary.slots.forEach(function(sl){ if(uncovered.indexOf(sl.date)>=0){ let c=0; (shownAsg()[sl.key]||[]).forEach(function(id){ const s=C.findEmployee(S.data,id); if(s&&!(sl.noBossAlone&&s.manager)) c++; }); if(c<sl.min) (byDay[sl.date]=byDay[sl.date]||[]).push(sl.label.toLowerCase()); } });
    items.unshift('Personne n’est prévu : '+Object.keys(byDay).sort().map(function(d){ return C.dayLabel(d)+' ('+byDay[d].join(', ')+')'; }).join(', ')+'.');
  }
  // Heures du mois : un salarié qui n'est pas à son compte, en moins comme en plus.
  summary.stats.filter(function(st){return !st.boss;}).reverse().forEach(function(st){
    const why=st.leaveHours||Math.abs(st.carry)>0.01?', soit '+targetDetail(st):'';
    const goal=H(st.goal)+' à faire'+why;
    if(st.remaining>0.01) items.unshift(st.name+' : il manque '+H(st.remaining)+' ('+H(st.planned)+' prévues pour '+goal+').');
    else if(st.remaining<-0.01) items.unshift(st.name+' : '+H(-st.remaining)+' en surplus ('+H(st.planned)+' prévues pour '+goal+').');
  });
  summary.stats.forEach(function(st){
    const od=overDaysOf(st); if(!od.length) return;
    items.push(st.name+' fait plus de '+H(C.MAX_DAY_HOURS)+' certains jours : le '+od.map(function(d){return Number(d.slice(8));}).join(', ')+' ('+plural(od.length,'journée')+').');
  });
  let h='<div class="card alerts-card"><h2>Points à vérifier</h2>';
  if(!items.length) h+='<p class="ok-row">'+ico('check')+'Tout est en ordre.</p>';
  else{ h+='<ul class="alerts">'; items.forEach(function(t){ h+='<li>'+ico('alert')+'<span>'+esc(t)+'</span></li>'; }); h+='</ul>'; }
  return h+'</div>';
}
// activityCard : temps passé à chaque activité par chaque salarié, dans le mois (une colonne par activité).
function activityCard(summary){
  const acts=summary.activities;
  // Barre en plusieurs couleurs (une par activité), expliquée par la légende au-dessus.
  let h='<div class="card activity-card"><h2>Temps par activité · '+esc(C.monthLabel(summary.month))+'</h2>'+
    '<div class="act-legend">'+acts.map(function(a){ return '<span><i class="sw c'+(a.index%4)+'"></i>'+esc(a.label)+'</span>'; }).join('')+
    '<span class="help">La barre montre la part de chaque activité dans les heures du mois.</span></div><div class="activity">';
  summary.stats.forEach(function(st){
    if(st.boss) return;
    const t=acts.reduce(function(x,a){ return x+(st.hoursBy[a.key]||0); },0);
    function pct(a){ return t?Math.round((st.hoursBy[a.key]||0)/t*100):0; }
    h+='<div class="act-row" style="--acts:'+Math.max(1,acts.length)+'"><span class="act-name">'+who(st.person)+'</span>'+
      acts.map(function(a){ return '<span class="act-val"><span class="act-l"><i class="sw c'+(a.index%4)+'"></i>'+esc(a.label)+'</span><b>'+esc(H(st.hoursBy[a.key]||0))+'</b></span>'; }).join('')+
      '<span class="act-bar" title="'+esc(acts.map(function(a){ return a.label+' '+pct(a)+' %'; }).join(' · '))+'">'+
        (t?acts.map(function(a){ return '<span class="c'+(a.index%4)+'" style="width:'+((st.hoursBy[a.key]||0)/t*100).toFixed(2)+'%"></span>'; }).join(''):'')+'</span>'+
      '<span class="act-pct">'+(t?acts.map(function(a){ return pct(a)+' % '+esc(a.label.toLowerCase()); }).join('<br>'):'aucune heure')+'</span></div>';
  });
  return h+'</div></div>';
}
// counterBar : le compteur d'heures, fixé en bas de l'écran pendant la modification.
function counterBar(summary){
  let h='<div class="counter-bar" role="status" aria-live="polite"><span class="c-main">Heures du mois :</span>';
  summary.stats.forEach(function(st){
    if(st.boss) return;
    const s=hoursStatus(st.goal-st.planned);
    h+='<span class="c-person">'+esc(st.name)+' <b>'+esc(H(st.planned))+'</b> / '+esc(H(st.target))+' <span class="pill '+s.cls+'">'+esc(s.txt)+'</span></span>';
  });
  if(summary.uncovered>0.01) h+='<span class="c-over">Créneaux sans personne</span>';
  return h+'</div>';
}

// ---------- Onglet Équipe ----------
// employeesView : une fiche par personne (nom, gérant, heures, repos, créneaux et jours), ajout, retrait.
function employeesView(){
  const emps=S.data.employees, shifts=S.data.shifts, lp=C.leavePeriod(S.month);
  let h='<div class="head-section"><div><h2>Équipe</h2><p class="help">Qui travaille, combien d’heures par mois, et sur quels créneaux.</p></div></div>';
  // Équipe vide (première mise en place) : marche à suivre, et la saisie des noms placée en premier.
  if(!emps.length) h+='<div class="banner info">'+ico('users')+'<div><b>Première mise en place : saisissez votre équipe.</b>'+
    '<ol class="setup-steps"><li>Écrivez le prénom et le nom de chaque personne ci-dessous, <b>y compris le gérant</b>, une personne par ligne, puis cliquez sur « Ajouter ».</li>'+
    '<li>Sur chaque fiche : heures du contrat par mois, jours de repos par semaine, dimanches de repos par mois, créneaux et jours possibles. Pour le gérant, cochez « Gérant » : seule sa présence est notée.</li>'+
    '<li>Cliquez sur « Enregistrer les modifications », puis générez le planning dans « Planning ».</li></ol>'+
    (S.data.shifts.length?'':'<p style="margin:0 0 .4rem"><b>Aucun créneau n’est encore saisi</b> : commencez par l’onglet « Réglages », pour pouvoir cocher ensuite les créneaux de chacun.</p>')+
    '<p class="help" style="margin:0">Les noms ne sont enregistrés que dans le fichier de données de ce dossier.</p></div></div>'+addCard();
  emps.forEach(function(s){
    const id=esc(s.id);
    h+='<div class="card person-card"><div class="person-head"><input type="text" class="name" id="name-'+id+'" data-keep value="'+esc(s.name)+'" aria-label="Prénom et nom">'+
      // Adresse e-mail : destinataire prérempli de l'envoi du planning (individuel, ou global pour les salariés).
      '<input type="email" id="email-'+id+'" data-keep value="'+esc(s.email||'')+'" placeholder="Adresse e-mail (facultative)" aria-label="Adresse e-mail de '+esc(s.name)+'" title="Destinataire proposé quand le planning est envoyé par e-mail" autocomplete="off" spellcheck="false">'+
      '<label class="check" title="Aucune heure n’est comptée : seule la présence apparaît au planning"><input type="checkbox" class="boss-cb" id="boss-'+id+'" data-keep'+(s.manager?' checked':'')+'>Gérant</label></div>'+
      // Les champs d'heures sont toujours présents ; dès que « Gérant » est coché, ils sont masqués (feuille de style,
      // .person-card:has(.boss-cb:checked)), sans attendre l'enregistrement. Pour le gérant, ils sont préremplis avec
      // les valeurs d'un nouveau salarié (151 h, 2 jours, 2 dimanches), utiles si la case est décochée.
      '<p class="help boss-note">Présence seulement : aucune heure n’est comptée.</p>'+
      '<div class="grid-fields hours-fields">'+
      (
        '<label class="field"><span>Heures par mois</span><input type="number" id="hours-'+id+'" data-keep min="0" max="300" step="1" value="'+(s.manager?151:s.monthlyHours)+'"></label>'+
        '<label class="field"><span>Jours de repos par semaine</span><input type="number" id="rest-'+id+'" data-keep min="0" max="6" step="1" value="'+(s.manager?2:s.restDaysPerWeek)+'"></label>'+
        '<label class="field"><span>Dimanches de repos par mois</span><input type="number" id="sun-'+id+'" data-keep min="0" max="5" step="1" value="'+(s.manager?2:s.sundaysOffPerMonth)+'"></label>'+
        // Compteur de congés : solde au 1er juin de l'année de congés du mois affiché (juin → mai), saisi à la main.
        '<label class="field" title="Année de congés '+esc(lp.label)+'. Les jours de congé posés ensuite sont décomptés de ce solde."><span>Congés au 1er juin '+lp.key+' (jours)</span><input type="number" id="leave0-'+id+'" data-keep min="0" max="100" step="0.5" value="'+(s.leaveStart&&lp.key in s.leaveStart?s.leaveStart[lp.key]:'')+'" placeholder="non saisi"></label>')+
      // Gérant : les créneaux et jours cochés sont ses JOURS DE PRÉSENCE FIXES (seul endroit où ils se règlent) :
      // il y est placé d'office, et nulle part ailleurs par la génération. Salarié : créneaux et jours possibles.
      '</div><div class="field"><span class="can-title"><span class="hours-fields">Peut travailler</span><span class="boss-note" style="margin:0">Jours de présence fixes du gérant</span></span>'+
      '<p class="help boss-note" style="margin:0 0 .3rem">Les jours cochés, le gérant est placé d’office sur le créneau (sauf en congé) ; la génération ne le place jamais ailleurs. Il peut toujours s’ajouter à la main dans le planning.</p>'+shifts.map(function(p){
        const on=s.shifts.indexOf(p.id)>=0, jp=s.shiftDays[p.id];
        return '<div class="can-row shift-pick"><label class="check"><input type="checkbox" id="shift-'+id+'-'+esc(p.id)+'" data-keep'+(on?' checked':'')+'>'+esc(C.shiftLabel(p))+'</label><span class="days-cb" title="Jours où ce créneau est possible">'+
          [1,2,3,4,5,6,7].map(function(j){
            // Jour où le créneau n'existe pas (ex. magasin fermé le mercredi et le dimanche) : grisé, non modifiable.
            if(p.days.indexOf(j)<0) return '<label class="day-cb" title="'+esc(C.shiftLabel(p))+' : pas de créneau le '+C.WEEK_NAMES[j-1]+' (voir Réglages)"><input type="checkbox" disabled aria-label="'+esc(C.shiftLabel(p))+' le '+C.WEEK_NAMES[j-1]+' : pas de créneau"><span>'+C.WEEK_LETTERS[j-1]+'</span></label>';
            return '<label class="day-cb" title="'+C.WEEK_NAMES[j-1]+'"><input type="checkbox" id="shiftday-'+id+'-'+esc(p.id)+'-'+j+'" data-keep'+(!jp||jp.indexOf(j)>=0?' checked':'')+' aria-label="'+esc(C.shiftLabel(p))+' le '+C.WEEK_NAMES[j-1]+'"><span>'+C.WEEK_LETTERS[j-1]+'</span></label>';
          }).join('')+'</span></div>';
      }).join('')+'</div>'+
      (s.manager?'':otHistoryPanel(s))+
      '<div class="actions" style="margin:6px 0 0">'+(s.manager?'':button('ot-history','clock',S.otHistory[s.id]?'Masquer l’historique des heures sup.':'Historique des heures sup.','sec',{small:true,id:s.id,title:'Écart d’heures de chaque mois et cumul des heures sup., mois par mois'}))+button('remove','trash','Retirer de l’équipe','subtle-danger',{small:true,id:s.id})+'</div></div>';
  });
  h+='<p class="help">Les lettres L M M J V S D indiquent les jours où la personne peut tenir le créneau ; pour le gérant, ses jours de présence fixes (par exemple le matin du lundi au samedi). Une lettre grisée : le créneau n’existe pas ce jour-là. <b>Adresse e-mail</b> : proposée comme destinataire quand le planning est envoyé par e-mail.</p>';
  if(emps.length) h+='<p class="help"><b>Congés au 1er juin</b> : solde de l’année de congés '+esc(lp.label)+' (celle du mois affiché dans « Planning »), en jours. Les jours de congé posés sont décomptés comme pour les heures : au plus les jours travaillables de chaque semaine (7 − jours de repos). Un congé un dimanche ou un jour férié (Réglages) reste affiché mais n’est pas décompté. Le solde restant s’affiche au moment de poser un congé.</p>';
  if(emps.length) h+=addCard();
  if(emps.length) h+=saveBar('save-team','Enregistrer les modifications','Enregistre en une fois les changements de toutes les fiches.','cancel-team');
  return h;
}
// otHistoryPanel : HISTORIQUE DES HEURES SUP. d'un salarié (Core.overtimeHistory), affiché sur sa fiche quand le
// bouton « Historique des heures sup. » est ouvert : écart de chaque mois (incrément ou décrément) et cumul.
function otHistoryPanel(s){
  if(!S.otHistory[s.id]) return '';
  const rows=C.overtimeHistory(S.data,s.id);
  let h='<div class="ot-history"><h3>Historique des heures sup. — '+esc(s.name)+'</h3>';
  if(!rows.length) return h+'<p class="help">Aucun mois planifié pour le moment.</p></div>';
  const last=rows.filter(function(r){return r.validated;}).pop(), cur=last?last.total:0;
  h+='<p class="ot-now">Cumul des mois validés : <span class="ot-badge '+(cur>0.01?'ot-pos':cur<-0.01?'ot-neg':'')+'">'+esc(shortSigned(cur))+'</span> <span class="help">'+(cur>0.01?'heures à rendre au salarié':cur<-0.01?'heures dues par le salarié':'à jour')+'</span></p>'+
    '<div class="scroll"><table class="ot-table"><thead><tr><th>Mois</th><th class="num">Écart du mois</th><th class="num">Cumul</th><th>État</th></tr></thead><tbody>';
  rows.slice().reverse().forEach(function(r){
    h+='<tr'+(r.validated?'':' class="ot-prov"')+'><td>'+esc(cap1(C.monthLabel(r.month)))+'</td>'+
      '<td class="num"><span class="'+(r.delta>0.01?'ot-up':r.delta<-0.01?'ot-down':'')+'">'+(r.delta>0.01?'▲ ':r.delta<-0.01?'▼ ':'')+esc(shortSigned(r.delta))+'</span></td>'+
      '<td class="num">'+(r.validated?'<b>'+esc(shortSigned(r.total))+'</b>':'<span class="help">'+esc(shortSigned(r.total))+'</span>')+'</td>'+
      '<td>'+(r.validated?ico('lock')+'Validé'+(r.at?' le '+esc(dateTimeStr(r.at)):''):'<span class="help">En cours : provisoire, hors cumul</span>')+'</td></tr>';
  });
  return h+'</tbody></table></div><p class="help">Écart du mois = heures prévues − heures à faire (contrat moins congés). Seuls les mois validés (cadenas, onglet Planning) entrent dans le cumul. Le mois en cours (le suivant du dernier mois validé) est provisoire, recalculé à chaque changement de son planning ; les mois planifiés plus loin ne sont pas comptés.</p></div>';
}
// addCard : saisie de nouvelles personnes (prénom et nom, une personne par ligne).
function addCard(){
  return '<div class="card"><h2>Ajouter des personnes</h2><label class="field"><span class="help" style="font-weight:400">Prénom et nom, une personne par ligne. Chaque nouvelle personne commence à 151 h par mois, 2 jours de repos par semaine et 2 dimanches de repos, sans créneau ; cochez ensuite sur sa fiche les créneaux qu’elle peut tenir.</span>'+
    '<textarea id="add-names" data-keep placeholder="Prénom et nom, une personne par ligne"></textarea></label>'+
    '<div class="actions" style="margin:0">'+button('add','plus','Ajouter','sec')+'</div></div>';
}
// saveBar : le bouton unique « Enregistrer » d'un onglet, fixé en bas de l'écran, précédé de « Annuler les
// modifications » (cancel), qui rend aux champs les valeurs enregistrées.
function saveBar(action,label,hint,cancel){
  return '<div class="save-bar no-print"><span class="help">'+esc(hint)+'</span>'+(cancel?button(cancel,'undo','Annuler les modifications','sec',{title:'Revenir aux valeurs enregistrées'}):'')+button(action,'check',label,'pri')+'</div>';
}

// ---------- Onglet Réglages ----------
// getDraft : copie de travail des créneaux. Rafraîchie depuis le fichier tant qu'elle n'est pas modifiée.
function getDraft(){ if(!S.draft||!draftDirty()) S.draft=C.clone(S.data.shifts); return S.draft; }
// settingsView : onglet Réglages. Partie Général (titre, durée de journée, été / hiver), créneaux de travail
// (copie de travail S.draft), sauvegarde. Un seul bouton « Enregistrer les réglages » en bas de l'écran.
function settingsView(){
  const R=S.data.settings, draft=getDraft(), dirty=draftDirty();
  // md : 'MM-JJ' → « JJ/MM » pour l'affichage.
  function md(v){ return v.split('-').reverse().join('/'); }
  let h='<div class="head-section"><div><h2>Réglages</h2><p class="help">Les créneaux de travail et quelques règles générales.</p></div></div>'+
    '<div class="card"><h2>Général</h2><div class="grid-fields">'+
    '<label class="field" style="grid-column:1/-1"><span>Titre de la page</span><input type="text" id="setting-title" data-keep value="'+esc(R.title)+'" style="width:100%"></label>'+
    '<label class="field"><span>Passage aux horaires d’été</span><select id="setting-season" data-keep><option value="clock"'+(R.seasonMode==='clock'?' selected':'')+'>au changement d’heure</option><option value="dates"'+(R.seasonMode==='dates'?' selected':'')+'>à dates fixes</option></select></label>'+
    '<label class="field"><span>Début de l’été (si dates fixes)</span><input type="text" id="setting-summer" data-keep value="'+esc(md(R.summerStart))+'" placeholder="JJ/MM" inputmode="numeric"></label>'+
    '<label class="field"><span>Début de l’hiver (si dates fixes)</span><input type="text" id="setting-winter" data-keep value="'+esc(md(R.winterStart))+'" placeholder="JJ/MM" inputmode="numeric"></label>'+
    '</div><p class="help">Un salarié ne travaille jamais plus de '+C.MAX_DAY_HOURS+' h dans une journée (tous créneaux compris) : la génération ne dépasse jamais cette durée, et un dépassement fait à la main est signalé en rouge. Au changement d’heure, les horaires d’été vont de fin mars à fin octobre. Les jours de repos se règlent pour chaque personne dans l’onglet « Équipe ».</p></div>';
  h+=rulesCard()+holidaysCard();
  if(!S.data.shifts.length) h+='<div class="banner info">'+ico('cal')+'<div><b>Première mise en place : saisissez vos créneaux de travail.</b>'+
    '<ol class="setup-steps"><li>Cliquez sur « Ajouter un créneau » autant de fois que nécessaire, puis remplissez chaque ligne : activité, jours, horaires d’hiver et d’été, nombre de personnes.</li>'+
    '<li>Cliquez sur « Enregistrer les réglages ».</li><li>Saisissez ensuite votre équipe dans l’onglet « Équipe ».</li></ol></div></div>';
  h+='<div class="card"><h2>Créneaux de travail'+(dirty?' <span class="tag tag-warn">modifications non enregistrées</span>':'')+'</h2>'+
    '<div class="scroll"><table class="shifts"><thead><tr><th>Activité</th><th>Jours</th><th title="Facultatifs : sans horaires d’hiver, pas de créneau en hiver">Horaires d’hiver</th><th title="Facultatifs : sans horaires d’été, pas de créneau en été">Horaires d’été</th><th class="num" title="Nombre de personnes indispensables">Au moins</th><th class="num" title="Nombre de personnes au plus">Au plus</th><th class="center" title="Le gérant ne peut pas y être seul">Gérant jamais seul</th><th class="center" title="Afficher dans le planning même si personne n’est affecté">Afficher si personne</th><th title="Le créneau doit toujours être tenu, même si le gérant est en congé">Ne jamais laisser vide</th><th></th></tr></thead><tbody>';
  draft.forEach(function(p,i){
    // f : attributs communs d'un champ de l'éditeur de créneaux (identifiant, ligne, champ modifié).
    function f(field,attrs){ return 'id="shift-'+i+'-'+field+'" data-change="shift" data-i="'+i+'" data-f="'+field+'" '+attrs; }
    // tv : valeur affichée d'un horaire facultatif (vide s'il n'y en a pas).
    function tv(sn,k){ return p[sn]&&p[sn][k]?p[sn][k]:''; }
    function dur(sn){ const x=C.spanHours(p[sn]); return x?H(x):(tv(sn,'from')||tv(sn,'to')?'?':'aucun'); }
    h+='<tr><td><input type="text" class="shift-act" '+f('activity','value="'+esc(p.activity)+'"')+' placeholder="ex. Élevage" aria-label="Activité"></td>'+
      '<td><div class="days-cb">'+C.WEEK_LETTERS.map(function(l,j){ return '<label class="day-cb" title="'+C.WEEK_NAMES[j]+'"><input type="checkbox" '+f('day'+(j+1),p.days.indexOf(j+1)>=0?'checked':'')+' aria-label="'+C.WEEK_NAMES[j]+'"><span>'+l+'</span></label>'; }).join('')+'</div></td>'+
      ['winter','summer'].map(function(sn){ return '<td><span class="season-l">'+(sn==='summer'?'été':'hiver')+' · <span id="shift-'+i+'-'+sn+'-dur">'+esc(dur(sn))+'</span></span><input type="text" class="shift-time" '+f(sn+'-from','value="'+esc(tv(sn,'from'))+'"')+' placeholder="HH:MM" aria-label="Début '+(sn==='summer'?'été':'hiver')+'"> <input type="text" class="shift-time" '+f(sn+'-to','value="'+esc(tv(sn,'to'))+'"')+' placeholder="HH:MM" aria-label="Fin '+(sn==='summer'?'été':'hiver')+'"></td>'; }).join('')+
      '<td class="num"><input type="number" min="0" max="5" step="1" '+f('min','value="'+p.min+'"')+' aria-label="Minimum"></td>'+
      '<td class="num"><input type="number" min="1" max="5" step="1" '+f('max','value="'+p.max+'"')+' aria-label="Maximum"></td>'+
      '<td class="center"><input type="checkbox" '+f('alone',p.managerNeverAlone?'checked':'')+' aria-label="Gérant jamais seul"></td>'+
      '<td class="center"><input type="checkbox" '+f('showempty',p.showEmpty?'checked':'')+' aria-label="Afficher dans le planning même si personne n’est affecté"></td>'+
      '<td><div class="ne-cb">'+['summer','winter'].map(function(sn){ return '<label class="check"><input type="checkbox" '+f('ne-'+sn,p.neverEmpty&&p.neverEmpty[sn]?'checked':'')+'>'+(sn==='summer'?'été':'hiver')+'</label>'; }).join('')+'</div></td>'+
      '<td>'+button('shift-del','trash','Supprimer','subtle-danger',{small:true,id:i,title:'Supprimer ce créneau'})+'</td></tr>';
  });
  if(!draft.length) h+='<tr><td colspan="10" class="help">Aucun créneau pour l’instant : cliquez sur « Ajouter un créneau ».</td></tr>';
  h+='</tbody></table></div>'+
    '<ul class="help col-help">'+
      '<li><b>Activité</b> : texte libre (par exemple Élevage, Magasin). Un créneau n’a pas de nom : il est désigné par son activité et ses horaires (« Élevage 9h–13h »). Les créneaux de même activité sont additionnés dans « Temps par activité », et le planning individuel se filtre par activité.</li>'+
      '<li><b>Jours</b> : les jours de la semaine où le créneau existe.</li>'+
      '<li><b>Horaires d’hiver, d’été</b> : facultatifs, au format HH:MM (9h, 9h30 ou 9:30 sont acceptés) ; sans horaires pour une saison, le créneau n’existe pas pendant cette saison (il n’apparaît pas au planning).</li>'+
      '<li><b>Au moins</b> : nombre de personnes indispensables (0 = créneau facultatif).</li>'+
      '<li><b>Au plus</b> : les places en plus servent à compléter les heures.</li>'+
      '<li><b>Gérant jamais seul</b> : il faut quelqu’un d’autre avec lui.</li>'+
      '<li><b>Afficher si personne</b> : décoché, un créneau sans personne ce jour-là est masqué du planning (un magasin sans personne de tout le mois disparaît) ; un créneau indispensable resté vide reste affiché, en rouge.</li>'+
      '<li><b>Ne jamais laisser vide</b> : pour la saison cochée, le créneau doit toujours être tenu ; quand le gérant est en congé, la génération y place un autre salarié en priorité, et si c’est impossible le créneau est signalé en rouge avec la raison.</li>'+
    '</ul><p class="help">Changer un créneau change aussi les heures des plannings déjà enregistrés : pensez à les ajuster.</p>'+
    '<p class="help">'+ico('info')+' <b>Jours de présence du gérant</b> : ils se règlent sur sa fiche, dans l’onglet Équipe (créneaux et jours cochés). <button class="link" data-action="tab" data-id="employees">Ouvrir l’onglet Équipe</button></p>'+
    '<div class="actions" style="margin:12px 0 0">'+button('shift-add','plus','Ajouter un créneau','sec')+'</div></div>';
  h+='<div class="card"><h2>Sauvegarde</h2><p class="help">Toutes les modifications sont notées dans le fichier <code>'+C.LOG_FILE+'</code>, à côté de cette page. Vous pouvez aussi télécharger une copie complète des données.</p>'+
    '<div class="actions" style="margin:12px 0 0">'+button('backup','download','Télécharger une sauvegarde des données','sec')+'</div></div>';
  h+=saveBar('save-all-settings','Enregistrer les réglages','Enregistre en une fois le général, les règles, les jours fériés et les créneaux.','cancel-settings');
  return h;
}
// rulesCard : Réglages > Règles de répartition. Les règles absolues sont rappelées ; les autres se cochent et se
// classent par glisser-déposer (ou avec les flèches) : l'ordre fixe la priorité dans la génération (Core.ruleWeights).
function rulesCard(){
  const list=getRulesDraft(), dirty=rulesDirty();
  let h='<div class="card"><h2>Règles de répartition'+(dirty?' <span class="tag tag-warn">modifications non enregistrées</span>':'')+'</h2>'+
    '<p class="help"><b>Toujours respectées</b> : chacun sur ses créneaux et ses jours, jamais sur deux créneaux à la fois, jamais un jour de congé, gérant jamais seul là où c’est demandé, jours de repos par semaine. Puis les créneaux indispensables sont tenus.</p>'+
    '<p class="help"><b>Ensuite, les règles cochées ci-dessous, de la plus importante à la moins importante</b>, puis les heures à faire du mois. Faites glisser une règle pour changer son rang (ou utilisez les flèches). Chaque règle compte dix fois plus que la suivante : elle n’est sacrifiée à une règle plus bas que si c’est impossible autrement. Une règle décochée n’est pas appliquée.</p>'+
    '<ol class="rules">';
  list.forEach(function(r,i){
    const d=C.RULES.filter(function(x){return x.id===r.id;})[0];
    h+='<li class="rule'+(r.on?'':' off')+'" draggable="true" data-rule="'+esc(r.id)+'" data-i="'+i+'" title="Faites glisser pour changer le rang">'+
      '<span class="rule-grip" aria-hidden="true">'+ico('grip')+'</span><span class="rule-rank">'+(i+1)+'</span>'+
      '<span class="rule-text"><label class="check rule-label"><input type="checkbox" data-change="rule-on" data-id="'+esc(r.id)+'"'+(r.on?' checked':'')+'>'+esc(d.label)+'</label><span class="help">'+esc(d.help)+'</span></span>'+
      '<span class="rule-move"><button class="btn btn-subtle btn-small" data-action="rule-move" data-id="'+i+'" data-dir="-1" aria-label="Monter : '+esc(d.label)+'"'+(i===0?' disabled':'')+'>'+ico('up')+'</button>'+
      '<button class="btn btn-subtle btn-small" data-action="rule-move" data-id="'+i+'" data-dir="1" aria-label="Descendre : '+esc(d.label)+'"'+(i===list.length-1?' disabled':'')+'>'+ico('down')+'</button></span></li>';
  });
  return h+'</ol></div>';
}
// holidaysCard : Réglages > Jours fériés, saisis à la main, autant que nécessaire (copie de travail S.holDraft, enregistrée

function holidaysCard(){

    '<p class="help">Ajoutez à la main les jours fériés, autant que nécessaire. Ils sont affichés dans le planning. Un congé posé un jour férié, comme un congé un dimanche, reste affiché mais <b>n’est pas décompté</b> du solde de congés ni des heures à faire. Ils ne changent rien d’autre : les créneaux de ces jours-là restent à tenir.</p>';
  if(list.length) h+='<div class="holidays">'+list.map(function(x,i){
    return '<div class="holiday-row"><input type="date" id="hol-'+i+'-date" data-change="holiday" data-i="'+i+'" data-f="date" value="'+esc(x.date)+'" aria-label="Date du jour férié">'+
      '<input type="text" id="hol-'+i+'-name" data-change="holiday" data-i="'+i+'" data-f="name" value="'+esc(x.name)+'" maxlength="40" placeholder="Nom (facultatif), par exemple Noël" aria-label="Nom du jour férié">'+
      (x.date&&C.isValidIso(x.date)?'<span class="help">'+esc(C.longDate(x.date))+' ('+esc(C.WEEK_NAMES[C.weekday(x.date)-1])+')</span>':'')+
